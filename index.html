/* 头像 key 归一化：非法/缺失值一律归零，由调用方决定是走插画还是走首字兜底。
   集中在这里，是为了让「老数据没有 avatar 字段」和「手改 JSON 写了个不存在的 key」
   走同一条兜底路径 —— 两种情况都不该让头像位置变成空白。 */
const avKey = v => (v && AV_MAP[v]) ? v : "";

/* 把一款头像画成 SVG。color = 用户自选的球衣色，底色/球衣都跟着它走。 */
function avatarSVG(key, color){
  const a = AV_MAP[key];
  if(!a) return "";
  const c = color || "#8B5CF6";
  const skin = a.skin, hairC = a.hairC;
  const parts = [
    `<circle cx="60" cy="60" r="60" fill="color-mix(in srgb,${c} 20%,var(--bg-elev))"/>`,
    /* 颈 → 肩（肩画在颈之后，衣领正好压住脖子下缘） */
    `<path d="M50 76h20v26H50z" fill="${skin}" ${AV_LN(3.2)}/>`,
    `<path d="M12 124C12 106 34 96 60 96C86 96 108 106 108 124Z" fill="${c}" ${AV_LN(3.4)}/>`,
    `<path d="M47 100l13 12 13-12" fill="none" ${AV_LN(2.8)} opacity=".3"/>`,
    a.back ? a.back(hairC, skin) : "",
    /* 耳朵先画，被头压住一半才像耳朵 */
    `<circle cx="31" cy="56" r="9" fill="${skin}" ${AV_LN(3)}/>`,
    `<circle cx="89" cy="56" r="9" fill="${skin}" ${AV_LN(3)}/>`,
    `<ellipse cx="60" cy="54" rx="30" ry="32" fill="${skin}" ${AV_LN(3.4)}/>`,
    a.hair ? a.hair(hairC) : "",
    a.face(hairC, skin),
    (a.acc || []).map(([k, col]) => (AV_ACC[k] ? AV_ACC[k](col || "#3A3350") : "")).join("")
  ];
  return `<svg viewBox="0 0 120 120" fill="none" aria-hidden="true">${parts.join("")}</svg>`;
}

/* 列表/详情里统一走这个：有自选头像就用插画，否则退回「色块 + 姓名首字」。
   历史档案没有 avatar 字段，自动落到兜底分支，老数据零影响。 */
function avatarHTML(name, color, key){
  const k = avKey(key);
  const col = color || hashColor(name);
  const svg = k ? avatarSVG(k, col) : "";
  return svg
    ? `<div class="avatar" style="background:${esc(col)}" data-av="${esc(k)}">${svg}</div>`
    : `<div class="avatar avatar-txt" style="background:${esc(col)}">${esc(initials(name))}</div>`;
}

/* ============================================================================
   动效：完成 / 升级 的因果反馈
   ============================================================================ */
function burstConfetti(){
  if(prefersReduced()) return;
  try{
    const box = $("#confetti");
    if(!box) return;
    const colors = ["var(--accent)","var(--accent-2)","var(--sun)","var(--win)","var(--accent-3)","var(--loss)"];
    for(let i = 0; i < 44; i++){
      const p = document.createElement("i");
      const w = 5 + Math.random() * 7;
      p.style.position = "absolute";
      p.style.left = (6 + Math.random() * 88) + "vw";
      p.style.top = "-18px";
      p.style.width = w + "px";
      p.style.height = (w * 0.62) + "px";
      p.style.background = colors[i % colors.length];
      setCssVar(p, "--cx", (Math.random() * 170 - 85) + "px");
      setCssVar(p, "--cy", (250 + Math.random() * 200) + "px");
      setCssVar(p, "--cr", (Math.random() * 760 - 380) + "deg");
      p.style.animation = `confettiFall ${900 + Math.random() * 500}ms cubic-bezier(.3,.7,.6,1) forwards`;
      p.style.animationDelay = (Math.random() * 150) + "ms";
      box.appendChild(p);
      setTimeout(() => { try{ p.remove(); }catch(e){} }, 1700);
    }
  }catch(e){}
}
/* 一次成功的完整反馈：彩带 + 小羽报喜 */
function celebrate(msg, mood){
  burstConfetti();
  toast(msg, "ok", mood || "win");
}
/* 当前连胜场数（按日期由新到旧连续计数） */
function winStreak(list){
  const m = (list || [])
    .filter(s => isMatch(s) && parseScore(s.score).sets.length)
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  let n = 0;
  for(const x of m){
    if(parseScore(x.score).result === "win") n++; else break;
  }
  return n;
}

/* ============================================================================
   Hero —— 全局唯一的"大声"区域
   ============================================================================ */
function heroBand(opt){
  const o = opt || {};
  const chips = (o.chips || []).map(c =>
    `<span class="hero-chip">${icon(c.icon || "check")}${c.label} <b>${c.value}</b></span>`
  ).join("");
  return `<section class="hero">
    <div class="hero-copy">
      <div class="hero-eyebrow">${esc(o.eyebrow || "本周战报")}</div>
      <h2 class="hero-title">${o.title || ""}</h2>
      <p class="hero-say">「${o.say || ""}」</p>
      ${chips ? `<div class="hero-chips">${chips}</div>` : ""}
    </div>
    <div class="hero-art">${mascot(o.mood || "happy", { size:132 })}</div>
  </section>`;
}

/* 依据数据决定小羽说什么 —— 语气永远"鼓励式"，不做评判 */
function heroFor(st, sessions){
  const scored = (sessions || []).filter(s => isMatch(s) && parseScore(s.score).sets.length);
  const streak = winStreak(scored);
  // 连胜期间的对手（用来做具体化的夸赞）
  const streakOpp = streak > 0 ? opponentLabel(scored[0]) : "";

  const chips = [
    { icon:"list",    label:"场次", value: st.total },
    { icon:"trend",   label:"胜率", value: num1(st.winRate) + "%" },
    { icon:"clock",   label:"时长", value: num1(st.totalHours) + "h" }
  ];

  if(!st.total){
    return { eyebrow:"欢迎来到羽迹", mood:"wave",
      title:`还没上场？<em>先记一场</em>吧`,
      say:"我是小羽，你的球场搭子。记满 3 场，我就能看出你的状态曲线了。",
      chips:[] };
  }
  if(streak >= 3){
    return { eyebrow:`${streak} 连胜进行中`, mood:"cheer",
      title:`手感正烫，<em>${streak} 连胜</em>！`,
      say: streakOpp ? `连着拿下 ${streakOpp} 这组，这个节奏保持住。` : "这个节奏保持住，对面该慌了。",
      chips };
  }
  if(st.pending > 0){
    return { eyebrow:"有账没结", mood:"coach",
      title:`还差 <em>${st.pending} 场</em>没填比分`,
      say:"比分补上，胜率才准。别让好球白打了。",
      chips };
  }
  if(st.winRate >= 55){
    return { eyebrow:"状态在线", mood:"happy",
      title:`胜率稳在 <em>${num1(st.winRate)}%</em>`,
      say: streak >= 1 ? "最近一场也拿下了，手感在往上走。" : "稳住基本盘，偶尔冲一下更强的对手。",
      chips };
  }
  if(st.winRate < 40 && st.matches >= 5){
    return { eyebrow:"低谷期", mood:"coach",
      title:`胜率 <em>${num1(st.winRate)}%</em>，正在爬坡`,
      say:"赢球靠实力，实力靠场次。把步伐练顺，数字自然会回来。",
      chips };
  }
  return { eyebrow:"本周战报", mood:"happy",
    title:`已经打了 <em>${st.total} 场</em>`,
    say:"有输有赢才叫打球。继续记，我们看长期曲线。",
    chips };
}


let currentPage = "dashboard";

function renderNav(){
  const nav = $("#nav");
  let html = "", lastGroup = "";
  PAGES.forEach(p => {
    if(p.hidden) return;
    if(p.group !== lastGroup){ html += `<div class="nav-group-label">${p.group}</div>`; lastGroup = p.group; }
    const b = p.badge ? p.badge() : null;
    html += `<button class="nav-item ${p.id===currentPage?"active":""}" data-page="${p.id}">
      ${icon(p.icon)}<span>${p.label}</span>${b!==null && b!==undefined ? `<span class="nav-badge">${b}</span>` : ""}</button>`;
  });
  nav.innerHTML = html;

  /* 移动端底部 Tab：由 PAGES 驱动，不再写死 id 列表。
     直出 = tabPages()，「更多」= morePages()。两者并集覆盖全部可见页面。 */
  const tabs = tabPages(), rest = morePages();
  const moreOn = rest.some(p => p.id === currentPage);
  $("#tabbar").innerHTML =
    tabs.map(p => `<button class="tab ${p.id===currentPage?"on":""}" data-page="${p.id}" aria-label="${p.label}">${icon(p.icon)}<span>${tabLabel(p)}</span></button>`).join("")
    + (rest.length ? `<button class="tab ${moreOn?"on":""}" data-more="1" aria-label="更多">${icon("dots")}<span>更多</span></button>` : "");
}

/* 移动端「更多」面板：收纳未直接进 Tab 的页面，保证没有页面不可达 */
function moreSheet(){
  const items = morePages();
  if(!items.length) return;
  const root = $("#modalRoot");
  const mask = document.createElement("div");
  mask.className = "modal-mask sheet-mask";
  mask.innerHTML = `<div class="modal sheet">
    <div class="sheet-grip"></div>
    <div class="modal-head"><h3>更多</h3>
      <button class="btn btn-ghost btn-icon x" data-close>${icon("x")}</button></div>
    <div class="modal-body">
      <div class="grid" style="gap:9px">
        ${items.map(p => {
          const b = p.badge ? p.badge() : null;
          const hasB = b !== null && b !== undefined && b !== 0;
          return `<button class="btn sheet-item" data-goto="${p.id}">
            ${icon(p.icon)}
            <div style="text-align:left;margin-left:4px;flex:1;min-width:0">
              <div style="font-weight:650">${p.label}</div>
              <div class="hintline">${p.sub || ""}</div>
            </div>
            ${hasB ? `<span class="nav-badge">${b}</span>` : ""}</button>`;
        }).join("")}
      </div>
    </div>
  </div>`;
  root.appendChild(mask);
  const close = () => mask.remove();
  $$("[data-close]", mask).forEach(b => b.onclick = close);
  mask.addEventListener("mousedown", e => { if(e.target === mask) close(); });
  $$("[data-goto]", mask).forEach(b => b.onclick = () => { close(); go(b.dataset.goto); });
}
function go(page){
  if(!PAGES.find(p => p.id === page)) page = "dashboard";
  currentPage = page;
  const p = PAGES.find(x => x.id === page);
  $("#pageTitle").textContent = p.label;
  $("#pageSub").textContent = p.sub || "";
  renderNav();
  const view = $("#view");
  view.innerHTML = "";
  window.scrollTo({ top:0, behavior:"instant" in window ? "instant" : "auto" });
  p.render(view);
}

function renderDashboard(root){
  const sessions = rangeSessions();

  // 环比：与上一个等长周期比较
  const days = state.settings.range;
  let prevSt = null;
  if(days){
    const prev = state.sessions.filter(s => {
      const a = daysAgo(s.date);
      return a > days && a <= days*2;

    prevSt = computeStats(prev);
  }
  const delta = (cur, before, unit="", invert=false) => {
    if(before == null || before === 0) return `<span class="delta flat">—</span>`;
    const d = cur - before;
    if(Math.abs(d) < 0.05) return `<span class="delta flat">持平</span>`;
    const good = invert ? d < 0 : d > 0;
    return `<span class="delta ${good?"up":"down"}">${d>0?"▲":"▼"} ${num1(Math.abs(d))}${unit}</span>`;
  };

  const hero = heroFor(st, sessions);
  root.innerHTML = `

    ${st.pending ? `

      ${icon("info")}

      <div class="stat">

        <div class="stat-value" style="color:${st.winRate >= 50 ? "var(--win)" : "var(--loss)"}">${num1(st.winRate)}<small>%</small></div>
        <div class="stat-foot">${st.wins} 胜 ${st.losses} 负${st.draws ? ` ${st.draws} 平` : ""}${st.pending ? ` · ${st.pending} 待补` : ""}</div>
      </div>
      <div class="stat">
        <div class="stat-label">累计时长</div>
        <div class="stat-value">${num1(st.totalHours)}<small>小时</small></div>
        <div class="stat-foot">${delta(st.totalHours, prevSt ? prevSt.totalHours : null, "h")}<span>较上一周期</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">目标达成</div>
        <div class="stat-value">${state.goals.filter(g => g.status === "done").length}<small>/${state.goals.length}</small></div>
        <div class="stat-foot">${state.goals.filter(g => g.status === "active").length} 个进行中</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-head"><h3>分项战绩</h3><span class="hint">按项目拆分的胜率与训练量</span>
        <div class="right"><button class="btn btn-sm" id="goSessions2">查看记录</button></div></div>
      <div class="card-body"><div class="grid g4" id="discGrid"></div></div>
    </div>

    <div class="grid g2 ratio-16-10" style="margin-bottom:14px">
      <div class="card">
        <div class="card-head">
          <h3>水平趋势</h3>
          <span class="hint">综合评分（技术 / 体能 / 意识 × 近期表现）</span>
          <div class="right"><span class="tag tag-accent" id="trendTag">—</span></div>
        </div>
        <div class="card-body" id="trendChart"></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>比赛战绩</h3></div>
        <div class="card-body" id="donutChart"></div>
      </div>
    </div>

    <div class="grid g2" style="margin-bottom:14px">
      <div class="card">
        <div class="card-head"><h3>每周训练量</h3><span class="hint">近 12 周 · 单位：小时</span></div>
        <div class="card-body" id="weeklyChart"></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>技术能力雷达</h3><span class="hint">当前自评（0–10）</span></div>
        <div class="card-body" id="radarChart"></div>
      </div>
    </div>

    <div class="grid g2" style="margin-bottom:14px">
      <div class="card">
        <div class="card-head"><h3>搭档配合胜率</h3><span class="hint">双打 / 混双 · 按搭档对比</span>
          <div class="right"><button class="btn btn-sm" id="goPartners">搭档档案</button></div></div>
        <div class="card-body" id="partnerMini"></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>双打 / 单打胜率趋势</h3><span class="hint">滚动 5 场</span></div>
        <div class="card-body" id="discTrend"></div>
      </div>
    </div>

    <div class="grid g2" style="margin-bottom:14px">
      <div class="card">
        <div class="card-head"><h3>技术成长对比</h3><span class="hint">首次 vs 最新</span><div class="right"><button class="btn btn-sm" id="goSkills">查看详情</button></div></div>
        <div class="card-body" id="skillCompare"></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>胜率趋势</h3><span class="hint">滚动窗口</span></div>
        <div class="card-body" id="winrateChart"></div>
      </div>
    </div>

    <div class="grid g2">
      <div class="card">
        <div class="card-head"><h3>进行中的目标</h3><div class="right"><button class="btn btn-sm" id="goGoals">全部目标</button></div></div>
        <div class="card-body" id="goalMini"></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>最近记录</h3><div class="right"><button class="btn btn-sm" id="goSessions">全部记录</button></div></div>
        <div class="card-body" id="recentMini" style="padding-top:6px"></div>
      </div>
    </div>
  `;

  /* --- 分项战绩卡（单打 / 双打 / 混双） --- */
  const discEl = $("#discGrid");
  if(discEl){
    const buckets = byDiscipline(state.sessions);
    discEl.innerHTML = DISCIPLINES.map(d => {
      const list = buckets[d] || [];
      if(!list.length) return "";
      const s = computeStats(list);
      const color = d === "双打" ? "var(--accent)" : d === "混双" ? "var(--accent-2)" : d === "单打" ? "var(--warn)" : "var(--text-3)";
      return `<div style="padding:11px 12px;border-radius:var(--r-sm);background:var(--bg-sunken);border:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
          <span style="font-size:12px;font-weight:700;color:${color};letter-spacing:.4px">${d}</span>
          <span class="hintline" style="margin-left:auto">${s.total} 次</span>
        </div>
        <div class="stat-value" style="font-size:23px;margin-top:0">${s.matches ? num1(s.winRate) + "<small>%</small>" : "—"}</div>
        <div class="hintline" style="margin-top:2px">${s.matches ? `${s.wins} 胜 ${s.losses} 负 · ${num1(s.totalHours)}h` : `${num1(s.totalHours)} 小时训练`}</div>
      </div>`;
    }).join("") || `<div style="grid-column:1/-1">${emptyState("chart","还没有记录，记一场就有分项战绩了")}</div>`;
  }

  /* --- 搭档配合胜率对比 --- */
  const pmEl = $("#partnerMini");
  if(pmEl){
    const ps = partnerStats(state.sessions);
    if(!ps.length) pmEl.innerHTML = emptyChart(210, "还没有搭档记录");
    else chart.bar(pmEl, {
      labels: ps.map(x => x.name),
      data: ps.map(x => x.winRate),
      color: "var(--accent-2)", yFmt: v => num1(v)
    });
  }

  /* --- 各项目滚动胜率趋势（双打 vs 单打） --- */
  const dtEl = $("#discTrend");
  if(dtEl){
    const series = [];
    ["双打", "混双", "单打"].forEach((d, idx) => {
      const ms = state.sessions.filter(s => isMatch(s) && disciplineOf(s) === d).sort((a, b) => a.date < b.date ? -1 : 1);
      if(ms.length < 2) return;
      const W = Math.min(5, ms.length);
      const labs = [], vals = [];
      for(let k = W - 1; k < ms.length; k++){
        const win = ms.slice(k - W + 1, k + 1).filter(m => parseScore(m.score).result === "win").length;
        labs.push(fmtShort(ms[k].date));
        vals.push(win / W * 100);
      }
      series.push({ d, labs, vals, color: d === "双打" ? "var(--accent)" : d === "混双" ? "var(--accent-2)" : "var(--warn)" });
    });
    if(!series.length) dtEl.innerHTML = emptyChart(210, "比赛记录不足");
    else {
      // 以最长序列的日期轴为准，短序列前补 null 对齐
      const maxLen = Math.max.apply(null, series.map(s => s.labs.length));
      const labels = (series.find(s => s.labs.length === maxLen) || series[0]).labs;
      chart.line(dtEl, {
        labels, yMin: 0, yMax: 100, yFmt: v => num1(v),
        series: series.map(s => ({
          name: `${s.d}（滚动胜率）`,
          color: s.color,
          data: new Array(maxLen - s.vals.length).fill(null).concat(s.vals)
        }))
      });
    }
  }

  /* --- 水平趋势：综合评分 = 技术均分*0.5 + 体能均分*0.25 + 意识均分*0.25，按 12 周内每个有记录的周计算 --- */
  const catAvg = cat => avg(TECH_ITEMS.filter(t => t.cat === cat).map(t => { const c = skillCurrent(t.id); return c ? c.score : 0; }).filter(v => v > 0));
  const techNow = catAvg("技术"), bodyNow = catAvg("身体"), mindNow = catAvg("意识");
  const compositeNow = techNow*0.5 + bodyNow*0.25 + mindNow*0.25;

  // 用技术历史的时间点构造综合曲线
  const allDates = Array.from(new Set(state.skills.map(s => s.date))).sort().slice(-12);
  const labels = [], values = [], winSeries = [];
  allDates.forEach(dt => {
    const v = tid => { const items = state.skills.filter(s => s.techId === tid && s.date === dt); return items.length ? avg(items.map(i => i.score)) : null; };
    const a = avg(TECH_ITEMS.filter(t=>t.cat==="技术").map(t=>v(t.id)).filter(x=>x!=null));
    const bb = avg(TECH_ITEMS.filter(t=>t.cat==="身体").map(t=>v(t.id)).filter(x=>x!=null));
    const c = avg(TECH_ITEMS.filter(t=>t.cat==="意识").map(t=>v(t.id)).filter(x=>x!=null));
    if(a==null && bb==null && c==null) return;
    labels.push(fmtShort(dt));
    values.push((a||0)*0.5 + (bb||0)*0.25 + (c||0)*0.25);
  });
  $("#trendChart") && chart.line($("#trendChart"), {
    labels, yMin: 0, yMax: 10, yFmt: v => num1(v),
    series: [{ name:"综合水平", data: values, color:"var(--accent)" }]
  });
  const tTag = $("#trendTag");
  if(tTag && values.length >= 2){
    const dv = values[values.length-1] - values[0];
    tTag.textContent = `${dv>=0?"▲":"▼"} ${num1(Math.abs(dv))} 分`;
    tTag.className = "tag " + (dv >= 0 ? "tag-win" : "tag-loss");
  } else if(tTag) tTag.textContent = num1(compositeNow) + " 分";

  /* --- 战绩环形 --- */
  const donutEl = $("#donutChart");
  if(donutEl){
    if(st.matches === 0) donutEl.innerHTML = emptyChart(180, "还没有比赛记录");
    else chart.donut(donutEl, {
      segments: [
        { name:"胜", value: st.wins, color:"var(--win)" },
        { name:"负", value: st.losses, color:"var(--loss)" },
        ...(st.draws ? [{ name:"平", value: st.draws, color:"var(--warn)" }] : [])
      ],
      center: num1(st.winRate) + "%", centerSub: `${st.matches} 场比赛`
    });
  }

  /* --- 每周训练量 --- */
  const weeks = weeklyBuckets(sessions.length ? state.sessions : [], 12);
  const wEl = $("#weeklyChart");
  if(wEl) chart.bar(wEl, {
    labels: weeks.map(w => w.label),
    data: weeks.map(w => sum(w.sessions.map(s => +s.duration||0)) / 60),
    yFmt: v => num1(v)
  });

  /* --- 雷达 --- */
  /* 标签一律走 t.short：名字不在这里做字符串裁剪。
     曾经写成 `t.name.slice(0,4)`，把「发球（小球）」切成「发球（小」——半截括号。 */
  const radarItems = ["技术","身体","意识"].flatMap(cat =>
    TECH_ITEMS.filter(t => t.cat === cat).map(t => {
      const c = skillCurrent(t.id);
      return { name: t.short, value: c ? c.score : 0, cat };
    })
  );
  const rdEl = $("#radarChart");
  if(rdEl) chart.radar(rdEl, { items: radarItems, empty: "还没有自评记录 —— 去技术评估打一次分" });

  /* --- 技术成长对比 --- */
  const cmpEl = $("#skillCompare");
  if(cmpEl){
    const rows = TECH_ITEMS.map(t => {
      const c = skillCurrent(t.id);
      return c ? { name:t.name, first: c.history[0].score, last: c.score, diff: c.score - c.history[0].score } : null;
    }).filter(Boolean).sort((a,b) => b.diff - a.diff);
    if(!rows.length){ cmpEl.innerHTML = emptyState("radar","还没有自评记录"); }
    else {
      const top = rows.slice(0, 3), bottom = rows.slice(-3).reverse();
      const row = r => `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">
        <div style="flex:1;font-size:13.5px;font-weight:550;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</div>
        <div class="num" style="font-size:12px;color:var(--text-3)">${num1(r.first)} → <b style="color:var(--text);font-size:13.5px">${num1(r.last)}</b></div>
        <div class="delta ${r.diff>=0?"up":"down"}" style="min-width:46px;text-align:right">${r.diff>=0?"+":""}${num1(r.diff)}</div>
      </div>`;
      cmpEl.innerHTML = `
        <div style="font-size:11.5px;font-weight:700;color:var(--loss);letter-spacing:.6px;margin-bottom:4px">进步最快</div>
        ${top.map(row).join("")}
        <div style="font-size:11.5px;font-weight:700;color:var(--warn);letter-spacing:.6px;margin:14px 0 4px">需要加强</div>
        ${bottom.map(row).join("")}`;
    }
  }

  /* --- 胜率趋势（滚动 5 场） --- */
  const wrEl = $("#winrateChart");
  if(wrEl){
    const ms = state.sessions.filter(isMatch).sort((a,b) => a.date < b.date ? -1 : 1);
    if(ms.length < 2) wrEl.innerHTML = emptyChart(210, "比赛记录不足 2 场");
    else {
      const W = Math.min(5, ms.length);
      const labs = [], vals = [];
      for(let i=W-1;i<ms.length;i++){
        const win = ms.slice(i-W+1, i+1).filter(m => parseScore(m.score).result === "win").length;
        labs.push(fmtShort(ms[i].date));
        vals.push(win / W * 100);
      }
      chart.line(wrEl, { labels: labs, yMin: 0, yMax: 100, yFmt: v => num1(v), series: [{ name:`滚动 ${W} 场胜率(%)`, data: vals, color:"var(--win)" }] });
    }
  }

  /* --- 目标迷你列表 --- */
  const gm = $("#goalMini");
  if(gm){
    const active = state.goals.filter(g => g.status !== "done").slice(0, 3);
    gm.innerHTML = active.length ? active.map(g => `
      <div style="padding:10px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
          <span style="font-weight:620;font-size:13.5px;flex:1">${esc(g.title)}</span>
          <span class="tag tag-neutral tag-sm">${esc(g.cat)}</span>
          <span class="num" style="font-size:12.5px;font-weight:700">${Math.round(g.progress)}%</span>
        </div>
        <div class="bar"><i style="width:${clamp(g.progress,0,100)}%"></i></div>
        ${g.due ? `<div class="hintline" style="margin-top:5px">截止 ${fmtDate(g.due)}${daysAgo(g.due) > 0 ? ` · <span style="color:var(--win)">已逾期 ${daysAgo(g.due)} 天</span>` : ` · 剩 ${-daysAgo(g.due)} 天`}</div>` : ""}
      </div>`).join("") : `<div>${emptyState("flag","还没有进行中的目标","<button class='btn btn-primary btn-sm' data-new-goal>设定目标</button>")}</div>`;
  }

  /* --- 最近记录 --- */
  const rm = $("#recentMini");
  if(rm){
    const recent = state.sessions.slice().sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 5);
    rm.innerHTML = recent.length ? `<div class="timeline">${recent.map(s => {
      const p = parseScore(s.score);
      const cls = p.result === "win" ? "win" : p.result === "loss" ? "loss" : "";
      const d = disciplineOf(s);
      const partner = partnerOf(s);
      const oppTxt = opponentsOf(s).join(" + ");
      return `<div class="tl-item" style="padding-bottom:13px">
        <div class="tl-dot ${cls}"></div>
        <div class="tl-head">
          <span class="tl-title">${esc(d)}${partner ? ` · 搭档 ${esc(partner)}` : ""}${oppTxt ? ` vs ${esc(oppTxt)}` : ""}</span>
          ${p.result ? `<span class="tag tag-sm ${RESULT_CLASS[p.result]}">${RESULT_LABEL[p.result]}</span>` : ""}
          <span class="tl-date">${fmtDate(s.date)}</span>
        </div>
        <div class="tl-body">${s.duration ? `${s.duration} 分钟` : ""}${s.place ? ` · ${esc(s.place)}` : ""}${p.sets.length ? ` · <span class="num">${p.sets.map(x => `${x.a}-${x.b}`).join(" ")}</span>` : ""}</div>
      </div>`;
    }).join("")}</div>` : `<div>${emptyState("court","还没有任何记录，上场就算赢第一步","<button class='btn btn-primary btn-sm' data-new-session>添加第一条记录</button>")}</div>`;
  }

  /* 事件绑定 */
  $("#goSkills")   && ($("#goSkills").onclick = () => go("skills"));
  $("#goGoals")    && ($("#goGoals").onclick = () => go("goals"));
  $("#goSessions") && ($("#goSessions").onclick = () => go("sessions"));
  $("#goSessions2")&& ($("#goSessions2").onclick = () => go("sessions"));
  $("#goPartners") && ($("#goPartners").onclick = () => go("partners"));
  $("#goPending")  && ($("#goPending").onclick = () => { sessionFilter.result = "pending"; renderSessions($("#view")); go("sessions"); });
  $$("[data-new-goal]", root).forEach(b => b.onclick = () => goalModal());
  $$("[data-new-session]", root).forEach(b => b.onclick = () => sessionModal());
}

/* ------------------------- 7. 页面：训练比赛 ------------------------- */
const sessionFilter = { disc:"", result:"", q:"", from:"", to:"", person:"" };

function sessionModal(edit){
  const s = edit || {
    id:"", date: todayISO(), type:"比赛", discipline:"双打", duration:90,
    partner:"", opponents:[], opponent:"", score:"", place:"", rpe:6, mood:"不错", tags:[], note:""
  };
  const moods = ["轻松","不错","充实","一般","吃力","紧张","兴奋","遗憾","低落"];
  const presets = ["男双","女双","混双","单打","基础训练","体能","步伐","杀球","网前","高远球","多球","专项","教练课","对练"];
  const curDisc = disciplineOf(s);
  const curOpps = opponentsOf(s);
  const people = state.rivals.map(r => r.name);

  modal({
    title: edit ? "编辑记录" : "新增记录",
    wide: true,
    body:`
      <div class="grid g3">
        <div class="field"><label>日期 <span class="req">*</span></label>
          <input class="input" type="date" id="f_date" value="${esc(s.date)}"></div>
        <div class="field"><label>项目 <span class="req">*</span></label>
          <select class="select" id="f_disc">
            ${DISCIPLINES.map(d => `<option ${curDisc === d ? "selected" : ""}>${d}</option>`).join("")}
          </select></div>
        <div class="field"><label>时长（分钟）</label>
          <input class="input" type="number" id="f_duration" min="0" max="600" step="5" value="${esc(s.duration)}"></div>
      </div>

      <div class="grid g2" style="margin-top:14px" id="teamRow">
        <div class="field" id="partnerField">
          <label>我的搭档 <span class="hintline" style="font-weight:400">（双打 / 混双）</span></label>
          <input class="input" id="f_partner" list="peopleList" placeholder="如：小王" value="${esc(s.partner || "")}">
        </div>
        <div class="field">
          <label id="oppLabel">对手</label>
          <input class="input" id="f_opp1" list="peopleList" placeholder="如：老张" value="${esc(curOpps[0] || "")}">
          <input class="input" id="f_opp2" list="peopleList" placeholder="对手 2（双打）"
            style="margin-top:6px;display:${isDoubles(curDisc) ? "block" : "none"}" value="${esc(curOpps[1] || "")}">
        </div>
      </div>
      <datalist id="peopleList">${people.map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist>

      <div class="grid g3" style="margin-top:14px">
        <div class="field"><label>比分（我方在前）</label>
          <input class="input" id="f_score" placeholder="21-19,17-21,21-15" value="${esc(s.score)}">
          <span class="hintline">多局用逗号分隔，例如 21-19,17-21,21-15</span></div>
        <div class="field"><label>场地</label>
          <input class="input" id="f_place" placeholder="如：市体育馆 3 号场" value="${esc(s.place)}"></div>
        <div class="field"><label>强度（RPE 1–10）</label>
          <div class="rate"><input type="range" id="f_rpe" min="1" max="10" value="${esc(s.rpe)}"><span class="val" id="rpeVal">${esc(s.rpe)}</span></div></div>
      </div>

      <div class="grid g2" style="margin-top:14px">
        <div class="field"><label>感受</label>
          <select class="select" id="f_mood">${moods.map(m => `<option ${s.mood === m ? "selected" : ""}>${m}</option>`).join("")}</select></div>
        <div class="field"><label>结果预览</label>
          <div id="resultPreview" style="padding:8px 11px;background:var(--bg-sunken);border-radius:var(--r-sm);border:1px solid var(--border);min-height:38px;display:flex;align-items:center;font-size:13.5px;color:var(--text-3)">填写比分后自动判定</div></div>
      </div>

      <div class="field" style="margin-top:14px"><label>标签</label>
        <div class="row" id="tagBox" style="gap:6px">
          ${presets.map(t => `<button type="button" class="btn btn-sm ${(s.tags||[]).indexOf(t) >= 0 ? "btn-primary" : ""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}
        </div>
      </div>
      <div class="field" style="margin-top:14px"><label>备注</label>
        <textarea class="textarea" id="f_note" placeholder="今天练了什么？有什么收获或问题？">${esc(s.note)}</textarea></div>
    `,
    onMount(bd){
      const rpe = $("#f_rpe", bd);
      rpe.oninput = () => { $("#rpeVal", bd).textContent = rpe.value; };

      const disc = $("#f_disc", bd);
      const partnerField = $("#partnerField", bd);
      const opp2 = $("#f_opp2", bd);
      const oppLabel = $("#oppLabel", bd);

      const syncDisc = () => {
        const d = disc.value;
        const dbl = isDoubles(d);
        opp2.style.display = dbl ? "block" : "none";
        partnerField.style.display = dbl ? "flex" : "none";
        oppLabel.textContent = dbl ? "对方组合（2 人）" : d === "单打" ? "对手" : "对手 / 搭档";
        if(!dbl) $("#f_partner", bd).value = "";
      };
      disc.onchange = syncDisc;
      syncDisc();

      const scoreEl = $("#f_score", bd);
      const prev = $("#resultPreview", bd);
      const syncScore = () => {
        const p = parseScore(scoreEl.value);
        if(!p.sets.length){ prev.innerHTML = `<span style="color:var(--text-3)">填写比分后自动判定</span>`; return; }
        const cls = p.result === "win" ? "tag-win" : p.result === "loss" ? "tag-loss" : "tag-draw";
        prev.innerHTML = `<span class="tag ${cls}">${RESULT_LABEL[p.result]}</span>
          <span class="num" style="margin-left:8px;color:var(--text-2)">${p.winSets}:${p.loseSets}</span>
          <span style="margin-left:8px;color:var(--text-3);font-size:12px">${p.sets.map(x => x.a + "-" + x.b).join(" ")}</span>`;
      };
      scoreEl.oninput = syncScore;
      syncScore();

      $$("[data-tag]", bd).forEach(b => b.onclick = () => b.classList.toggle("btn-primary"));
    },
    onSave(bd){
      const date = $("#f_date", bd).value;
      if(!date){ toast("请选择日期", "err"); return false; }
      const discipline = $("#f_disc", bd).value;
      const dbl = isDoubles(discipline);
      const opps = [$("#f_opp1", bd).value.trim(), dbl ? $("#f_opp2", bd).value.trim() : ""].filter(Boolean);
      const partner = dbl ? $("#f_partner", bd).value.trim() : "";
      const score = $("#f_score", bd).value.trim();

      if(score && !opps.length){ toast("填了比分请至少填写 1 名对手", "err"); return false; }
      if(parseScore(score).sets.length && dbl && opps.length < 2)
        toast("双打建议填写 2 名对手（可先只填 1 名）", "ok");

      const obj = {
        id: s.id || uid(), date,
        type: score ? "比赛" : "训练",
        discipline,
        duration: +$("#f_duration", bd).value || 0,
        partner,
        opponents: opps,
        opponent: opps[0] || "",       // 兼容旧字段
        score,
        place: $("#f_place", bd).value.trim(),
        rpe: +$("#f_rpe", bd).value || 6,
        mood: $("#f_mood", bd).value,
        tags: $$("[data-tag].btn-primary", bd).map(b => b.dataset.tag),
        note: $("#f_note", bd).value.trim()
      };
      if(edit) Object.assign(edit, obj); else state.sessions.push(obj);

      // 自动建档：搭档与对手
      if(partner) ensureRival(partner, "partner");
      opps.forEach(o => ensureRival(o, "opponent"));

      save();
      /* 成功反馈：赢得越漂亮，反馈越"大声"；输了也给鼓励，不做评判 */
      const res = parseScore(score).result;
      if(edit){
        toast("已更新", "ok");
      } else if(res === "win"){
        const n = winStreak(state.sessions);
        if(n >= 3) celebrate(`拿下！${n} 连胜`, "cheer");
        else if(n === 2) celebrate("两连胜，节奏起来了", "win");
        else celebrate("拿下这一场！", "win");
      } else if(res === "loss"){
        toast("这场先记下 —— 低谷期也是积累期", "ok", "coach");
      } else {
        toast("已添加记录", "ok");
      }
      return true;
    }
  });
}

/* 建立 / 升级档案，并用 relation 记录角色（对手 / 搭档 / 两者） */
function ensureRival(name, role){
  name = String(name || "").trim();
  if(!name) return;
  role = role || "opponent";
  const found = state.rivals.find(r => r.name === name);
  if(!found){
    state.rivals.push({ id: uid(), name, level:"", note:"", color: hashColor(name), relation: role });
    return;
  }
  if(!found.relation) found.relation = role;
  else if(found.relation !== role && found.relation !== "both") found.relation = "both";
}

function renderSessions(root){
  const people = Array.from(new Set(
    state.rivals.map(r => r.name)
      .concat(state.sessions.flatMap(s => opponentsOf(s).concat(partnerOf(s) ? [partnerOf(s)] : [])))
      .filter(Boolean)
  )).sort((a, b) => a.localeCompare(b, "zh"));

  root.innerHTML = `
    <div class="filters card" style="padding:14px 15px">
      <div class="field"><label>项目</label>
        <select class="select" id="fl_disc">
          <option value="">全部</option>
          ${DISCIPLINES.map(d => `<option ${sessionFilter.disc === d ? "selected" : ""}>${d}</option>`).join("")}
        </select></div>
      <div class="field"><label>结果</label>
        <select class="select" id="fl_result">
          <option value="">全部</option>
          <option value="win" ${sessionFilter.result === "win" ? "selected" : ""}>仅胜</option>
          <option value="loss" ${sessionFilter.result === "loss" ? "selected" : ""}>仅负</option>
          <option value="pending" ${sessionFilter.result === "pending" ? "selected" : ""}>待补录比分</option>
        </select></div>
      <div class="field"><label>球友</label>
        <select class="select" id="fl_person">
          <option value="">全部</option>
          ${people.map(n => `<option ${sessionFilter.person === n ? "selected" : ""}>${esc(n)}</option>`).join("")}
        </select></div>
      <div class="field"><label>起始</label><input class="input" type="date" id="fl_from" value="${esc(sessionFilter.from)}"></div>
      <div class="field"><label>结束</label><input class="input" type="date" id="fl_to" value="${esc(sessionFilter.to)}"></div>
      <div class="field" style="flex:1 1 150px"><label>搜索</label><input class="input" id="fl_q" placeholder="场地 / 备注 / 标签" value="${esc(sessionFilter.q)}"></div>
      <button class="btn" id="fl_reset">重置</button>
      <button class="btn btn-primary" id="fl_add">${icon("plus")}新增</button>
    </div>
    <div id="sessBody"></div>
  `;

  const draw = () => {
    let list = state.sessions.slice();
    if(sessionFilter.disc) list = list.filter(s => disciplineOf(s) === sessionFilter.disc);
    if(sessionFilter.result === "win")  list = list.filter(s => parseScore(s.score).result === "win");
    if(sessionFilter.result === "loss") list = list.filter(s => parseScore(s.score).result === "loss");
    if(sessionFilter.result === "pending") list = list.filter(s => isMatch(s) && !parseScore(s.score).sets.length);
    if(sessionFilter.person){
      const who = sessionFilter.person;
      list = list.filter(s => opponentsOf(s).indexOf(who) >= 0 || partnerOf(s) === who);
    }
    if(sessionFilter.from) list = list.filter(s => s.date >= sessionFilter.from);
    if(sessionFilter.to)   list = list.filter(s => s.date <= sessionFilter.to);
    if(sessionFilter.q){
      const q = sessionFilter.q.toLowerCase();
      list = list.filter(s => [opponentsOf(s).join(" "), partnerOf(s), s.place, s.note, s.type, disciplineOf(s), (s.tags || []).join(" ")]
        .join(" ").toLowerCase().indexOf(q) >= 0);
    }
    list.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);

    const st = computeStats(list);
    const el = $("#sessBody");
    if(!list.length){
      el.innerHTML = `<div class="card">${emptyState("court","没有符合条件的记录，换个筛选条件试试","<button class='btn btn-primary btn-sm' data-add>添加记录</button>")}</div>`;
      $$("[data-add]", el).forEach(b => b.onclick = () => sessionModal());
      return;
    }

    // 分项统计（单打 / 双打 / 混双各自胜率）
    const discs = byDiscipline(list);
    const discChips = DISCIPLINES.map(d => ({ d, s: computeStats(discs[d] || []) }))
      .filter(x => x.s.total > 0)
      .map(x => {
        const color = x.d === "双打" ? "var(--accent)" : x.d === "混双" ? "var(--accent-2)" : x.d === "单打" ? "var(--warn)" : "var(--text-3)";
        const txt = x.s.matches ? `胜率 ${num1(x.s.winRate)}%（${x.s.wins}胜${x.s.losses}负）` : `${x.s.total} 次`;
        return `<span class="tag" style="background:color-mix(in srgb,${color} 12%,transparent);color:${color}">${x.d} · ${txt}</span>`;
      }).join("");

    el.innerHTML = `
      <div class="grid g4" style="margin-bottom:14px">
        <div class="stat"><div class="stat-label">记录总数</div><div class="stat-value">${st.total}<small>次</small></div>
          <div class="stat-foot">比赛 ${st.matches} · 训练 ${st.training}</div></div>
        <div class="stat"><div class="stat-label">总时长</div><div class="stat-value">${num1(st.totalHours)}<small>小时</small></div>
          <div class="stat-foot">场均 ${st.total ? Math.round(st.totalMin / st.total) : 0} 分钟</div></div>
        <div class="stat"><div class="stat-label">综合胜率</div><div class="stat-value" style="color:${st.winRate >= 50 ? "var(--win)" : "var(--loss)"}">${num1(st.winRate)}<small>%</small></div>
          <div class="stat-foot">${st.wins} 胜 ${st.losses} 负${st.draws ? ` ${st.draws} 平` : ""}</div></div>
        <div class="stat"><div class="stat-label">得分率</div><div class="stat-value">${num1(st.ptsRate)}<small>%</small></div>
          <div class="stat-foot">${st.ptsW} / ${st.ptsW + st.ptsL} 分</div></div>
      </div>
      ${discChips ? `<div class="row" style="gap:7px;margin-bottom:14px">${discChips}</div>` : ""}
      <div class="card">
        <div class="card-head"><h3>记录明细</h3><span class="hint">共 ${list.length} 条</span></div>
        <div class="table-wrap"><table style="min-width:680px">
          <thead><tr>
            <th style="width:92px">日期</th><th style="width:56px">项目</th>
            <th>搭档 / 对手</th><th style="width:136px">比分</th>
            <th style="width:54px">结果</th><th class="t-right" style="width:56px">时长</th>
            <th>场地</th><th style="width:72px"></th>
          </tr></thead>
          <tbody>${list.map(s => {
            const p = parseScore(s.score);
            const d = disciplineOf(s);
            const dbl = isDoubles(d);
            const opps = opponentsOf(s);
            const partner = partnerOf(s);
            return `<tr data-id="${s.id}">
              <td class="num">${fmtDate(s.date)}</td>
              <td><span class="tag ${d === "双打" ? "tag-accent" : "tag-neutral"} tag-sm">${esc(d)}</span></td>
              <td>
                ${dbl && partner ? `<div style="font-size:11.5px;color:var(--text-3);margin-bottom:1px">搭档 <b style="color:var(--text-2);font-weight:600">${esc(partner)}</b></div>` : ""}
                <b style="font-weight:600;font-size:13px">${esc(opps.join(" + ")) || "—"}</b>
                ${s.note ? `<div class="hintline" style="margin-top:2px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.note)}</div>` : ""}
              </td>
              <td class="num" style="font-size:12.5px">${p.sets.length ? p.sets.map(x => `${x.a}-${x.b}`).join(" ") : "—"}</td>
              <td>${p.result ? `<span class="tag tag-sm ${RESULT_CLASS[p.result]}">${RESULT_LABEL[p.result]}</span>` : "—"}</td>
              <td class="t-right num">${s.duration ? s.duration + "'" : "—"}</td>
              <td style="font-size:12.5px;color:var(--text-2)">${esc(s.place) || "—"}</td>
              <td class="t-right"><div class="row" style="gap:3px;flex-wrap:nowrap;justify-content:flex-end">
                <button class="btn btn-ghost btn-icon btn-sm" data-edit="${s.id}" title="编辑">${icon("edit")}</button>
                <button class="btn btn-ghost btn-icon btn-sm" data-del="${s.id}" title="删除">${icon("trash")}</button>
              </div></td>
            </tr>`;
          }).join("")}</tbody>
        </table></div>
      </div>
    `;

    $$("[data-edit]", el).forEach(b => b.onclick = e => {
      e.stopPropagation();
      const s = state.sessions.find(x => x.id === b.dataset.edit);
      if(s) sessionModal(s);
    });
    $$("[data-del]", el).forEach(b => b.onclick = e => {
      e.stopPropagation();
      confirmModal("删除记录", "确定删除这条记录吗？此操作不可撤销。", () => {
        state.sessions = state.sessions.filter(x => x.id !== b.dataset.del);
        save(); toast("已删除"); renderSessions($("#view")); renderNav();
      });
    });
    $$("tr[data-id]", el).forEach(tr => tr.onclick = e => {
      if(e.target.closest("button")) return;
      const s = state.sessions.find(x => x.id === tr.dataset.id);
      if(s) sessionDetail(s);
    });
  };

  const readFilters = () => {
    sessionFilter.disc = $("#fl_disc").value;
    sessionFilter.result = $("#fl_result").value;
    sessionFilter.person = $("#fl_person").value;
    sessionFilter.from = $("#fl_from").value;
    sessionFilter.to = $("#fl_to").value;
    sessionFilter.q = $("#fl_q").value.trim();
    draw();
  };

  ["#fl_disc", "#fl_result", "#fl_person", "#fl_from", "#fl_to"].forEach(id => $(id).onchange = readFilters);
  let qt;
  $("#fl_q").oninput = () => { clearTimeout(qt); qt = setTimeout(readFilters, 200); };
  $("#fl_reset").onclick = () => {
    Object.assign(sessionFilter, { disc:"", result:"", q:"", from:"", to:"", person:"" });
    renderSessions(root);
  };
  $("#fl_add").onclick = () => sessionModal();
  draw();
}

function sessionDetail(s){
  const p = parseScore(s.score);
  const d = disciplineOf(s);
  const opps = opponentsOf(s);
  const partner = partnerOf(s);
  modal({
    title: `${d} · ${fmtDate(s.date)}`,
    readonly: true,
    body:`
      <div class="grid g3" style="margin-bottom:16px">
        <div><div class="stat-label">时长</div><div class="stat-value" style="font-size:22px">${s.duration || 0}<small>分</small></div></div>
        <div><div class="stat-label">强度 RPE</div><div class="stat-value" style="font-size:22px">${s.rpe || "—"}<small>/10</small></div></div>
        <div><div class="stat-label">感受</div><div class="stat-value" style="font-size:22px;letter-spacing:0">${esc(s.mood || "—")}</div></div>
      </div>

      <div class="grid g2" style="margin-bottom:16px">
        <div><div class="stat-label">${isDoubles(d) ? "我的搭档" : "对阵"}</div>
          <div style="font-weight:620;margin-top:3px">${esc(partner) || "—"}</div></div>
        <div><div class="stat-label">${isDoubles(d) ? "对方组合" : "对手"}</div>
          <div style="font-weight:620;margin-top:3px">${esc(opps.join(" + ")) || "—"}</div></div>
      </div>

      <div style="margin-bottom:16px">
        <div class="stat-label">场地</div>
        <div style="font-weight:620;margin-top:3px">${esc(s.place) || "—"}</div>
      </div>

      ${isDoubles(d) ? `<div style="margin-bottom:16px;padding:11px 13px;background:var(--accent-soft);border-radius:var(--r-sm);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)">

        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px">
          <span><b>我</b>${partner ? ` + <b>${esc(partner)}</b>` : ""}</span>
          <span style="color:var(--text-3);font-weight:700">VS</span>
          <span>${esc(opps.join(" + ")) || "—"}</span>
        </div></div>` : ""}

      ${p.sets.length ? `
      <div style="margin-bottom:16px">
        <div class="stat-label" style="margin-bottom:8px">比分明细 ${p.result ? `· <span class="tag tag-sm ${RESULT_CLASS[p.result]}">${RESULT_LABEL[p.result]}</span>` : ""}</div>
        <div class="row" style="gap:9px">${p.sets.map((st, i) => `
          <div style="flex:1;min-width:80px;text-align:center;background:var(--bg-sunken);border-radius:var(--r-sm);padding:10px 6px;border:1px solid ${st.a > st.b ? "color-mix(in srgb,var(--win) 35%,transparent)" : st.a < st.b ? "color-mix(in srgb,var(--loss) 35%,transparent)" : "var(--border)"}">
            <div class="hintline" style="margin-bottom:3px">第 ${i + 1} 局</div>
            <div class="num" style="font-weight:750;font-size:17px">${st.a} <span style="color:var(--text-3);font-weight:400">:</span> ${st.b}</div>
          </div>`).join("")}</div>
      </div>` : ""}

      ${(s.tags || []).length ? `<div style="margin-bottom:14px"><div class="stat-label" style="margin-bottom:6px">标签</div>
        <div class="row" style="gap:5px">${s.tags.map(t => `<span class="tag tag-accent">${esc(t)}</span>`).join("")}</div></div>` : ""}

      ${s.note ? `<div><div class="stat-label" style="margin-bottom:6px">备注</div>
        <div style="white-space:pre-wrap;font-size:13.5px;color:var(--text-2);background:var(--bg-sunken);padding:12px 14px;border-radius:var(--r-sm);line-height:1.7">${esc(s.note)}</div></div>` : ""}
    `,
    okText: "编辑",
    onSave(){ sessionModal(s); return true; }
  });
}

/* ------------------------- 8. 页面：技术评估 ------------------------- */
function skillModal(techId, edit){
  const tid0 = edit ? edit.techId : (techId || TECH_ITEMS[0].id);
  const t0 = TECH_MAP[tid0] || TECH_ITEMS[0];
  const c = skillCurrent(tid0);
  const s = edit || { id:"", date: todayISO(), techId: tid0, score: c && !c.legacy ? Math.round(c.score) : 5, by:"self", comment:"" };
  modal({
    title: edit ? "编辑自评" : "补记单项自评",
    body:`
      <div class="grid g2">
        <div class="field"><label>日期 <span class="req">*</span></label><input class="input" type="date" id="k_date" value="${esc(s.date)}"></div>
        <div class="field"><label>专项</label>
          <select class="select" id="k_tech">
            ${TECH_CATS.map(cat => `<optgroup label="${cat}">${TECH_CAT_ITEMS(cat).map(t => `<option value="${t.id}" ${s.techId===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</optgroup>`).join("")}
          </select></div>
      </div>
      <div class="as-def" id="k_def" style="margin-top:6px">${esc(t0.def)}</div>
      <div class="field"><label>评分（1–10，先看锚点再定分）</label>
        <div class="rate"><input type="range" id="k_score" min="1" max="10" step="1" value="${esc(s.score)}"><span class="val" id="kScoreVal">${esc(s.score)}</span></div>
        <div class="as-anchor-cur" id="k_anchor" style="margin-top:6px">${esc(anchorText(tid0, s.score))}</div>
      </div>
      <div class="as-anchors" id="k_anchors" style="margin-top:11px">
        ${t0.anchors.map(a => `<div class="as-anchor"><b>${a.r}</b><span>${esc(a.t)}</span></div>`).join("")}
      </div>
      <div class="field" style="margin-top:14px"><label>我的观察（可选）</label>
        <textarea class="textarea" id="k_comment" placeholder="写下可核对的事实，例如：10 次杀球 6 次压入界内，反手位成功率更高">${esc(s.comment)}</textarea></div>
      <div class="hintline" style="margin-top:9px">全站统一自评口径：记录一律以「自评」保存，不再区分教练或球友来源。
        想一次把所有专项走完，请用「开始自评」的连续表单。</div>
    `,
    onMount(bd){
      const sc = $("#k_score", bd);
      const syncScore = () => {
        $("#kScoreVal", bd).textContent = sc.value;
        $("#k_anchor", bd).textContent = anchorText($("#k_tech", bd).value, sc.value);
      };
      sc.oninput = syncScore;
      const sel = $("#k_tech", bd);
      if(sel) sel.onchange = () => {
        const t = TECH_MAP[sel.value] || TECH_ITEMS[0];
        $("#k_def", bd).textContent = t.def;
        $("#k_anchors", bd).innerHTML = t.anchors.map(a => `<div class="as-anchor"><b>${a.r}</b><span>${esc(a.t)}</span></div>`).join("");
        syncScore();
      };
    },
    onSave(bd){
      const date = $("#k_date", bd).value;
      if(!date){ toast("请选择日期", "err"); return false; }
      const obj = {
        id: s.id || uid(), date,
        techId: $("#k_tech", bd).value,
        score: clamp(+$("#k_score", bd).value, 1, 10),
        by: "self",
        comment: $("#k_comment", bd).value.trim()
      };
      if(edit) Object.assign(edit, obj); else state.skills.push(obj);
      save(); toast(edit ? "已更新自评" : "已记录自评", "ok");
      return true;
    }
  });
}

        <tbody>${list.map(s => `<tr>

/* 「下一步该练什么」诊断卡 —— 数据全部来自已有自评，零额外录入。
   没有自评数据时整卡不渲染；规则本身在 §4b 的 DIAG_RULES 里，这里只负责排版。 */
function diagCardHTML(){
  const d = diagnose();
  if(!d.ctx.scored.length) return "";
  const item = (x, i) => `<div class="diag-item">
    <div class="diag-head">
      <span class="diag-rank">${i + 1}</span>
      <span class="diag-name">${esc(x.name)}</span>
      <span class="tag tag-sm tag-accent">${esc(x.kind)}</span>
    </div>
    <div class="diag-why">${esc(x.why)}</div>
    <div class="diag-fix"><span class="diag-fix-t">怎么练</span>${esc(x.fix)}</div>
  </div>`;
  const goodLine = d.good.map(x => `<b>${esc(x.name)}</b> ${esc(x.why)}`).join("；");
  return `
    <div class="card" style="margin-bottom:14px">
      <div class="card-head"><h3>下一步该练什么</h3>
        <span class="hint">按自评水位自动排序 · 不额外录入</span></div>
      <div class="card-body">
        ${d.todo.length
          ? `<div class="grid g3">${d.todo.map(item).join("")}</div>`
          : `<div style="font-size:13px;color:var(--text-2)">目前没有明显短板，保持现在的节奏就好。</div>`}
        ${goodLine ? `<div class="diag-good">${icon("target")}<span>顺便一提：${goodLine}</span></div>` : ""}
      </div>
    </div>`;
}

function renderSkills(root){
  const last = assessLastInfo();
  const selfRecs = state.skills.filter(isSelfRec);
  const legacy = legacySkills();
  const times = selfDates().length;
  const scoredList = TECH_ITEMS.map(t => ({ t, c: skillCurrent(t.id) })).filter(x => x.c && !x.c.legacy);
  const avgAll = scoredList.length ? avg(scoredList.map(x => x.c.score)) : 0;
  const selfCount = t => state.skills.filter(s => s.techId === t.id && isSelfRec(s)).length;

  root.innerHTML = `
    <div class="as-cta">
      <div class="as-cta-art">${illo("radar", 64)}</div>
      <div class="as-cta-main">

        <div class="as-cta-d">每项 2 道可计数的观测题 → 折算建议分 → 再用 4 档行为锚点校准。统一自评口径，分数可跨月比较。<br>

        <button class="btn btn-primary" id="startAssess">${icon("check")}开始自评</button>
        <button class="btn btn-sm" id="stdAssess">${icon("info")}评分标准</button>
      </div>
    </div>

    <div class="grid g3" style="margin-bottom:14px" id="skillSummary"></div>
    <div class="grid g2" style="margin-bottom:14px">
      <div class="card" style="align-self:start"><div class="card-head"><h3>能力雷达</h3><span class="hint">0–10 分 · 自评</span></div>
        <div class="card-body" id="skillRadar"></div></div>
      <div class="card"><div class="card-head"><h3>分类得分</h3><span class="hint">各类别平均</span></div>
        <div class="card-body" id="skillBars"></div></div>
    </div>

    ${diagCardHTML()}

    ${legacy.length ? `<div class="nudge" id="legacyNote">
      ${icon("info")}
      <div class="nudge-text">有 <b>${legacy.length}</b> 条历史外部评价（教练 / 球友），已统一为自评口径，不再计入任何分数。</div>
      <button class="btn btn-sm" id="viewLegacy">查看</button>
    </div>` : ""}

    <div class="seg" style="margin-bottom:14px" id="catSeg">
      <button class="on" data-cat="all">全部</button>
      ${TECH_CATS.map(c => `<button data-cat="${c}">${c}</button>`).join("")}
    </div>
    <div class="grid g3" id="skillGrid" style="margin-bottom:18px"></div>

    <div class="card">
      <div class="card-head"><h3>自评记录</h3><span class="hint">共 ${selfRecs.length} 条 · 已完成 ${times} 次自评</span>
        <div class="right">
          <button class="btn btn-sm" id="addSkill">${icon("plus")}补记单项</button>
          <button class="btn btn-primary btn-sm" id="startAssess2">${icon("check")}开始自评</button>
        </div></div>
      <div class="table-wrap"><table id="skillTable">
        <thead><tr><th style="width:96px">日期</th><th style="width:112px">专项</th><th style="width:76px">自评</th><th style="width:158px">打分依据</th><th>我的观察</th><th style="width:56px"></th></tr></thead>
        <tbody></tbody></table></div>
    </div>
  `;

  /* 分类摘要卡 */
  $("#skillSummary").innerHTML = TECH_CATS.map(cat => {
    const items = TECH_CAT_ITEMS(cat);
    const cs = items.map(t => skillCurrent(t.id)).filter(c => c && !c.legacy);
    const cur = avg(cs.map(c => c.score));
    const first = avg(items.map(t => { const c = skillCurrent(t.id); return c && !c.legacy ? c.history[0].score : null; }).filter(v => v != null));
    const d = cur - first;
    const color = { "技术":"var(--accent)", "身体":"var(--accent-2)", "意识":"var(--warn)" }[cat];
    return `<div class="stat">
      <div class="stat-label">${cat}能力</div>
      <div class="stat-value" style="color:${color}">${num1(cur)}<small>/10</small></div>
      <div class="stat-foot"><span class="delta ${d>=0.05?"up":d<=-0.05?"down":"flat"}">${d>=0.05?"▲":d<=-0.05?"▼":"—"} ${num1(Math.abs(d))}</span><span>较首次自评</span></div>
    </div>`;
  }).join("");

  /* 雷达：标签走 t.short。
     曾经写成 `t.name.replace(/（.*?）/)`——「发球（小球）」与「发球（高远）」
     削掉括号后同化为「发球」，雷达图上出现两个一模一样的轴，无法区分。 */
  const items = TECH_ITEMS.map(t => { const c = skillCurrent(t.id); return { name: t.short, value: c ? c.score : 0 }; });
  chart.radar($("#skillRadar"), { items, empty: "还没有自评记录 —— 用同一套标准把 18 个专项打一次分" });

  /* 分类横条 */
  $("#skillBars").innerHTML = TECH_CATS.map(cat => TECH_CAT_ITEMS(cat).map(t => {
    const c = skillCurrent(t.id);
    const v = c ? c.score : 0;
    return `<div style="margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span style="font-size:12.5px;font-weight:550;flex:1">${esc(t.name)}</span>
        <span class="num" style="font-size:12.5px;font-weight:700;color:${c?scoreColor(v):"var(--text-3)"}">${c ? num1(v) : "—"}</span>
      </div>
      <div class="bar"><i style="width:${v*10}%"></i></div>
    </div>`;
  }).join("")).join("");

  /* 专项卡网格 */
  const drawGrid = (cat) => {
    const list = cat === "all" ? TECH_ITEMS : TECH_CAT_ITEMS(cat);
    $("#skillGrid").innerHTML = list.map(t => {
      const c = skillCurrent(t.id);
      const v = c ? c.score : 0;
      return `<div class="skill-card">
        <div class="skill-top">
          <div style="min-width:0">
            <div class="skill-name">${esc(t.name)}</div>
            <div class="skill-cat">${t.cat}${c ? ` · 第 ${c.times} 次自评` : ""}</div>
          </div>
          <div class="skill-score" style="color:${c?scoreColor(v):"var(--text-3)"}">${c?num1(v):"—"}<small>/10</small></div>
        </div>
        <div class="bar"><i style="width:${v*10}%"></i></div>
        <div class="spark" data-spark="${t.id}"></div>
        ${c && c.prev != null ? `<div class="hintline" style="margin-top:5px">上次 ${num1(c.prev)} · <span class="delta ${v>c.prev?"up":v<c.prev?"down":"flat"}">${v>c.prev?"▲":v<c.prev?"▼":"—"} ${num1(Math.abs(v-c.prev))}</span></div>` : ""}
        <div class="as-anchor-cur" style="margin-top:7px">${c ? esc(anchorText(t.id, v)) : "还没有自评，对照标准打一次"}</div>
        ${c && c.note ? `<div class="feedback-mini self">${icon("check")}<div><span class="who">我的观察：</span>${esc(c.note)}</div></div>` : ""}
        <div style="margin-top:11px;display:flex;gap:6px">
          <button class="btn btn-sm" data-rate="${t.id}" style="flex:1">补记</button>
          <button class="btn btn-sm btn-ghost" data-hist="${t.id}">历史 ${selfCount(t)}</button>
        </div>
      </div>`;
    }).join("");
    list.forEach(t => {
      const el = $(`[data-spark="${t.id}"]`);
      if(!el) return;
      const byDate = {};
      state.skills.filter(s => s.techId === t.id && isSelfRec(s)).forEach(h => { (byDate[h.date] = byDate[h.date] || []).push(h); });
      const pts = Object.keys(byDate).sort().map(dt => avg(byDate[dt].map(x => x.score)));
      chart.spark(el, pts, "var(--accent)");
    });
    $$("[data-rate]", root).forEach(b => b.onclick = () => skillModal(b.dataset.rate));
    $$("[data-hist]", root).forEach(b => b.onclick = () => skillHistory(b.dataset.hist));
  };
  drawGrid("all");
  $$("#catSeg button").forEach(b => b.onclick = () => {
    $$("#catSeg button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    drawGrid(b.dataset.cat);
  });

  /* 自评记录表 */
  const tbody = $("#skillTable tbody");
  const renderTable = () => {
    const rows = selfRecs.slice().sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 80);
    if(!rows.length){
      tbody.innerHTML = `<tr><td colspan="6">${emptyState("radar", "还没有自评记录 —— 用同一套标准把所有专项打一次分吧",
        `<button class="btn btn-primary" id="emptyAssess">${icon("check")}开始自评</button>`)}</td></tr>`;
      const eb = $("#emptyAssess");
      if(eb) eb.onclick = () => { assessInit(); go("assess"); };
      return;
    }
    tbody.innerHTML = rows.map(s => {
      const t = TECH_MAP[s.techId] || { name: "已删除项目" };
      const hasObs = Array.isArray(s.answers) && s.answers.some(v => v != null && v !== "");
      const basis = hasObs
        ? `观测折算 · 建议 ${s.suggested != null ? num1(s.suggested) : "—"}`
        : (s.batchId ? "自评批次" : "单项补记");
      return `<tr>
        <td class="num">${fmtDate(s.date)}</td>
        <td>${esc(t.name)}</td>
        <td><b class="num" style="font-size:14px;color:${scoreColor(s.score)}">${s.score}</b><span style="color:var(--text-3);font-size:11px">/10</span></td>
        <td><span class="tag ${hasObs?"tag-accent":"tag-neutral"} tag-sm">${basis}</span></td>
        <td style="font-size:12.5px;color:var(--text-2)">${esc(s.comment) || "—"}</td>
        <td class="t-right"><button class="btn btn-ghost btn-icon btn-sm" data-delk="${s.id}" title="删除">${icon("trash")}</button></td>
      </tr>`;
    }).join("");
    $$("[data-delk]", tbody).forEach(b => b.onclick = () => {
      const s = state.skills.find(x => x.id === b.dataset.delk);
      if(!s) return;
      confirmModal("删除自评", `确定删除 ${fmtDate(s.date)} 的「${TECH_MAP[s.techId]?.name||""}」自评吗？`, () => {
        state.skills = state.skills.filter(x => x.id !== b.dataset.delk);
        save(); toast("已删除"); refresh();
      });
    });
  };
  renderTable();

  /* 动作绑定 */
  const goAssess = () => { assessInit(); go("assess"); };
  ["startAssess", "startAssess2"].forEach(id => { const b = $("#" + id); if(b) b.onclick = goAssess; });
  const std = $("#stdAssess"); if(std) std.onclick = assessStandard;
  const vl = $("#viewLegacy"); if(vl) vl.onclick = legacySkillsModal;
  const add = $("#addSkill"); if(add) add.onclick = () => skillModal();
}

function skillHistory(techId){
  const t = TECH_MAP[techId];
  const list = state.skills.filter(s => s.techId === techId && isSelfRec(s)).sort((a,b) => a.date < b.date ? 1 : -1);
  const byDate = {};
  list.forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });
  const dates = Object.keys(byDate).sort();
  modal({
    title: `${t.name} · 自评历史`,
    readonly: true,
    wide: true,
    body:`
      <div id="histChart" style="margin-bottom:16px"></div>
      <div class="timeline">${dates.map(dt => {
        const items = byDate[dt];
        const sc = avg(items.map(i => i.score));
        return `<div class="tl-item">
          <div class="tl-dot"></div>
          <div class="tl-head"><span class="tl-title">${num1(sc)} 分</span><span class="tl-date">${fmtDate(dt)}</span></div>
          ${items.map(i => `<div class="tl-body" style="margin-top:4px">
            <span class="tag ${Array.isArray(i.answers) && i.answers.some(v => v != null && v !== "") ? "tag-accent" : "tag-neutral"} tag-sm">${Array.isArray(i.answers) && i.answers.some(v => v != null && v !== "") ? "观测折算 · 建议 " + (i.suggested != null ? num1(i.suggested) : "—") : "单项自评"}</span>
            <span style="margin-left:6px">${esc(i.comment)||"（无评语）"}</span></div>`).join("")}
        </div>`;
      }).join("")}</div>
    `,
    okText:"补记一条",
    onSave(){ return (() => { skillModal(techId); return true; })(); }
  });
  const asc = dates.slice().sort();
  chart.line($("#histChart"), {
    labels: asc.map(fmtShort),
    yMin: 0, yMax: 10, yFmt: v => num1(v),
    series: [{ name: t.name, data: asc.map(dt => avg(byDate[dt].map(i => i.score))), color: "var(--accent)" }],
    legend: false
  });
}/* ------------------------- 8b. 专项自评（连续表单） -------------------------
   统一采用自评方式：不再区分教练/球友来源，全部由自己按同一套客观标准打分。
   表单是「连续」的 —— 全部专项一次走完，可随时中断、随时回来续填。
   -------------------------------------------------------------------------- */

let assessDraft = null;
const asSel = (k, tid) => `[${k}="${tid}"]`;

/* 已有自评的日期（升序） */
function selfDates(){
  return Array.from(new Set(state.skills.filter(isSelfRec).map(s => s.date))).sort();
}
/* 上一次自评的摘要 */
function assessLastInfo(before){
  const ds = selfDates().filter(d => !before || d < before);
  if(!ds.length) return null;
  const d = ds[ds.length - 1];
  const recs = state.skills.filter(s => isSelfRec(s) && s.date === d);
  return {
    date: d,
    days: daysAgo(d),
    n: recs.length,
    avg: avg(recs.map(r => +r.score || 0)),
    records: recs
  };
}
/* 取某日某个专项的自评记录 */
function selfRecOn(date, techId){
  return state.skills.find(s => isSelfRec(s) && s.date === date && s.techId === techId) || null;
}
/* 初始化草稿：保留上次未完成的进度，让自评可以分几次填完 */
function assessInit(force){
  if(assessDraft && !force) return assessDraft;
  const date = todayISO();
  const items = {}, open = {};
  TECH_ITEMS.forEach(t => {
    const c = skillCurrent(t.id);
    items[t.id] = { a: [null, null], score: null, comment: "", cur: c && !c.legacy ? c.score : null };
    open[t.id] = false;
  });
  assessDraft = { date, note: "", items, open, todo: false, last: assessLastInfo(date) };
  return assessDraft;
}
/* 沿用上次：把上次的观测答案与分数带入，只需确认或微调 */
function assessLoadLast(){
  const d = assessInit();
  if(!d.last){ toast("还没有可沿用的历史自评"); return 0; }
  let n = 0;
  d.last.records.forEach(r => {
    const it = d.items[r.techId];
    if(!it) return;
    it.a = Array.isArray(r.answers) && r.answers.length === 2 ? r.answers.slice() : [null, null];
    it.score = +r.score || null;
    it.comment = r.comment || "";
    n++;
  });
  return n;
}
/* 保存：同一天同一项已存在则覆盖，避免重复记录 */
function saveAssessment(){
  const d = assessDraft;
  if(!d) return 0;
  const picked = TECH_ITEMS.filter(t => d.items[t.id].score != null);
  if(!picked.length) return 0;
  const batchId = uid();
  picked.forEach(t => {
    const it = d.items[t.id];
    const dup = selfRecOn(d.date, t.id);
    const rec = {
      id: dup ? dup.id : uid(),
      date: d.date, techId: t.id,
      score: clamp(Math.round(+it.score), 1, 10),
      by: "self",
      comment: String(it.comment || "").trim(),
      batchId,
      answers: it.a.slice(),
      suggested: suggestScore(it.a),
      groupNote: String(d.note || "").trim()
    };
    if(dup) Object.assign(dup, rec); else state.skills.push(rec);
  });
  save();
  return picked.length;
}

/* ---------- 表单交互 ---------- */
function asProgress(root){
  const d = assessInit();
  const n = TECH_ITEMS.filter(t => d.items[t.id].score != null).length;
  const bar = $("#asProgBar", root);
  if(bar) bar.style.width = Math.round(n / TECH_ITEMS.length * 100) + "%";
  const txt = $("#asProgText", root);
  if(txt) txt.textContent = `已评 ${n} / ${TECH_ITEMS.length}`;
  const sn = $("#asSaveNum", root);
  if(sn) sn.textContent = String(n);
  return n;
}
/* 单项状态同步：建议分 / 滑块 / 锚点文字 / 卡片完成态 */
function asSync(tid, root){
  const d = assessDraft, it = d.items[tid];
  const sug = suggestScore(it.a);
  const box = $(asSel("data-sugg", tid), root);
  if(box) box.style.display = sug == null ? "none" : "flex";
  const sv = $(asSel("data-suggval", tid), root);
  if(sv) sv.textContent = sug == null ? "—" : num1(sug);

  const rng = $(asSel("data-range", tid), root);
  if(rng) rng.value = it.score == null ? 1 : it.score;
  const rv = $(asSel("data-rangeval", tid), root);
  if(rv) rv.textContent = it.score == null ? "—" : String(it.score);
  const ac = $(asSel("data-anchor", tid), root);
  if(ac) ac.textContent = it.score == null ? "未评分" : anchorText(tid, it.score);

  const card = $(asSel("data-item", tid), root);
  if(card) card.classList.toggle("done", it.score != null);
  asProgress(root);
}

function bindAssess(root){
  const d = assessDraft;

  /* 观测题：同组单选 */
  $$("[data-opt]", root).forEach(b => b.onclick = () => {
    const tid = b.dataset.tech, oi = +b.dataset.obs, v = +b.dataset.val;
    const it = d.items[tid]; if(!it) return;
    it.a[oi] = v;
    $$(`[data-opt][data-tech="${tid}"][data-obs="${oi}"]`, root)
      .forEach(x => x.classList.toggle("on", x.dataset.obs === String(oi) && +x.dataset.val === v));
    asSync(tid, root);
  });

  /* 采纳建议分 */
  $$("[data-adopt]", root).forEach(b => b.onclick = () => {
    const tid = b.dataset.adopt;
    const s = suggestScore(d.items[tid].a);
    if(s == null){ toast("先把两道观测题答完", "err", "think"); return; }
    d.items[tid].score = clamp(Math.round(s), 1, 10);
    asSync(tid, root);
  });

  /* 手动微调 */
  $$("[data-range]", root).forEach(r => r.oninput = () => {
    const tid = r.dataset.tech;
    d.items[tid].score = +r.value;
    asSync(tid, root);
  });

  /* 备注 */
  $$("[data-note]", root).forEach(n => n.oninput = () => {
    const tid = n.dataset.tech;
    if(d.items[tid]) d.items[tid].comment = n.value;
  });

  /* 展开四档锚点 */
  $$("[data-fold]", root).forEach(b => b.onclick = () => {
    const tid = b.dataset.fold;
    d.open[tid] = !d.open[tid];
    const box = $(asSel("data-foldbox", tid), root);
    if(box) box.style.display = d.open[tid] ? "block" : "none";
    b.classList.toggle("on", !!d.open[tid]);
    b.textContent = d.open[tid] ? "收起标准" : "评分标准";
  });

  /* 章节跳转 */
  $$("[data-jump]", root).forEach(a => a.onclick = e => {
    const el = $("#" + a.dataset.jump);
    if(el && el.scrollIntoView){ e.preventDefault(); el.scrollIntoView({ behavior:"smooth", block:"start" }); }
  });

  /* 顶部动作 */
  const back = $("[data-back]", root); if(back) back.onclick = () => go(back.dataset.back);
  const dt = $("#asDate", root); if(dt) dt.onchange = () => {
    if(!dt.value) return;
    d.date = dt.value;
    d.last = assessLastInfo(d.date);
    TECH_ITEMS.forEach(t => { const c = skillCurrent(t.id); d.items[t.id].cur = c && !c.legacy ? c.score : null; });
    refresh();
  };
  const bLast = $("#asLast", root); if(bLast) bLast.onclick = () => {
    const n = assessLoadLast();
    if(!n) return;
    refresh();
    toast(`已沿用上次的 ${n} 项，按需微调即可`, "ok", "coach");
  };
  const bStand = $("#asStand", root); if(bStand) bStand.onclick = assessStandard;
  const nt = $("#asNote", root); if(nt) nt.oninput = () => { d.note = nt.value; };

  /* 只看未评：18 项一次走完时用来快速补齐剩余项 */
  const bTodo = $("#asTodo", root); if(bTodo) bTodo.onclick = () => {
    d.todo = !d.todo;
    if(d.todo === false) root.classList.remove("as-todo");
    refresh();
  };

  /* 清空 / 保存 */
  const bReset = $("#asReset", root); if(bReset) bReset.onclick = () => {
    confirmModal("清空本次自评", "将丢弃你这次已填写但尚未保存的内容，历史记录不受影响。", () => {
      assessInit(true); refresh();
    });
  };
  const bSave = $("#asSave", root); if(bSave) bSave.onclick = () => doSaveAssess();
}

function doSaveAssess(){
  const d = assessDraft;
  if(!d) return;
  const n = TECH_ITEMS.filter(t => d.items[t.id].score != null).length;
  if(!n){ toast("至少完成一项自评再保存", "err", "think"); return; }
  const saved = saveAssessment();
  const st = computeStats(state.sessions);
  const avgNow = avg(TECH_ITEMS.filter(t => { const c = skillCurrent(t.id); return c && !c.legacy; }).map(t => skillCurrent(t.id).score));
  assessDraft = null;
  assessInit();
  celebrate(`本次自评已记录 ${saved} 项，当前综合 ${num1(avgNow)} 分`);
  go("skills");
}

  const cats = ["技术","体能","里程碑","习惯","成绩","其他"];
  modal({
    title: edit ? "编辑目标" : "设定新目标",
    body:`
      <div class="field"><label>目标标题 <span class="req">*</span></label>

      <div class="field" style="margin-top:14px"><label>分解步骤（可选，勾选后自动计算进度）</label>
        <div id="stepBox">${(g.steps || []).map(s => `
          <div class="row" style="margin-bottom:7px" data-stepline>
            <input class="input" value="${esc(s.text)}" data-step-text style="flex:1">

        id: g.id || uid(), title,
        cat: $("#g_cat", bd).value,
        target: $("#g_target", bd).value.trim(),
        due: $("#g_due", bd).value,
        createdAt: g.createdAt || todayISO(),
        progress: prog,
        status: prog >= 100 ? "done" : "active",
        steps
      };
      if(edit) Object.assign(edit, obj); else state.goals.unshift(obj);
      save();
      /* 新建/编辑后一步到位 100% 也值得庆祝 */
      if(prog >= 100) celebrate(`目标达成 · ${title}`, "cheer");
      else toast(edit ? "已更新" : "目标已创建，开始吧", "ok");
      return true;
    }
  });
}

const goalFilter = { status: "active" };

function renderGoals(root){
  root.innerHTML = `
    <div class="grid g4" style="margin-bottom:14px" id="goalStats"></div>
    <div class="row" style="margin-bottom:14px;justify-content:space-between">
      <div class="seg" id="goalSeg">
        <button data-st="active" class="on">进行中</button>
        <button data-st="done">已达成</button>
        <button data-st="all">全部</button>
      </div>
      <button class="btn btn-primary" id="addGoal">${icon("plus")}新增目标</button>
    </div>
    <div class="grid g2" id="goalGrid"></div>
  `;

  const draw = () => {
    const all = state.goals;
    const doneList = all.filter(g => g.status === "done");
    const active = all.filter(g => g.status !== "done");
    const overdue = active.filter(g => g.due && daysAgo(g.due) > 0).length;

    $("#goalStats").innerHTML = `
      <div class="stat"><div class="stat-label">目标总数</div>
        <div class="stat-value">${all.length}<small>个</small></div>
        <div class="stat-foot">${active.length} 个进行中</div></div>
      <div class="stat"><div class="stat-label">已达成</div>
        <div class="stat-value" style="color:var(--loss)">${doneList.length}<small>个</small></div>
        <div class="stat-foot">达成率 ${all.length ? num1(doneList.length / all.length * 100) : 0}%</div></div>
      <div class="stat"><div class="stat-label">平均进度</div>
        <div class="stat-value">${active.length ? num1(avg(active.map(g => g.progress))) : 0}<small>%</small></div>
        <div class="stat-foot">仅统计进行中</div></div>
      <div class="stat"><div class="stat-label">已逾期</div>
        <div class="stat-value" style="color:${overdue ? "var(--win)" : "var(--text)"}">${overdue}<small>个</small></div>
        <div class="stat-foot">需要关注</div></div>`;

    let list = goalFilter.status === "all"
      ? all.slice()
      : all.filter(g => goalFilter.status === "done" ? g.status === "done" : g.status !== "done");
    list.sort((a, b) => {
      if((a.status === "done") !== (b.status === "done")) return a.status === "done" ? 1 : -1;
      const da = a.due || "9999-99-99", db = b.due || "9999-99-99";
      return da < db ? -1 : da > db ? 1 : 0;
    });

    const grid = $("#goalGrid");
    if(!list.length){
      grid.innerHTML = `<div class="card" style="grid-column:1/-1">${emptyState("flag", goalFilter.status === "done" ? "还没有达成的目标" : "还没有设定目标", "<button class='btn btn-primary btn-sm' data-add>设定一个目标</button>")}</div>`;
      $$("[data-add]", grid).forEach(b => b.onclick = () => goalModal());
      return;
    }

    grid.innerHTML = list.map(g => {
      const isDone = g.status === "done" || g.progress >= 100;
      const od = !isDone && g.due && daysAgo(g.due) > 0;
      const left = g.due ? -daysAgo(g.due) : null;
      const dueTxt = isDone ? "已达成" : od ? `已逾期 ${daysAgo(g.due)} 天` : `剩 ${left} 天`;
      return `<div class="goal ${isDone ? "done" : od ? "overdue" : ""}">
        <div class="goal-top">
          <div style="flex:1;min-width:0">
            <div class="goal-title">${esc(g.title)}</div>
            <div class="goal-meta">
              <span class="tag ${isDone ? "tag-loss" : od ? "tag-win" : "tag-accent"} tag-sm">${esc(g.cat)}</span>
              ${g.due ? `<span>${dueTxt} · ${fmtDate(g.due)}</span>` : ""}
            </div>
          </div>
          <div class="row" style="gap:3px;flex-wrap:nowrap">
            <button class="btn btn-ghost btn-icon btn-sm" data-gedit="${g.id}" title="编辑">${icon("edit")}</button>
            <button class="btn btn-ghost btn-icon btn-sm" data-gdel="${g.id}" title="删除">${icon("trash")}</button>
          </div>
        </div>
        ${g.target ? `<div class="hintline" style="margin-top:2px">标准：${esc(g.target)}</div>` : ""}
        <div class="goal-prog">
          <div class="bar ${isDone ? "loss" : ""}"><i style="width:${clamp(g.progress, 0, 100)}%"></i></div>
          <b style="${isDone ? "color:var(--loss)" : ""}">${Math.round(g.progress)}%</b>
        </div>
        ${(g.steps || []).length ? `<div class="steps">${g.steps.map((s, i) => `
          <label class="step ${s.done ? "done" : ""}" data-gstep="${g.id}" data-gsi="${i}">
            <input type="checkbox" ${s.done ? "checked" : ""}><span>${esc(s.text)}</span></label>`).join("")}</div>` : ""}
      </div>`;
    }).join("");

    $$("[data-gedit]", grid).forEach(b => b.onclick = () => goalModal(state.goals.find(x => x.id === b.dataset.gedit)));
    $$("[data-gdel]", grid).forEach(b => b.onclick = () => {
      const g = state.goals.find(x => x.id === b.dataset.gdel);
      confirmModal("删除目标", `确定删除「${g.title}」吗？`, () => {
        state.goals = state.goals.filter(x => x.id !== b.dataset.gdel);
        save(); toast("已删除"); draw(); renderNav();
      });
    });
    $$("[data-gstep]", grid).forEach(lb => {
      const cb = lb.querySelector("input");
      if(cb) cb.onchange = e => {
        const g = state.goals.find(x => x.id === lb.dataset.gstep);
        if(!g) return;
        g.steps[+lb.dataset.gsi].done = e.target.checked;
        g.progress = Math.round(g.steps.filter(s => s.done).length / g.steps.length * 100);
        g.status = g.progress >= 100 ? "done" : "active";
        save(); draw(); renderNav();
        /* 目标达成 —— 全局最值得"大声"的一刻 */
        if(g.status === "done") celebrate(`目标达成 · ${g.title}`, "cheer");
      };
    });
  };

  $$("#goalSeg button").forEach(b => b.onclick = () => {
    $$("#goalSeg button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    goalFilter.status = b.dataset.st;
    draw();
  });
  $("#addGoal").onclick = () => goalModal();
  draw();
}

/* ------------------------- 10. 页面：对手档案 ------------------------- */
function ensureRivalAll(){
  state.sessions.forEach(s => {

  });
}

/* ============ 页面：搭档 ============ */
function renderPartners(root){

        <div class="stat-foot">${best ? `${num1(best.winRate)}% · ${best.matches} 场` : "暂无数据"}</div></div>
      <div class="stat"><div class="stat-label">配合最多</div>
        <div class="stat-value" style="font-size:21px;letter-spacing:0">${most ? esc(most.name) : "—"}</div>
        <div class="stat-foot">${most ? `${most.matches} 场 · ${most.w}胜${most.l}负` : "暂无数据"}</div></div>
    </div>

    ${noPartner.length ? `<div class="card" style="margin-bottom:14px;border-color:color-mix(in srgb,var(--warn) 40%,var(--border))">
      <div class="card-body" style="display:flex;align-items:center;gap:11px;padding:13px 16px">

        <div style="flex:1;font-size:13px;color:var(--text-2)">

      <div class="card">
        <div class="card-head"><h3>搭档配合胜率</h3><span class="hint">至少 1 场配合</span></div>
        <div class="card-body" id="partnerChart"></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>搭档分布</h3><span class="hint">按配合场次</span></div>
        <div class="card-body" id="partnerDonut"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>搭档档案</h3><span class="hint">共 ${roster.length} 人</span>
        <div class="right"><button class="btn btn-primary btn-sm" id="addPartner">${icon("plus")}添加搭档</button></div></div>
      <div class="card-body" id="partnerList" style="display:grid;gap:11px"></div>
    </div>
  `;

  /* 横向对比柱状图 */
  const chEl = $("#partnerChart");
  if(chEl){
    if(!stats.length) chEl.innerHTML = emptyChart(200, "还没有搭档记录");
    else chart.bar(chEl, {
      labels: stats.map(s => s.name),
      data: stats.map(s => s.winRate),
      color: "var(--accent)", yFmt: v => num1(v)
    });
  }

  /* 搭档分布环形 */

  if(dnEl){
    if(!stats.length) dnEl.innerHTML = emptyChart(200, "还没有搭档记录");

    listEl.innerHTML = emptyState("pair","还没有搭档记录。可以点「添加搭档」先把人建好，也可以记录双打 / 混双比赛时填写搭档，这里会自动归档。","<button class='btn btn-primary btn-sm' data-add>添加搭档</button>");

  listEl.innerHTML = roster.map(p => {

      <div style="min-width:0;flex:1">
        <div class="rival-name">${esc(p.name)}${r.level ? ` <span class="tag tag-neutral tag-sm">${esc(r.level)}</span>` : ""}
          <span class="tag tag-accent tag-sm">搭档</span>${has ? "" : ` <span class="tag tag-neutral tag-sm">还没打过</span>`}</div>
        <div class="rival-sub">${has ? `${ctx} · 最近 ${fmtDate(p.last)}` : "还没有比赛记录，打双打时填上 TA 就会自动统计"}</div>
        ${r.note ? `<div class="rival-sub" style="color:var(--text-3)">${esc(r.note)}</div>` : ""}

  const fp = $("#fillPartners");
  if(fp) fp.onclick = () => {
    const missing = state.sessions
      .filter(s => isDoubles(disciplineOf(s)) && !partnerOf(s))
      .sort((a, b) => a.date < b.date ? 1 : -1);
    quickFillPartner(missing);
  };
  $("#addPartner").onclick = () => rivalModal(null, "partner");
}

    wide: true,
    body: `
      <div class="hintline" style="margin-bottom:12px">为下列比赛填写搭档，保存后立即纳入配合统计。</div>
      <div id="fillList" style="display:grid;gap:9px;max-height:52vh;overflow-y:auto">

          <div class="row" style="gap:10px;align-items:center;padding-bottom:9px;border-bottom:1px solid var(--border)">
            <div style="flex:1;min-width:0">
              <div style="font-size:13.5px;font-weight:600">${esc(disciplineOf(s))} · ${esc(opponentsOf(s).join(" + ")) || "—"}</div>
              <div class="hintline">${fmtDate(s.date)} · ${esc(s.place) || "未知场地"}</div>
            </div>
            <input class="input" data-fill="${s.id}" list="partnerPeople" placeholder="搭档姓名"
              style="max-width:170px" value="${esc(s.partner || "")}">
          </div>`).join("")}
      </div>
      <datalist id="partnerPeople">${state.rivals.map(r => `<option value="${esc(r.name)}"></option>`).join("")}</datalist>
    `,
    okText: "保存",
    onSave(bd){
      let n = 0;
      $$("[data-fill]", bd).forEach(inp => {
        const s = state.sessions.find(x => x.id === inp.dataset.fill);
