<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EF">
<!-- 网页图标：先用一块品牌橙占位，脚本启动后会换成正式图标（与小羽同一只球） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FF7A45'/%3E%3C/svg%3E">
<title>羽迹 · 羽毛球成长记录</title>
<style>
/* ============================================================================
   羽迹 · 趣味插画风格设计系统   Playful Illustration
   ----------------------------------------------------------------------------
   角色语气：小羽 —— 你的羽毛球搭子。元气、爱鼓励、偶尔嘴贫。
             颜色 / 字体 / 插画 / 文案 全部服务于同一个人格。
   设计原则：
     1. 把夸张留给重点 —— hero、成功反馈、关键插画可以跳出来；其余安静配合
     2. 圆润不等于含糊 —— 按钮 / 输入 / 状态都有清楚边界与文字
     3. 动效表达因果   —— 完成 / 拖动 / 升级有弹性，但都收在 460ms 内
   ============================================================================ */

/* ============ 1. 设计令牌 ============ */
:root{
  /* 纸张与墨线 —— 插画的底 */
  --bg:#FFF7EF;
  --bg-elev:#FFFFFF;
  --bg-sunken:#FDF0E3;
  --bg-hover:#FCEBDB;
  --dot:rgba(44,39,64,.055);
  --ink:#2C2740;              /* 描边主色，插画与主文字共用 */
  --border:#EFDCC9;
  --border-strong:#DFC7AE;
  --text:#2C2740;
  --text-2:#6B6383;
  --text-3:#9C93B0;

  /* 糖果色 —— 小羽的调色盘 */
  --accent:#FF7A45;           /* 活力橙：品牌主色 */
  --accent-2:#4F9DF7;         /* 天蓝：次级与混双 */
  --accent-3:#A78BFA;         /* 葡萄紫：点缀 */
  --accent-soft:#FFE9DF;
  --accent-2-soft:#E4F0FF;

  --win:#E8467C;              /* 胜 / 上涨 —— 暖玫红，承接原版「胜=红」约定 */
  --win-soft:#FFE3EC;
  --loss:#17B26A;             /* 负 / 下跌 —— 薄荷绿，承接原版「负=绿」约定 */
  --loss-soft:#DDF6E8;
  --warn:#F2A413;             /* 蜂蜜黄 */
  --warn-soft:#FFF2D6;
  --sun:#FFC93C;
  --track:#F2E7DA;

  /* 阴影：一层柔和环境光 + 一层"贴纸"硬偏移 */
  --shadow-sm:0 1px 2px rgba(44,39,64,.05);
  --shadow:0 3px 12px rgba(44,39,64,.07),0 1px 3px rgba(44,39,64,.05);
  --shadow-lg:0 16px 40px rgba(44,39,64,.14),0 4px 12px rgba(44,39,64,.07);
  --shadow-pop:0 10px 26px rgba(255,122,69,.30);
  --sticker:0 3px 0 var(--ink);          /* 贴纸按钮的硬投影 */
  --sticker-sm:0 2px 0 var(--ink);

  /* 圆角：分级统一，越"大件"越圆 */
  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:22px; --r-xl:28px;

  /* 字体：优先系统圆体，保证离线可用（无外部字体请求） */
  --font-display:ui-rounded,"SF Pro Rounded","PingFang SC","HarmonyOS Sans SC","MiSans","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --font-body:ui-rounded,"PingFang SC","HarmonyOS Sans SC","MiSans","Source Han Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:ui-rounded,ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;

  /* 动效：弹性但快 */
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.22,.9,.3,1);
  --d-fast:110ms; --d:200ms; --d-slow:320ms;

  --nav-h:62px;

  /* 彩带粒子位移：由 JS 逐粒写入，此处只给默认值，
     避免 confettiFall 关键帧取到非法值导致粒子原地不动 */
  --cx:0px; --cy:240px; --cr:0deg;
}
html[data-theme="dark"]{
  --bg:#1B1730;
  --bg-elev:#262040;
  --bg-sunken:#211B38;
  --bg-hover:#2E2750;
  --dot:rgba(245,242,255,.05);
  --ink:#0F0C1E;
  --border:#352D5C;
  --border-strong:#493F78;
  --text:#F5F2FF;
  --text-2:#C3BCE0;
  --text-3:#928AB8;

  --accent:#FF9A6B;
  --accent-2:#6FB6FF;
  --accent-3:#BFA5FF;
  --accent-soft:#3A2540;
  --accent-2-soft:#1E2F4A;

  --win:#FF6FA0;              /* 胜（深色下提亮的玫红） */
  --win-soft:#3A1C2A;
  --loss:#3FD98F;             /* 负（深色下提亮的薄荷绿） */
  --loss-soft:#14332A;
  --warn:#FFC24D;
  --warn-soft:#3A2C10;
  --sun:#FFD166;
  --track:#332B52;

  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 3px 14px rgba(0,0,0,.38);
  --shadow-lg:0 18px 44px rgba(0,0,0,.55);
  --shadow-pop:0 10px 26px rgba(0,0,0,.45);
}

/* ============ 2. 基底 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background-color:var(--bg);
  /* 点阵纸：插画手账的底纹，极淡，不抢内容 */
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);
  background-size:22px 22px;
  color:var(--text);
  font:15px/1.68 var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,h4{font-family:var(--font-display)}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px;border-radius:10px}

/* ============ 3. 布局骨架 ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex:0 0 230px;background:var(--bg-elev);
  border-right:1.5px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;
}
.brand{padding:20px 16px 14px;display:flex;align-items:center;gap:11px}
.brand-mark{
  width:42px;height:42px;border-radius:14px;flex:0 0 42px;
  background:linear-gradient(150deg,var(--accent),var(--warn));
  border:2px solid var(--ink);display:grid;place-items:center;
  box-shadow:var(--sticker-sm);overflow:hidden;
  animation:bob 4.2s var(--ease) infinite;
}
.brand-mark svg{width:34px;height:34px;display:block}
.brand-name{font-family:var(--font-display);font-size:17px;font-weight:800;letter-spacing:.2px;line-height:1.2}
.brand-sub{font-size:10.5px;color:var(--text-3);letter-spacing:1.6px;text-transform:uppercase;font-weight:700}

.nav{flex:1;overflow-y:auto;padding:6px 10px 10px}
.nav-group-label{
  font-size:10.5px;font-weight:800;letter-spacing:1.3px;color:var(--text-3);
  text-transform:uppercase;padding:15px 10px 6px;font-family:var(--font-display);
}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;border:2px solid transparent;background:transparent;
  padding:9px 11px;border-radius:var(--r-sm);color:var(--text-2);font-size:14px;
  font-weight:650;text-align:left;transition:background var(--d-fast),color var(--d-fast),transform var(--d-fast);
  position:relative;font-family:var(--font-display);
}
.nav-item:hover{background:var(--bg-hover);color:var(--text)}
.nav-item:active{transform:scale(.975)}
.nav-item.active{
  background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 70%,var(--ink));
  font-weight:800;border-color:color-mix(in srgb,var(--accent) 38%,transparent);
  box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 30%,transparent);
}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.92}
.nav-badge{
  margin-left:auto;font-size:11px;font-weight:800;font-family:var(--mono);
  background:var(--bg-sunken);color:var(--text-3);padding:1px 8px;border-radius:20px;
}
.nav-item.active .nav-badge{background:var(--accent);color:#fff}
.sidebar-foot{padding:12px;border-top:1.5px solid var(--border);display:flex;gap:8px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:var(--nav-h);display:flex;align-items:center;gap:12px;padding:0 22px;
  border-bottom:1.5px solid var(--border);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px) saturate(150%);position:sticky;top:0;z-index:30;
}
/* 标题栏：h1 / sub / actions 都是 flex item，默认都会收缩。
   窄屏下 h1 被压到容器宽度以下就会把「仪表盘」拆成两行，
   于是文字溢出 62px 高的 header —— 这就是移动端顶部错位的根因。
   对策：三者一律禁止换行，宁可省略号也不折行；操作区干脆不收缩。 */
.topbar h1{
  font-size:17.5px;font-weight:800;margin:0;letter-spacing:.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.topbar .sub{
  font-size:12.5px;color:var(--text-3);margin-left:-6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.view{padding:22px;max-width:1440px;width:100%;margin:0 auto;flex:1}
.view[hidden]{display:none}

/* ============ 4. 卡片 ============ */
.card{
  background:var(--bg-elev);border:1.5px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow-sm);
}
/* 卡片头 = 三个槽位：标题 / 描述 / 右侧操作。
   标题是硬约束：`flex:0 0 auto` + `nowrap` —— 它**不参与收缩**，任何宽度下都必须单行。
   此前三个槽位都可收缩，中文的最小内容宽度只有一个字，于是窄屏下标题被压到
   3 个字宽、折成「分项战 / 绩」。现在的取舍很明确：宁可让描述折行，也不让标题折行。 */
.card-head{
  display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1.5px solid var(--border);
}
.card-head h3{
  margin:0;font-size:14.5px;font-weight:800;letter-spacing:.1px;
  flex:0 0 auto;white-space:nowrap;
}
/* min-width:0 让描述能被压缩而不是把整行撑破；它才是该让位的那个 */
.card-head .hint{font-size:12px;color:var(--text-3);font-weight:500;min-width:0}
.card-body{padding:16px}
/* 操作区同样不收缩：按钮文字一旦折行比溢出更难看 */
.card-head .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex:0 0 auto}

/* ============ 5. 按钮：圆润但有明确边界 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1.5px solid var(--border-strong);background:var(--bg-elev);color:var(--text);
  padding:7px 14px;border-radius:var(--r-sm);font-size:13.5px;font-weight:700;
  transition:transform var(--d-fast) var(--spring),background var(--d-fast),border-color var(--d-fast),box-shadow var(--d-fast);
  white-space:nowrap;font-family:var(--font-display);
}
.btn:hover{background:var(--bg-hover);border-color:var(--ink)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn svg{width:16px;height:16px}

/* 主按钮：唯一带"贴纸"硬边的元素之一 —— 夸张留给重点 */
.btn-primary{
  background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 78%,var(--warn)));
  border:2px solid var(--ink);color:#fff;box-shadow:var(--sticker-sm);
  text-shadow:0 1px 0 rgba(0,0,0,.12);
}
.btn-primary:hover{
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 92%,#fff),var(--accent));
  border-color:var(--ink);transform:translateY(-1px);
  box-shadow:0 3px 0 var(--ink);
}
.btn-primary:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--bg-hover);border-color:var(--border)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:var(--r-xs)}
.btn-icon{padding:7px;border-radius:var(--r-sm)}
/* 危险动作一律走"胜"色（红系），与原版一致：删除 = 红 */
.btn-danger{color:var(--win);border-color:color-mix(in srgb,var(--win) 45%,var(--border))}
.btn-danger:hover{background:var(--win-soft);border-color:var(--win)}

/* 并列按钮一律等宽：这类按钮组要用 .btn-grid，不能用 .row。
   flex + wrap 下按钮宽度由文案长度决定 —— 换行点随机、每行右端参差
   （实测 360px 两行右留白 7 / 37 不齐；320px 更是直接碎成 5 行，一行一个）。
   网格把「等宽 + 对齐」变成结构保证，不再靠文案长度碰运气。
   配套约定：同组按钮文案统一写成「动作 + 格式」，长度接近，网格才不会一胖一瘦。
   危险按钮**永远另起一行靠右**，不跟普通按钮抢同一行 —— 一来与普通操作分离，
   二来避免"4 个按钮 + 危险按钮同行"逼出溢出：921px 处侧边栏出现、容器骤降到
   613px，5 个挤一行时「打印 / PDF」会被压到 111px（内容需 118px）而溢出。
   阈值 640px 由"4 列要放得下最宽的按钮"反推并留缓冲：容器 573px → 每列 136px，
   而最宽的「打印 / PDF」自然宽度 120px（余 ~16px，够跨平台字体差异）。 */
.btn-grid{display:grid;gap:9px;align-items:center;grid-template-columns:repeat(2,minmax(0,1fr))}
.btn-grid > .btn{min-width:0}
/* 危险操作另起一行、靠右：与普通操作分离，又不占满整行去抢视觉权重 */
.btn-grid > .btn-wide{grid-column:1 / -1;justify-self:end}
@media(min-width:640px){
  /* 一行四个等宽（危险按钮仍独占下一行，全尺寸结构一致） */
  .btn-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
/* 极窄屏（≤340px，如 iPhone SE）把左右内边距收到 11px 留出缓冲：
   320px 两列网格每列 127.5px，最宽的「打印 / PDF」自然宽度 120.5px —— 只剩 7px，
   而文字宽度随渲染字体浮动（系统字体换一个就可能顶破边框）。收窄后余量 ~13px。 */
@media(max-width:340px){
  .btn-grid > .btn{padding-left:11px;padding-right:11px}
}

/* ============ 6. 表单 ============ */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-size:12px;font-weight:750;color:var(--text-2);letter-spacing:.2px}
.field .req{color:var(--win)}
.input,.select,.textarea{
  width:100%;background:var(--bg);border:1.5px solid var(--border-strong);
  border-radius:var(--r-sm);padding:8px 11px;font-size:14px;
  transition:border var(--d-fast),box-shadow var(--d-fast),background var(--d-fast);
}
.input:hover,.select:hover,.textarea:hover{border-color:var(--text-3)}
.input:focus,.select:focus,.textarea:focus{
  outline:0;border-color:var(--accent);background:var(--bg-elev);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent);
}
.textarea{resize:vertical;min-height:78px;line-height:1.68}
.select{
  appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6383' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;background-size:13px;padding-right:30px;
}
.hintline{font-size:11.5px;color:var(--text-3)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
/* 非等宽列比例类：务必用类名而非内联 grid-template-columns，
   否则内联优先级会盖掉下方 @media 的单列堆叠规则（小屏卡片被压扁）。 */
.ratio-16-10{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.ratio-13-10{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.ratio-10-12{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.span-2{grid-column:span 2}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ============ 7. 空状态（插画位） ============ */
.empty{text-align:center;padding:36px 20px;color:var(--text-3)}
.empty svg{width:56px;height:56px;margin-bottom:12px;opacity:.9}
.empty p{margin:0 0 12px;font-size:13.5px;font-weight:600;color:var(--text-2)}

/* ============ 8. 统计卡 ============ */
.stat{
  background:var(--bg-elev);border:1.5px solid var(--border);border-radius:var(--r);
  padding:15px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);
  transition:transform var(--d) var(--ease),box-shadow var(--d),border-color var(--d);
}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.stat::after{
  content:"";position:absolute;right:-24px;top:-24px;width:78px;height:78px;border-radius:50%;
  background:var(--accent-soft);opacity:.75;
}
.stat::before{
  content:"";position:absolute;right:14px;top:16px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);opacity:.5;
}
.stat-label{
  font-size:11.5px;font-weight:800;color:var(--text-3);letter-spacing:.6px;
  text-transform:uppercase;position:relative;font-family:var(--font-display);
}
.stat-value{
  font-size:31px;font-weight:800;letter-spacing:-.9px;line-height:1.12;margin-top:5px;
  position:relative;font-variant-numeric:tabular-nums;font-family:var(--font-display);
  animation:popNum var(--d-slow) var(--spring) both;
}
.stat-value small{font-size:14px;font-weight:700;color:var(--text-3);margin-left:1px;letter-spacing:0}
.stat-foot{font-size:11.5px;color:var(--text-3);margin-top:4px;position:relative;display:flex;align-items:center;gap:5px}
.delta{font-weight:800;font-family:var(--mono);font-size:11.5px;padding:0 5px;border-radius:6px}
.delta.up{color:var(--win);background:var(--win-soft)}
.delta.down{color:var(--loss);background:var(--loss-soft)}
.delta.flat{color:var(--text-3);background:var(--bg-sunken)}

/* ============ 9. 提醒条 ============ */
.nudge{
  display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:14px;
  border-radius:var(--r-sm);background:var(--warn-soft);
  border:1.5px solid color-mix(in srgb,var(--warn) 45%,transparent);
  color:var(--text);font-size:13px;font-weight:600;
  animation:riseIn var(--d-slow) var(--ease) both;
}
.nudge svg{width:18px;height:18px;flex:none;color:var(--warn)}
.nudge-text{flex:1;min-width:0}
.nudge-text b{font-family:var(--mono);font-weight:800;color:color-mix(in srgb,var(--warn) 78%,var(--ink))}

/* ============ 10. 表格（安静区：不加装饰，只保清晰） ============ */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
th{
  text-align:left;font-size:11px;font-weight:800;color:var(--text-3);letter-spacing:.8px;
  text-transform:uppercase;padding:9px 12px;border-bottom:1.5px solid var(--border);
  background:var(--bg-sunken);white-space:nowrap;position:sticky;top:0;font-family:var(--font-display);
}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background var(--d-fast)}
tbody tr:hover{background:var(--bg-hover)}
tbody tr:last-child td{border-bottom:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.t-right{text-align:right}

/* ============ 11. 徽章：有文字 + 有描边 ============ */
.tag{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:750;
  padding:2px 9px;border-radius:20px;white-space:nowrap;line-height:1.7;
  border:1.5px solid transparent;font-family:var(--font-display);
}
.tag-win{background:var(--win-soft);color:color-mix(in srgb,var(--win) 82%,var(--ink));border-color:color-mix(in srgb,var(--win) 38%,transparent)}
.tag-loss{background:var(--loss-soft);color:color-mix(in srgb,var(--loss) 82%,var(--ink));border-color:color-mix(in srgb,var(--loss) 38%,transparent)}
.tag-draw{background:var(--warn-soft);color:color-mix(in srgb,var(--warn) 82%,var(--ink));border-color:color-mix(in srgb,var(--warn) 38%,transparent)}
.tag-neutral{background:var(--bg-sunken);color:var(--text-2);border-color:var(--border-strong)}
.tag-accent{background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 78%,var(--ink));border-color:color-mix(in srgb,var(--accent) 38%,transparent)}
.tag-sm{font-size:10.5px;padding:1px 7px}

/* ============ 12. 分段控件 ============ */
.seg{display:inline-flex;background:var(--bg-sunken);border-radius:var(--r-sm);padding:3px;gap:2px;border:1.5px solid var(--border)}
.seg button{
  border:1.5px solid transparent;background:transparent;color:var(--text-2);padding:5px 12px;
  border-radius:var(--r-xs);font-size:12.5px;font-weight:700;transition:all var(--d-fast) var(--spring);
  font-family:var(--font-display);
}
.seg button:hover{color:var(--text)}
.seg button.on{
  background:var(--bg-elev);color:color-mix(in srgb,var(--accent) 72%,var(--ink));
  border-color:var(--border-strong);box-shadow:var(--shadow-sm);
}

/* 周期下拉（原来是 4 个 .seg 胶囊，窄屏会把标题挤到换行）
   为什么自绘而不是 <select>：原生展开层由系统渲染，圆角/描边/投影/选中高亮一律改不了，
   孤零零一个系统白框放进这套「墨色描边 + 大圆角 + 糖果色」的语言里会格外突兀。
   视觉不引入任何新色值，全部复用既有令牌：
     触发键  = 迷你 .btn（同样的 border-strong 边框 + bg-elev 底，hover 转 bg-hover + ink 边）
     展开面板 = .modal 的墨色描边 + .card 的白底 + --shadow-lg 浮层投影
     选中项  = .tag-accent 的 accent-soft 底 + accent 文字 + 对勾 */
.range-pick{position:relative;flex:0 0 auto}
.range-btn{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;
  border:1.5px solid var(--border-strong);border-radius:var(--r-sm);
  background:var(--bg-elev);color:var(--text);
  font-family:var(--font-display);font-size:12.5px;font-weight:700;white-space:nowrap;
  transition:background var(--d-fast),border-color var(--d-fast),box-shadow var(--d-fast),transform var(--d-fast) var(--spring);
}
.range-btn:hover{background:var(--bg-hover);border-color:var(--ink)}
.range-btn:active{transform:translateY(1px) scale(.98)}
.range-btn .ico{flex:0 0 13px;width:13px;height:13px;opacity:.7}
.range-btn .chev{flex:0 0 11px;width:11px;height:11px;opacity:.6;transition:transform var(--d) var(--spring)}
.range-btn[aria-expanded="true"]{
  border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 17%,transparent);
}
.range-btn[aria-expanded="true"] .chev{transform:rotate(180deg);opacity:.9}

/* 展开面板：右对齐挂在触发键下方，宽度由最长选项决定 */
.range-menu{
  position:absolute;right:0;top:calc(100% + 7px);z-index:60;
  min-width:100%;width:max-content;padding:5px;
  border:1.5px solid var(--ink);border-radius:var(--r);
  background:var(--bg-elev);box-shadow:var(--shadow-lg);
  animation:rangeIn var(--d) var(--spring);
}
.range-menu[hidden]{display:none}
@keyframes rangeIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.range-opt{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;
  border:0;background:transparent;border-radius:var(--r-xs);
  color:var(--text-2);font-family:var(--font-display);font-size:12.5px;font-weight:700;
  text-align:left;white-space:nowrap;cursor:pointer;
  transition:background var(--d-fast),color var(--d-fast);
}
.range-opt:hover{background:var(--bg-hover);color:var(--text)}
.range-opt .tick{flex:0 0 13px;width:13px;height:13px;margin-left:auto;opacity:0;transition:opacity var(--d-fast)}
/* .on 写在 hover 之后：同一特异性下后写者胜，选中项悬停时不会被 bg-hover 冲掉。
   内描边用 inset box-shadow 而不是 border —— 加 border 会让选中项比其它项高 3px，行距就不齐了。 */
.range-opt.on{
  background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 78%,var(--ink));
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 42%,transparent);
}
.range-opt.on .tick{opacity:1}
/* 焦点环内缩到选项内部：全局 :focus-visible 是 3px + offset 2px，向外扩会正好填满面板
   padding，让当前项的可见边界比其它项大一圈 —— 内缩后与上面的内描边叠在一起，行距齐平。 */
.range-opt:focus-visible{outline-offset:-3px}

/* ============ 13. 进度条 ============ */
.bar{height:8px;border-radius:20px;background:var(--track);overflow:hidden}
.bar > i{
  display:block;height:100%;border-radius:20px;
  background:linear-gradient(90deg,var(--accent),var(--warn));
  transition:width .62s var(--spring);
}
.bar.win > i{background:linear-gradient(90deg,var(--win),color-mix(in srgb,var(--win) 55%,var(--sun)))}
.bar.loss > i{background:linear-gradient(90deg,var(--loss),color-mix(in srgb,var(--loss) 55%,var(--accent-3)))}

/* ============ 14. 评分点 ============ */
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--track);display:block;transition:background var(--d-fast)}
.dots i.on{background:var(--accent)}
.dots i.on.hi{background:var(--accent-2)}

/* ============ 15. 模态 ============ */
.modal-mask{
  position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 48%,transparent);
  backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;
  padding:18px;animation:fade var(--d) var(--ease);overflow-y:auto;
}
.modal{
  background:var(--bg-elev);border:2px solid var(--ink);border-radius:var(--r-lg);
  width:100%;max-width:660px;box-shadow:var(--shadow-lg);
  animation:popIn var(--d-slow) var(--spring);margin:auto;
  max-height:calc(100vh - 36px);display:flex;flex-direction:column;
}
.modal.wide{max-width:820px}
.modal-head{
  padding:17px 20px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:10px;flex:0 0 auto;
}
.modal-head h3{margin:0;font-size:17px;font-weight:800}
.modal-head .x{margin-left:auto}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{
  padding:14px 20px;border-top:1.5px solid var(--border);display:flex;gap:9px;justify-content:flex-end;flex:0 0 auto;
  background:var(--bg-sunken);border-radius:0 0 calc(var(--r-lg) - 2px) calc(var(--r-lg) - 2px);
}

/* ============ 16. Toast（带小羽） ============ */
#toasts{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:9px;
  background:var(--bg-elev);color:var(--text);border:2px solid var(--ink);
  padding:9px 16px 9px 10px;border-radius:26px;font-size:13.5px;font-weight:700;
  box-shadow:var(--shadow-lg);animation:toastIn var(--d-slow) var(--spring);max-width:90vw;
  font-family:var(--font-display);
}
.toast svg{width:26px;height:26px;flex:0 0 26px}
.toast.ok{border-color:var(--loss)}
.toast.err{border-color:var(--win)}

/* ============ 17. 图表 ============ */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--font-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:4px;display:block;flex:0 0 10px}

/* ============ 18. 时间轴 ============ */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border);border-radius:2px}
.tl-item{position:relative;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;left:-25px;top:4px;width:12px;height:12px;border-radius:50%;
  background:var(--bg-elev);border:2.5px solid var(--accent);z-index:1;
}
.tl-dot.win{border-color:var(--win)}
.tl-dot.loss{border-color:var(--loss)}
.tl-dot.goal{border-color:var(--warn)}
.tl-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.tl-title{font-weight:750;font-size:14px}
.tl-date{font-size:11.5px;color:var(--text-3);font-family:var(--mono)}
.tl-body{font-size:13px;color:var(--text-2);margin-top:3px}

/* ============ 19. 移动端导航 ============ */
/* 悬浮导航（浮岛）：不再全宽贴底，而是左右内缩、离屏底留距的圆角胶囊。
   语言与项目其它浮动件一致 —— 墨色描边（.modal/.range-menu）+ 实体底影（--sticker，.fab），
   底色仍是毛玻璃。浮岛下方与两侧露出页面内容，滚动时从球下面穿过。 */
.tabbar{
  display:none;position:fixed;left:12px;right:12px;
  bottom:calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg-elev) 92%,transparent);
  backdrop-filter:blur(16px) saturate(160%);
  border:1.5px solid var(--ink);border-radius:var(--r-lg);
  box-shadow:0 4px 0 var(--ink),var(--shadow-lg);z-index:50;
}
.tabbar-inner{display:flex;height:56px}
.tab{
  flex:1 1 0;min-width:0;margin:0 5px;padding:0 2px;border:0;background:transparent;color:var(--text-3);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:750;
  border-radius:var(--r-sm);
  transition:color var(--d-fast),background var(--d-fast),transform var(--d-fast) var(--spring);font-family:var(--font-display);
}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab svg{width:21px;height:21px;flex:0 0 auto}
.tab:active{transform:scale(.92)}
.tab.on{color:var(--accent);background:var(--accent-soft)}
.tab.on svg{animation:popIn var(--d) var(--spring)}

/* 「更多」底部面板 */
.modal-mask.sheet-mask{align-items:flex-end;padding:0}
.modal.sheet{
  max-width:520px;margin:0 auto;border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom:0;
  padding-bottom:env(safe-area-inset-bottom);animation:sheetUp var(--d-slow) var(--spring);
}
.sheet-grip{width:42px;height:4.5px;border-radius:99px;background:var(--border-strong);margin:10px auto 0;flex:0 0 auto}
.sheet-item{justify-content:flex-start;padding:13px 15px;text-align:left;width:100%}
.sheet-item .nav-badge{margin-left:auto}
@keyframes sheetUp{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}

.mobile-only{display:none}
/* bottom：浮岛顶 = 10(离底) + 56(高) + 4(实体底影) ≈ 70px，再留 14px 呼吸 */
.fab{
  position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
  background:linear-gradient(150deg,var(--accent),var(--warn));color:#fff;
  border:2px solid var(--ink);display:none;align-items:center;justify-content:center;
  box-shadow:0 6px 0 var(--ink),0 12px 26px rgba(255,122,69,.35);z-index:51;
  transition:transform var(--d-fast) var(--spring);
}
.fab:active{transform:translateY(3px) scale(.97);box-shadow:0 3px 0 var(--ink)}
.fab svg{width:25px;height:25px}

/* ============ 20. 技术卡 ============ */
.skill-card{
  background:var(--bg-elev);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 15px;
  box-shadow:var(--shadow-sm);transition:transform var(--d) var(--ease),border-color var(--d),box-shadow var(--d);
}
.skill-card:hover{transform:translateY(-3px);border-color:var(--border-strong);box-shadow:var(--shadow)}
.skill-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:11px}
.skill-name{font-weight:750;font-size:13.5px;line-height:1.35;font-family:var(--font-display)}
.skill-cat{font-size:10.5px;color:var(--text-3);letter-spacing:.6px;text-transform:uppercase;font-weight:800}
.skill-score{margin-left:auto;font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1}
.skill-score small{font-size:11px;color:var(--text-3);font-weight:700}
.spark{margin-top:9px}
.feedback-mini{
  margin-top:10px;padding-top:9px;border-top:1.5px dashed var(--border);font-size:12px;color:var(--text-2);
  display:flex;gap:6px;align-items:flex-start;
}
.feedback-mini .who{color:var(--text-3);font-weight:750;flex:0 0 auto}

/* ============ 21. 滑块评分 ============ */
.rate{display:flex;align-items:center;gap:9px}
.rate input[type=range]{flex:1;accent-color:var(--accent);height:22px}
.rate .val{
  font-family:var(--mono);font-weight:800;font-size:15px;min-width:36px;text-align:center;
  background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 78%,var(--ink));
  padding:2px 0;border-radius:var(--r-xs);border:1.5px solid color-mix(in srgb,var(--accent) 30%,transparent);
}

/* ============ 22. 目标卡 ============ */
.goal{
  background:var(--bg-elev);border:1.5px solid var(--border);border-radius:var(--r);padding:15px 16px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:transform var(--d) var(--ease),box-shadow var(--d);
}
.goal:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.goal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.goal.done::before{background:var(--loss)}
.goal.overdue::before{background:var(--win)}
.goal.done{background:linear-gradient(180deg,var(--loss-soft),var(--bg-elev) 60%)}
.goal-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.goal-title{font-weight:800;font-size:14.5px;line-height:1.35;font-family:var(--font-display)}
.goal-meta{font-size:11.5px;color:var(--text-3);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.goal-prog{display:flex;align-items:center;gap:10px;margin:11px 0 8px}
.goal-prog .bar{flex:1}
.goal-prog b{font-family:var(--mono);font-size:14.5px;font-weight:800;min-width:44px;text-align:right}
.goal.done .goal-prog b{color:var(--loss)}
.steps{display:flex;flex-direction:column;gap:5px;margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--border)}
.step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none;transition:color var(--d-fast)}
.step:hover{color:var(--text)}
.step input{accent-color:var(--accent);width:16px;height:16px;cursor:pointer;flex:0 0 16px}
.step.done span{text-decoration:line-through;color:var(--text-3)}

/* ============ 23. 日记 ============ */
.note{
  background:var(--bg-elev);border:1.5px solid var(--border);border-radius:var(--r);padding:15px 17px;
  box-shadow:var(--shadow-sm);break-inside:avoid;margin-bottom:14px;
  transition:transform var(--d) var(--ease),box-shadow var(--d),border-color var(--d);
}
.note:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.note-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.note-title{font-weight:800;font-size:14.5px;font-family:var(--font-display)}
.note-date{font-size:11.5px;color:var(--text-3);font-family:var(--mono);flex:0 0 auto}
.note-body{font-size:13.5px;color:var(--text-2);white-space:pre-wrap;word-break:break-word;line-height:1.75}
.note-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.masonry{column-count:2;column-gap:14px}
@media(max-width:820px){.masonry{column-count:1}}

/* ============ 24. 筛选条 ============ */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:15px}
.filters .field{min-width:134px;flex:0 1 auto}

/* ============ 25. 球友卡 ============ */
.rival{
  display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--bg-elev);
  border:1.5px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm);cursor:pointer;
  transition:transform var(--d) var(--ease),box-shadow var(--d),border-color var(--d);
}
.rival:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.avatar{
  width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:grid;place-items:center;
  font-weight:800;font-size:15px;color:#fff;letter-spacing:.5px;
  border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);
  font-family:var(--font-display);
}
.rival-name{font-weight:750;font-size:14px;font-family:var(--font-display)}
.rival-sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
.rival-stats{margin-left:auto;text-align:right;display:flex;gap:14px}
.rival-stats div{display:flex;flex-direction:column;align-items:flex-end}
.rival-stats b{font-family:var(--mono);font-size:15.5px;font-weight:800}
.rival-stats span{font-size:10px;color:var(--text-3);letter-spacing:.6px;text-transform:uppercase;font-weight:750}

/* 头像内的 SVG 用绝对定位铺满，避免 display:grid 下尺寸不稳；
   文字兜底模式（姓名首字）仍走 grid 居中 */
.avatar{position:relative}
.avatar svg{position:absolute;inset:0;display:block;width:100%;height:100%}
.avatar-txt{display:grid;place-items:center}
/* 头像选择器：列宽用 auto-fill 自适应，靠换行自然堆叠，
   因此不需要在 920px 断点里额外声明单列规则 */
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.av-cell{
  aspect-ratio:1;padding:0;cursor:pointer;overflow:hidden;position:relative;
  border:2px solid var(--border-strong);border-radius:50%;background:var(--bg-sunken);
  display:grid;place-items:center;
  transition:transform var(--d-fast) var(--spring),border-color var(--d-fast),box-shadow var(--d-fast);
}
.av-cell svg{position:absolute;inset:0;display:block;width:100%;height:100%}
.av-cell:hover{transform:translateY(-2px);border-color:var(--text-3)}
.av-cell.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.av-cell.av-auto{border-style:dashed}
.av-cell.av-auto.on{border-style:solid}
.av-auto-t{font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--text-3)}
/* 详情弹窗抬头：和大头像并排的姓名块 */
.pv-head{
  display:flex;align-items:center;gap:13px;margin-bottom:16px;padding:12px 14px;
  background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--r-sm);
}
.pv-head .avatar{width:54px;height:54px;flex:0 0 54px;font-size:18px}
.pv-name{font-family:var(--font-display);font-size:16px;font-weight:800;line-height:1.35}
.pv-sub{font-size:12.5px;color:var(--text-2);margin-top:2px;line-height:1.5}

/* ============================================================================
   26. 插画系统 —— 小羽与场景涂鸦
   ============================================================================ */
.mascot{display:block;overflow:visible}
.mascot.bob{animation:bob 3.6s var(--ease) infinite}
.mascot.cheer{animation:cheer 900ms var(--spring)}
/* 插画里的墨线统一走 --ink，保证浅深色主题都成立 */
.illo{display:block;margin:0 auto;overflow:visible}
.illo .ln{stroke:var(--ink);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round;fill:none}
.illo .ln-thin{stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;fill:none}
.illo .lighter{opacity:.35}

/* ============================================================================
   27. Hero —— 唯一"大声"的内容区
   ============================================================================ */
.hero{
  position:relative;overflow:hidden;margin-bottom:16px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;
  padding:22px 26px;border-radius:var(--r-xl);
  border:2px solid var(--ink);box-shadow:0 5px 0 var(--ink),var(--shadow-lg);
  background:
    radial-gradient(120% 150% at 88% 10%,var(--accent-soft) 0%,transparent 62%),
    linear-gradient(150deg,var(--bg-elev),color-mix(in srgb,var(--accent-soft) 55%,var(--bg-elev)));
}
/* 背景涂鸦：柔和的彩色圆斑，安静地待在后层 */
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:190px;height:190px;right:-40px;bottom:-70px;background:var(--accent-2);opacity:.14}
.hero::after{width:96px;height:96px;left:44%;top:-42px;background:var(--sun);opacity:.2}
.hero-copy{position:relative;z-index:1;min-width:0}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  color:color-mix(in srgb,var(--accent) 74%,var(--ink));
  background:var(--bg-elev);border:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent);
  padding:3px 10px;border-radius:20px;margin-bottom:10px;font-family:var(--font-display);
}
.hero-title{
  margin:0 0 8px;font-size:clamp(23px,4.4vw,34px);line-height:1.16;
  font-weight:800;letter-spacing:-.9px;font-family:var(--font-display);
}
.hero-title em{
  font-style:normal;position:relative;white-space:nowrap;
  color:color-mix(in srgb,var(--accent) 86%,var(--ink));
}
/* 荧光笔划线：手绘感的重点标记 */
.hero-title em::after{
  content:"";position:absolute;left:-3px;right:-3px;bottom:.06em;height:.34em;
  background:color-mix(in srgb,var(--sun) 62%,transparent);border-radius:4px;z-index:-1;
}
.hero-say{
  margin:0;font-size:13.5px;font-weight:600;color:var(--text-2);max-width:46ch;
}
.hero-art{position:relative;z-index:1;flex:0 0 auto}
.hero-art .mascot{width:132px;height:132px}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero-chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--bg-elev);
  border:1.5px solid var(--border-strong);border-radius:20px;padding:4px 11px;
  font-size:12px;font-weight:700;font-family:var(--font-display);color:var(--text-2);
}
.hero-chip b{font-family:var(--mono);font-weight:800;color:color-mix(in srgb,var(--accent) 78%,var(--ink))}
.hero-chip svg{width:14px;height:14px;color:var(--accent)}

/* ============================================================================
   28. 动效 —— 每个都有因果，且总时长可控
   ============================================================================ */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
@keyframes popNum{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes cheer{0%{transform:translateY(0) scale(1)}38%{transform:translateY(-12px) scale(1.1) rotate(-5deg)}100%{transform:none}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes confettiFall{
  0%{transform:translate3d(0,-12px,0) rotate(0);opacity:1}
  100%{transform:translate3d(var(--cx,0),var(--cy,220px),0) rotate(var(--cr,320deg));opacity:0}
}
@keyframes fadeUp{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}

/* 页面进入：子元素依次浮现，延迟封顶 120ms，整体 ≤ 440ms */
.view > *{animation:riseIn var(--d-slow) var(--ease) both}
.view > *:nth-child(2){animation-delay:40ms}
.view > *:nth-child(3){animation-delay:80ms}
.view > *:nth-child(4){animation-delay:120ms}
.view > *:nth-child(n+5){animation-delay:120ms}

/* 彩带层 */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
#confetti i{position:absolute;display:block;border-radius:2px}

/* ============================================================================
   29. 滚动条
   ============================================================================ */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;border:2.5px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

/* ============================================================================
   30. 响应式
   ============================================================================ */
@media(max-width:1080px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:920px){
  .sidebar{display:none}
  .tabbar{display:block}
  .mobile-only{display:flex}
  .fab{display:flex}
  /* 浮岛占位：10(离底) + 56(高) ≈ 70px + 底影，加 safe-area 与呼吸空间 */
  .view{padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
  .topbar{padding:0 14px;gap:10px}
  .topbar h1{font-size:16px}
  .topbar .sub{display:none}
  .topbar-actions{gap:6px}
  /* 自绘按钮不是表单控件，不触发 iOS「字号 <16px 则聚焦缩放整页」那套行为，
     所以这里可以放心压到 13px 换宽度 */
  .range-btn{height:36px;font-size:13px;padding:0 9px}
  .g2,.g3,.g4,.ratio-16-10,.ratio-13-10,.ratio-10-12{grid-template-columns:minmax(0,1fr)}
  .span-2{grid-column:span 1}
  .filters .field{flex:1 1 130px;min-width:0}
  .rival-stats{gap:10px}
  .modal{max-width:100%}
  .hero{grid-template-columns:minmax(0,1fr);padding:18px 18px 0;gap:6px}
  .hero-art{justify-self:end;margin-top:-8px}
  .hero-art .mascot{width:104px;height:104px}
}
@media(max-width:560px){
  .stat-value{font-size:26px}
  .card-body{padding:13px}
  /* 卡片头：360px 屏上「标题 + 描述 + 查看记录」并排要 310px，可用只有 297px ——
     差 13px 的结果是三个都收缩，标题被压折。窄屏改为两行：
     第一行「标题 + 操作」，第二行描述独占整行。
     描述换行后拿到的是整行宽度（297px），13 字的文案反而能单行放下了。 */
  /* 第一列的 min 用 min-content 而不是 0：`1fr` 只承担"剩余空间"，
     320px 屏上「自评记录」卡右侧塞了两个按钮（补记单项 + 开始自评，205px），
     剩余只剩 48px —— 若允许压到 0，标题就被挤成两行。
     改成 min-content 后标题先拿到它需要的整宽，压力转给右侧（见下方 .right）。 */
  .card-head{
    display:grid;grid-template-columns:minmax(min-content,1fr) minmax(0,max-content);
    column-gap:8px;row-gap:3px;padding:12px 14px;
  }
  /* ellipsis 是兜底：正常标题都放得下，防的是以后加进来的超长文案 */
  .card-head h3{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .card-head .hint{grid-column:1 / -1}
  /* 极窄屏放得下两个按钮就并排（自评记录卡），放不下就竖排，不横向溢出 */
  .card-head .right{
    grid-column:2;grid-row:1;margin-left:0;
    flex-wrap:wrap;justify-content:flex-end;
  }
  .modal-body{padding:15px}
  .masonry{column-count:1}
  .hero{border-radius:var(--r-lg);box-shadow:0 4px 0 var(--ink)}
  .hero-title{letter-spacing:-.5px}
  /* 头像网格：窄屏更密，17 格也不至于把弹窗撑得很长 */
  .av-grid{grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
  .pv-head{padding:10px 12px;gap:11px}
  .pv-head .avatar{width:46px;height:46px;flex:0 0 46px;font-size:16px}
}
/* 极窄屏（≤340px，如 iPhone 5 / SE 一代的 320px）：最长的标题是 5 个字「目标里程碑」，
   此时把「记录」收成纯图标腾出空间。功能不丢 —— 右下角 FAB 是同一个入口。
   360px 及以上不需要这一步：实测还有 34px 余量，文案保留更易读。 */
@media(max-width:340px){
  .topbar{gap:8px}
  .range-btn{padding:0 8px;gap:5px}
  #quickAdd{padding:7px 11px}
  #quickAdd span{display:none}
}
@media(min-width:921px){ .fab{display:none !important} }

/* ============================================================================
   31. 可访问性：尊重"减少动态效果"，所有动效一键关闭
   ============================================================================ */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
  .view > *{opacity:1 !important;transform:none !important}
  #confetti{display:none !important}
}

/* ============================================================================
   32. 打印
   ============================================================================ */
@media print{
  .sidebar,.topbar,.tabbar,.fab,.no-print,#confetti{display:none !important}
  .view{padding:0}
  body{background:#fff;background-image:none}
  .view > *{animation:none !important;opacity:1 !important;transform:none !important}
  .hero{box-shadow:none;border-width:1px}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}


/* ============ 24. 专项自评（连续表单） ============ */
/* 分数配色：能力分不借「胜/负」语义，单独分级 */
:root{ --score-hi:var(--win); --score-mid:var(--accent); --score-low:var(--warn); }
html[data-theme="dark"]{ --score-hi:var(--win); --score-mid:var(--accent); --score-low:var(--warn); }

.as-h2{margin:0;font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.4px}
.as-sub{margin:3px 0 0;font-size:12.5px;color:var(--text-2)}

.as-top{
  display:flex;align-items:flex-start;gap:13px;flex-wrap:wrap;margin-bottom:14px;
}
.as-top-main{flex:1;min-width:200px}
.as-top-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.as-ruler{
  display:flex;gap:11px;align-items:flex-start;
  background:var(--accent-2-soft);border:1.5px solid color-mix(in srgb,var(--accent-2) 30%,var(--border));
  border-radius:var(--r);padding:13px 16px;font-size:12.5px;line-height:1.75;color:var(--text-2);
  margin-bottom:14px;
}

.as-prog-bar > i{

  background:linear-gradient(90deg,var(--accent),var(--sun));
  transition:width 420ms var(--spring);
}
.as-prog-text{font-family:var(--mono);font-size:12.5px;font-weight:800;color:var(--text-2);flex:0 0 auto}

/* 只看未评：18 项一次走完时用来快速补齐剩余项 */
.as-filter{
  font:inherit;font-size:12px;font-weight:700;cursor:pointer;flex:0 0 auto;
  background:var(--bg-elev);border:1.5px solid var(--border-strong);border-radius:999px;

}

  background:var(--bg-elev);border:1.5px solid var(--border);border-radius:999px;
  padding:6px 13px;transition:all var(--d-fast);
}
.as-jump-a:hover{color:var(--text);border-color:var(--border-strong);transform:translateY(-1px)}

.as-sec{margin-bottom:22px;scroll-margin-top:14px}

.as-sec-dot[data-cat="技术"]{background:var(--accent)}

  background:var(--bg-elev);border:1.5px solid var(--border);border-radius:var(--r);

}

  background:var(--bg-sunken);border:1.5px solid var(--border);border-radius:999px;padding:2px 9px;
}
.as-was{margin-left:auto;font-size:12px;color:var(--text-2);white-space:nowrap}

.as-fold{
  font:inherit;font-size:12px;font-weight:700;cursor:pointer;

  padding:5px 12px;color:var(--text-2);transition:all var(--d-fast);flex:0 0 auto;
}

.as-obs{margin-bottom:11px}

}

}

/* 自评标准总览 */
.std-h{font-family:var(--font-display);font-size:15px;font-weight:800;margin-bottom:8px}

  background:var(--bg-sunken);border:1.5px dashed var(--border);
}
.std-note b{color:var(--text);font-family:var(--mono)}
.std-sec{margin-bottom:20px}
.std-sec-h{
  font-family:var(--font-display);font-size:14.5px;font-weight:800;margin-bottom:9px;

}

.diag-item{
  display:flex;flex-direction:column;gap:7px;padding:12px 13px;

}
.diag-good svg{flex:0 0 15px;width:15px;height:15px;margin-top:3px;color:var(--win)}
.diag-good b{color:var(--text);font-weight:650}

/* 复用小圆角分级与贴纸阴影，深浅两套主题自动适配 */
.pwa-ico{flex:0 0 46px;width:46px;height:46px;border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--shadow-sm)}

}

  .pwa-ico{flex-basis:40px;width:40px;height:40px}
  .pwa-ico svg{width:40px;height:40px}
}

   把主观印象换成可核对的次数；锚点固定不变，因此分数可以跨月比较。

*/

const TECH_CAT_ITEMS = cat => TECH_ITEMS.filter(t => t.cat === cat);

/* ---------- 自评标准：四档锚点 + 观测题折算 ---------- */
const OBS_MAX = 3;                 /* 每道观测题满分 */
const ANCHOR_TIERS = [
  { r: "1–3",  lo: 1, hi: 3  },
  { r: "4–6",  lo: 4, hi: 6  },
  { r: "7–8",  lo: 7, hi: 8  },
  { r: "9–10", lo: 9, hi: 10 }
];
const asClamp = (v, a, b) => Math.max(a, Math.min(b, v));
/* 分数 → 第几档锚点（1–3 / 4–6 / 7–8 / 9–10） */
function anchorIndex(score){
  const s = asClamp(Math.round(+score || 0), 1, 10);
  return s <= 3 ? 0 : s <= 6 ? 1 : s <= 8 ? 2 : 3;
}
/* 分数 → 该档的行为描述（自评时可对照，保证同一把尺子） */
function anchorText(techId, score){
  const t = TECH_MAP[techId];
  if(!t) return "";
  const a = t.anchors[anchorIndex(score)];
  return a ? `${a.r} · ${a.t}` : "";
}
/* 观测题答案 → 建议分：各题等权，0 分对应 1 分、满分对应 10 分
   保留一位小数（1 / 2.5 / 4 / 5.5 / 7 / 8.5 / 10），
   让折算结果不被取整抹掉信息，最终分由自己以此为中心取整微调 */
function suggestScore(answers){
  const vals = (answers || []).filter(v => v !== null && v !== undefined && v !== "")
    .map(v => asClamp(Math.round(+v || 0), 0, OBS_MAX));
  if(!vals.length) return null;
  const got = vals.reduce((a, b) => a + b, 0), max = vals.length * OBS_MAX;
  return Math.round((1 + got * 9 / max) * 10) / 10;
}
/* 四档锚点是否无缝覆盖 1–10（供测试与自查） */
function anchorTiersCovered(){
  return ANCHOR_TIERS.map(t => t.hi - t.lo + 1).reduce((a, b) => a + b, 0) === 10;
}
/* 自评记录口径：只有自评算数（统一自评方式） */
const isSelfRec = r => !r || !r.by || r.by === "self";
/* 分数配色：不借「胜/负」语义，单独分级 */
function scoreColor(v){
  return v >= 8 ? "var(--score-hi)" : v >= 6 ? "var(--score-mid)" : "var(--score-low)";
}

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return seedDemo(JSON.parse(JSON.stringify(DEFAULTS)));
    const parsed = JSON.parse(raw);
    return migrate(Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), parsed));
  }catch(e){
    console.error("读取数据失败", e);
    return JSON.parse(JSON.stringify(DEFAULTS));
  }
}
function migrate(d){
  const from = d.version || 1;
  d.version = SCHEMA_VERSION;

  ["sessions","skills","goals","notes","rivals"].forEach(k => {
    if(!Array.isArray(d[k])) d[k] = [];
  });
  if(!d.settings) d.settings = { theme:"light", range:90 };
  d.goals.forEach(g => { if(!Array.isArray(g.steps)) g.steps = []; });

  /* ---- v1 → v2：单打/双打拆分 ---- */
  d.sessions.forEach(s => {
    if(!Array.isArray(s.tags)) s.tags = [];

    // 1) 推断项目类型：旧数据若无 discipline，按有无对手/比分判断
    if(!s.discipline){
      if(s.type === "比赛" || (s.opponent && String(s.score||"").trim())){
        s.discipline = "单打";          // 旧数据一律视为单打（当时模型只支持 1v1）
      }else{
        s.discipline = "训练";
      }
    }
    if(DISCIPLINES.indexOf(s.discipline) < 0) s.discipline = "其他";

    // 2) 建立 opponents 数组（从旧 opponent 字段迁移）
    if(!Array.isArray(s.opponents)){
      s.opponents = [];
      if(s.opponent) s.opponents = [s.opponent];
    }
    s.opponents = s.opponents.map(x => String(x || "").trim()).filter(Boolean);
    // 双打上限 2 人，单打上限 1 人（多余截断，避免脏数据）
    s.opponents = s.opponents.slice(0, teamSize(s.discipline));

    // 3) 搭档字段
    if(typeof s.partner !== "string") s.partner = s.partner ? String(s.partner) : "";
    s.partner = s.partner.trim();

    // 4) 兼容旧字段：opponent 保留为首位对手
    s.opponent = s.opponents[0] || "";
  });

  /* ---- 档案 relation：区分 对手 / 搭档 / 两者皆是 ---- */
  d.rivals.forEach(r => {
    if(r.relation !== "opponent" && r.relation !== "partner" && r.relation !== "both")
      r.relation = "opponent";
  });
  // 从记录中回填搭档与对手档案
  d.sessions.forEach(s => {
    if(s.partner) ensureRivalRecord(d, s.partner, "partner");
    s.opponents.forEach(o => ensureRivalRecord(d, o, "opponent"));
  });

  return d;
}

/* 在给定数据对象内建立/升级档案（纯数据操作，不依赖全局 state） */
function ensureRivalRecord(d, name, role){
  name = String(name || "").trim();
  if(!name) return;
  let r = d.rivals.find(x => x.name === name);
  if(!r){
    d.rivals.push({ id: uid(), name, level:"", note:"", color: hashColor(name), relation: role });
    return;
  }
  if(!r.relation) r.relation = role;
  else if(r.relation !== role && r.relation !== "both") r.relation = "both";
}

    console.error(e); return false;
  }
}

/* ------------------------- 2. 工具函数 ------------------------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pad = n => String(n).padStart(2,"0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const parseDate = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const fmtDate = s => { if(!s) return "—"; const d = parseDate(s); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`; };
const fmtShort = s => { if(!s) return "—"; const d = parseDate(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const daysAgo = s => Math.round((parseDate(todayISO()) - parseDate(s)) / 86400000);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((x,y) => x + y, 0);
const avg = a => a.length ? sum(a) / a.length : 0;
const num1 = v => (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, "");
const money0 = v => Math.round(v).toLocaleString("zh-CN");

function rgbOf(hex, alpha){
  const h = hex.replace("#","");
  const n = parseInt(h.length === 3 ? h.split("").map(c=>c+c).join("") : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
}
function hashColor(str){
  const palette = ["#0a6fb5","#12a594","#d9930a","#8b5cf6","#e0453c","#0e9f6e","#c2410c","#0369a1","#7c3aed","#be185d"];
  let h = 0; for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) | 0;
  return palette[Math.abs(h) % palette.length];
}
function initials(name){
  const s = String(name||"").trim();
  if(!s) return "?";
  if(/[\u4e00-\u9fa5]/.test(s)) return s.slice(-2);
  return s.slice(0,2).toUpperCase();
}

/* 从比分字符串解析胜负： "21-19,17-21,21-15" */
function parseScore(score){
  const s = String(score||"").trim();
  if(!s) return { sets: [], winSets:0, loseSets:0, result:null };
  const sets = [];
  s.split(/[,，;；\s]+/).filter(Boolean).forEach(part => {
    const m = part.match(/(\d+)\s*[-:：]\s*(\d+)/);
    if(m) sets.push({ a:+m[1], b:+m[2] });
  });
  let winSets = 0, loseSets = 0;
  sets.forEach(st => { if(st.a > st.b) winSets++; else if(st.b > st.a) loseSets++; });
  let result = null;
  if(sets.length){
    if(winSets > loseSets) result = "win";
    else if(loseSets > winSets) result = "loss";
    else result = "draw";
  }
  return { sets, winSets, loseSets, result };
}
function scoreText(score){
  const p = parseScore(score);
  if(!p.sets.length) return "—";
  return `${p.winSets}:${p.loseSets} (${p.sets.map(s=>`${s.a}-${s.b}`).join(" ")})`;
}
const RESULT_LABEL = { win:"胜", loss:"负", draw:"平" };
const RESULT_CLASS = { win:"tag-win", loss:"tag-loss", draw:"tag-draw" };

/* 会话是否算一场"比赛"：
   ① 有比分 → 是比赛（含训练赛、练习赛）
   ② 显式标记 type="比赛" → 是比赛（即使比分尚未补录，也计入胜负待补）
   ③ 其余（训练/其他且无比分）→ 不是比赛，不计入胜率 */
function isMatch(s){
  if(!s) return false;
  if(parseScore(s.score).sets.length) return true;
  return s.type === "比赛";
}
/* 会话的项目类型（兼容旧数据） */
function disciplineOf(s){
  if(s.discipline && DISCIPLINES.indexOf(s.discipline) >= 0) return s.discipline;
  if(s.type === "比赛" || parseScore(s.score).sets.length) return "单打";
  return "训练";
}
/* 该场次的对手列表 */
function opponentsOf(s){
  const clean = arr => arr.map(x => String(x == null ? "" : x).trim()).filter(Boolean);
  if(Array.isArray(s.opponents)) return clean(s.opponents);
  return s.opponent ? clean([s.opponent]) : [];
}
/* 该场次的搭档 */
function partnerOf(s){ return s.partner || ""; }
/* 对手组合的展示名，如 "老张 + 阿强" */
function opponentLabel(s){
  const arr = opponentsOf(s);
  return arr.length ? arr.join(" + ") : "";
}

/* 按时间范围过滤 */
function inRange(dateStr, days){
  if(!days) return true;
  return daysAgo(dateStr) <= days;
}
function rangeSessions(){ return state.sessions.filter(s => inRange(s.date, state.settings.range)); }

/* ------------------------- 3. 图表引擎（原生 SVG） ------------------------- */
const chart = {
  /* 折线图（支持多序列 + 面积 + 数据点） */
  line(el, opt){
    const { series = [], labels = [], height = 220, yMin = null, yMax = null, yFmt = num1, area = true, showDots = true } = opt;
    const W = 720, H = height, PL = 46, PR = 16, PT = 16, PB = 30;
    const iw = W - PL - PR, ih = H - PT - PB;
    const all = series.flatMap(s => s.data.filter(v => v != null));
    if(!all.length || !labels.length){ el.innerHTML = emptyChart(H, "暂无数据"); return; }
    let lo = yMin != null ? yMin : Math.min(...all);
    let hi = yMax != null ? yMax : Math.max(...all);
    if(hi === lo){ hi = lo + 1; lo = Math.max(0, lo - 1); }
    const padY = (hi - lo) * 0.12;
    if(yMin == null) lo = Math.max(0, lo - padY);
    if(yMax == null) hi = hi + padY;
    const X = i => PL + (labels.length === 1 ? iw/2 : (i / (labels.length-1)) * iw);
    const Y = v => PT + ih - ((v - lo) / (hi - lo)) * ih;

    let g = "";
    // 横向网格 + Y 轴刻度
    const ticks = 4;
    for(let i=0;i<=ticks;i++){
      const v = lo + (hi-lo)*i/ticks, y = Y(v);
      g += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" ${i? '':'stroke-opacity="1"'} ${i===0?'':'stroke-dasharray="3 4"'}/>`;
      g += `<text x="${PL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--text-3)">${yFmt(v)}</text>`;
    }
    // X 轴标签（抽稀）
    const stepL = Math.max(1, Math.ceil(labels.length / 7));
    labels.forEach((lb,i) => {
      if(i % stepL !== 0 && i !== labels.length-1) return;
      g += `<text x="${X(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--text-3)">${esc(lb)}</text>`;
    });
    // 数据系列
    series.forEach((s, si) => {
      const pts = s.data.map((v,i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
      if(!pts.length) return;
      const d = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      if(area && si === 0 && pts.length > 1){
        const grad = `lg${si}_${Math.random().toString(36).slice(2,7)}`;
        const col = s.color || "var(--accent)";
        el.insertAdjacentHTML("afterbegin", `<defs><linearGradient id="${grad}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${col}" stop-opacity=".22"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`);
        g += `<path d="${d} L ${pts[pts.length-1][0].toFixed(1)} ${PT+ih} L ${pts[0][0].toFixed(1)} ${PT+ih} Z" fill="url(#${grad})"/>`;
      }
      g += `<path d="${d}" fill="none" stroke="${s.color||"var(--accent)"}" stroke-width="${s.width||2.2}" stroke-linecap="round" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
      if(showDots) pts.forEach(p => {
        g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${s.dotR||3}" fill="var(--bg-elev)" stroke="${s.color||"var(--accent)"}" stroke-width="2"/>`;
      });
    });
    el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="趋势折线图">${g}</svg>`;
    // 图例
    if(series.length > 1 && opt.legend !== false){
      const lg = document.createElement("div");
      lg.className = "legend";
      lg.innerHTML = series.map(s => `<span><i style="background:${s.color||"var(--accent)"}"></i>${esc(s.name||"")}</span>`).join("");
      el.appendChild(lg);
    }
  },

  /* 柱状图 */
  bar(el, opt){
    const { data = [], labels = [], height = 210, color = "var(--accent)", yFmt = num1, stacked = null } = opt;
    const W = 720, H = height, PL = 40, PR = 14, PT = 14, PB = 30;
    const iw = W - PL - PR, ih = H - PT - PB;
    if(!data.length){ el.innerHTML = emptyChart(H, "暂无数据"); return; }
    const maxV = Math.max(...data, 1) * 1.15;
    const bw = iw / data.length;
    const barW = Math.max(4, Math.min(38, bw * 0.6));
    let g = "";
    for(let i=0;i<=4;i++){
      const v = maxV*i/4, y = PT + ih - (v/maxV)*ih;
      g += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-dasharray="3 4"/>`;
      g += `<text x="${PL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--text-3)">${yFmt(v)}</text>`;
    }
    const stepL = Math.max(1, Math.ceil(labels.length / 8));
    data.forEach((v,i) => {
      const cx = PL + bw*i + bw/2;
      const h = (v/maxV)*ih;
      g += `<rect x="${(cx-barW/2).toFixed(1)}" y="${(PT+ih-h).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3" fill="${color}" fill-opacity=".82"/>`;
      if(labels[i] && (i % stepL === 0 || i === data.length-1))
        g += `<text x="${cx.toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--text-3)">${esc(labels[i])}</text>`;
    });
    el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="柱状图">${g}</svg>`;
  },

  /* 雷达图 */
  radar(el, opt){
    const { items = [], height = 300, empty = "暂无数据" } = opt; // items: [{name, value(0-10)}]
    if(!items.length){ el.innerHTML = emptyChart(height, empty); return; }
    /* 「全为 0」不等价于「自评 0 分」——锚点最低就是 1 分，0 分不是合法自评值。
       所以全 0 只可能是「一次都没打过」，此时数据多边形会塌缩成中心的一个点，
       看着像图坏了。换成空状态，顺便告诉用户去哪打这个分。 */
    if(!items.some(it => +it.value > 0)){ el.innerHTML = emptyChart(height, empty); return; }
    const n = items.length;
    /* 轴数 > 12 时放大画布并交错标签半径：相邻标签一远一近，中文不再压字 */
    const dense = n > 12;
    const S = dense ? 400 : 320, C = S/2, R = dense ? 126 : 108;
    const ang = i => -Math.PI/2 + (i * 2*Math.PI / n);
    const pt = (i, r) => [C + Math.cos(ang(i))*r, C + Math.sin(ang(i))*r];
    const labelR = i => dense ? (i % 2 ? R + 34 : R + 20) : R + 21;
    let g = "";
    // 环
    for(let ring=1; ring<=5; ring++){
      const r = R*ring/5;
      const d = items.map((_,i) => pt(i,r).map(v=>v.toFixed(1)).join(",")).join(" ");
      g += `<polygon points="${d}" fill="${ring===5?"var(--bg-sunken)":"none"}" fill-opacity=".5" stroke="var(--border)" stroke-width="1"/>`;
      if(ring % 5 === 0) g += `<text x="${C}" y="${(C-R+4).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--text-3)">10</text>`;
    }
    // 轴 + 标签
    items.forEach((it,i) => {
      const p = pt(i, R);
      g += `<line x1="${C}" y1="${C}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
      const lp = pt(i, labelR(i));
      const anchor = Math.abs(lp[0]-C) < 12 ? "middle" : (lp[0] > C ? "start" : "end");
      g += `<text x="${lp[0].toFixed(1)}" y="${(lp[1]+4).toFixed(1)}" text-anchor="${anchor}" font-size="${dense?10:10.5}" fill="var(--text-2)">${esc(it.name)}</text>`;
    });
    // 数据多边形
    const dp = items.map((it,i) => pt(i, R * clamp(it.value,0,10)/10).map(v=>v.toFixed(1)).join(",")).join(" ");
    g += `<polygon points="${dp}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
    items.forEach((it,i) => {
      const p = pt(i, R * clamp(it.value,0,10)/10);
      g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--bg-elev)" stroke="var(--accent)" stroke-width="2"/>`;
    });
    el.innerHTML = `<svg class="chart" viewBox="0 0 ${S} ${S}" style="max-width:${S}px;margin:0 auto" role="img" aria-label="技术雷达图">${g}</svg>`;
  },

  /* 环形进度 / 甜甜圈 */
  donut(el, opt){
    const { segments = [], size = 168, thickness = 20, center = "", centerSub = "" } = opt;
    const C = size/2, R = (size - thickness)/2, CIRC = 2*Math.PI*R;
    const total = sum(segments.map(s => s.value)) || 1;
    let off = 0, g = "";
    g += `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--track)" stroke-width="${thickness}"/>`;
    segments.forEach(s => {
      const frac = s.value / total;
      const len = frac * CIRC;
      g += `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${s.color}" stroke-width="${thickness}"
        stroke-dasharray="${len.toFixed(2)} ${(CIRC-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
        transform="rotate(-90 ${C} ${C})" stroke-linecap="butt"/>`;
      off += len;
    });
    g += `<text x="${C}" y="${C - 1}" text-anchor="middle" font-size="27" font-weight="750" fill="var(--text)" font-family="var(--mono)">${esc(center)}</text>`;
    if(centerSub) g += `<text x="${C}" y="${C + 20}" text-anchor="middle" font-size="11.5" fill="var(--text-3)">${esc(centerSub)}</text>`;
    el.innerHTML = `<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:0 auto" role="img" aria-label="占比环形图">${g}</svg>`;
    if(segments.length){
      const lg = document.createElement("div");
      lg.className = "legend"; lg.style.justifyContent = "center";
      lg.innerHTML = segments.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)} ${num1(s.value)}</span>`).join("");
      el.appendChild(lg);
    }
  },

  /* 迷你火花线 */
  spark(el, data, color){
    const vals = data.filter(v => v != null);
    if(vals.length < 2){ el.innerHTML = `<div style="height:28px;display:grid;place-items:center;font-size:11px;color:var(--text-3)">—</div>`; return; }
    const W = 120, H = 28, lo = Math.min(...vals), hi = Math.max(...vals);
    const rng = hi - lo || 1;
    const d = vals.map((v,i) => `${i?"L":"M"}${(i/(vals.length-1)*W).toFixed(1)} ${(H-3-((v-lo)/rng)*(H-6)).toFixed(1)}`).join(" ");
    const last = vals[vals.length-1], lastX = W, lastY = H-3-((last-lo)/rng)*(H-6);
    el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" style="height:28px" preserveAspectRatio="none">
      <path d="${d}" fill="none" stroke="${color||"var(--accent)"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${lastX-1.5}" cy="${lastY.toFixed(1)}" r="2.6" fill="${color||"var(--accent)"}"/></svg>`;
  }
};
function emptyChart(h, msg){
  return `<div style="height:${h}px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-3);font-size:13px">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="opacity:.35">
      <path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 4-6"/></svg>${esc(msg)}</div>`;
}

/* ------------------------- 4. 统计计算 ------------------------- */
/* 按项目类型拆分统计 */
function byDiscipline(sessions){
  const out = {};
  DISCIPLINES.forEach(d => { out[d] = []; });
  sessions.forEach(s => {
    const d = disciplineOf(s);
    (out[d] = out[d] || []).push(s);
  });
  return out;
}

/* 搭档维度统计 */
function partnerStats(sessions){
  const map = new Map();
  sessions.filter(s => isMatch(s) && partnerOf(s)).forEach(s => {
    const name = partnerOf(s);
    if(!map.has(name)) map.set(name, { name, matches: 0, w: 0, l: 0, d: 0, last: null, disc: {} });
    const o = map.get(name);
    const p = parseScore(s.score);
    o.matches++;
    if(p.result === "win") o.w++;
    else if(p.result === "loss") o.l++;
    else if(p.result === "draw") o.d++;
    if(!o.last || s.date > o.last) o.last = s.date;
    const dk = disciplineOf(s);
    o.disc[dk] = (o.disc[dk] || 0) + 1;
  });
  return Array.from(map.values())
    .map(o => Object.assign(o, { winRate: o.matches ? o.w / o.matches * 100 : 0 }))
    .sort((a, b) => b.matches - a.matches || a.name.localeCompare(b.name, "zh"));
}

/* 花名册合并：把「只有档案、还没打过」的人补进统计列表。
   统计函数只认比赛记录，而档案是可以手动建立的 —— 两者必须合并，
   否则刚「添加搭档 / 添加对手」的人因为 0 场而不出现在任何名单里，看起来就像没保存成功。
   排序与统计口径保持一致：场次多的在前，0 场的排最后；筛选器（我占优 / 我落后）
   天然会把 0 场的滤掉，因为它们胜负都是 0。
   keyOf  让「组合」列表也能复用（组合以 key 为标识，没有 name 字段）
   namesOf 列出该项实际包含的人名。对手「按组合」视图靠它避免重复：
     老张已经出现在「老陈 + 老张」这个组合里，就不该再以单人身份被补一行。 */
function withRoster(stats, rivals, relation, blank, keyOf, namesOf){
  const k  = keyOf   || (x => x.name);
  const nm = namesOf || (x => [x.name]);
  const list = stats.slice();
  const seen = new Set();
  list.forEach(x => { seen.add(k(x)); nm(x).forEach(n => seen.add(n)); });
  (rivals || []).forEach(r => {
    if(!r || !r.name || seen.has(r.name)) return;
    if(r.relation !== relation && r.relation !== "both") return;
    seen.add(r.name);
    list.push(Object.assign(
      { name: r.name, matches: 0, w: 0, l: 0, d: 0, last: null, winRate: 0 },
      typeof blank === "function" ? blank(r.name) : blank
    ));
  });
  return list.sort((a, b) =>
    b.matches - a.matches || String(k(a)).localeCompare(String(k(b)), "zh"));
}

/* 写入一份球友档案。关键约束：**同名只允许一条**。
   全站都用 rivals.find(x => x.name === ...) 取档案，一旦出现两条同名记录，
   第二条就永远显示不出来、也永远改不到 —— 表现为"加了人却像没加上"。
   于是新增时若撞名就合并（把另一个身份补上，关系升级为 both），而不是再 push 一条。
   opts.edit        编辑模式：改的就是这条
   opts.colorTouched / avTouched  用户这次是否主动改过颜色 / 头像。
     合并时只有动过才覆盖 —— 否则新增弹窗里的默认色会把人家已设好的冲掉。 */
function upsertRival(rivals, obj, opt){
  const o = opt || {};
  const dup = rivals.find(x => x.name === obj.name && x !== o.edit);
  if(o.edit){
    if(dup) return { ok:false, mode:"dup" };   /* 改名撞上别人：拒绝，让用户换个名字 */
    Object.assign(o.edit, obj);
    return { ok:true, mode:"update", rec:o.edit };
  }
  if(dup){
    if(obj.level) dup.level = obj.level;
    if(obj.note)  dup.note  = obj.note;
    if(o.colorTouched) dup.color = obj.color;
    if(o.avTouched)    dup.avatar = obj.avatar;
    /* 本来是对手、这次要加成搭档 → both；已经是 both 的不降级 */
    if(dup.relation !== obj.relation && dup.relation !== "both") dup.relation = "both";
    return { ok:true, mode:"merge", rec:dup };
  }
  rivals.push(obj);
  return { ok:true, mode:"add", rec:obj };
}

/* 对手组合维度统计：以「组合名」为键，便于统计"老张+阿强"这类固定组合 */
function opponentComboStats(sessions){
  const map = new Map();
  sessions.filter(isMatch).forEach(s => {
    const arr = opponentsOf(s);
    if(!arr.length) return;
    const key = arr.slice().sort().join(" + ");
    if(!map.has(key)) map.set(key, { key, names: arr, matches: 0, w: 0, l: 0, d: 0, last: null, disc: {} });
    const o = map.get(key);
    const p = parseScore(s.score);
    o.matches++;
    if(p.result === "win") o.w++;
    else if(p.result === "loss") o.l++;
    else if(p.result === "draw") o.d++;
    if(!o.last || s.date > o.last) o.last = s.date;
    const dk = disciplineOf(s);
    o.disc[dk] = (o.disc[dk] || 0) + 1;
  });
  return Array.from(map.values())
    .map(o => Object.assign(o, { winRate: o.matches ? o.w / o.matches * 100 : 0 }))
    .sort((a, b) => b.matches - a.matches || a.key.localeCompare(b.key, "zh"));
}

/* 个人（单个对手）维度统计：组合拆开，每个人各计一次 */
function opponentPersonStats(sessions){
  const map = new Map();
  sessions.filter(isMatch).forEach(s => {
    const p = parseScore(s.score);
    opponentsOf(s).forEach(name => {
      if(!map.has(name)) map.set(name, { name, matches: 0, w: 0, l: 0, d: 0, last: null });
      const o = map.get(name);
      o.matches++;
      if(p.result === "win") o.w++;
      else if(p.result === "loss") o.l++;
      else if(p.result === "draw") o.d++;
      if(!o.last || s.date > o.last) o.last = s.date;
    });
  });
  return Array.from(map.values())
    .map(o => Object.assign(o, { winRate: o.matches ? o.w / o.matches * 100 : 0 }))
    .sort((a, b) => b.matches - a.matches || a.name.localeCompare(b.name, "zh"));
}

function computeStats(sessions){
  const matches = sessions.filter(isMatch);
  /* 胜率分母只算"已录入比分"的场次；标记为比赛但未录比分的场次单独计数 */
  const scored = matches.filter(m => parseScore(m.score).sets.length);
  let wins = 0, losses = 0, draws = 0, setsW = 0, setsL = 0, ptsW = 0, ptsL = 0;
  matches.forEach(m => {
    const p = parseScore(m.score);
    if(p.result === "win") wins++; else if(p.result === "loss") losses++; else if(p.result === "draw") draws++;
    setsW += p.winSets; setsL += p.loseSets;
    p.sets.forEach(st => { ptsW += st.a; ptsL += st.b; });
  });
  const totalMin = sum(sessions.map(s => +s.duration || 0));
  return {
    total: sessions.length,
    matches: matches.length,
    pending: matches.length - scored.length,
    training: sessions.length - matches.length,
    wins, losses, draws,
    winRate: scored.length ? wins / scored.length * 100 : 0,
    setsW, setsL,
    setsRate: (setsW + setsL) ? setsW / (setsW + setsL) * 100 : 0,
    ptsW, ptsL,
    ptsRate: (ptsW + ptsL) ? ptsW / (ptsW + ptsL) * 100 : 0,
    totalMin, totalHours: totalMin / 60
  };
}
/* 按周聚合 */
function weeklyBuckets(sessions, count){
  const weeks = [];
  const now = new Date(); now.setHours(0,0,0,0);
  const dow = (now.getDay() + 6) % 7; // 周一为 0
  const thisMon = new Date(now); thisMon.setDate(now.getDate() - dow);
  for(let i=count-1;i>=0;i--){
    const start = new Date(thisMon); start.setDate(thisMon.getDate() - i*7);
    const end = new Date(start); end.setDate(start.getDate() + 6);
    weeks.push({ start, end, label: `${start.getMonth()+1}/${start.getDate()}`, sessions: [] });
  }
  sessions.forEach(s => {
    const d = parseDate(s.date); d.setHours(0,0,0,0);
    for(const w of weeks){ if(d >= w.start && d <= w.end){ w.sessions.push(s); break; } }
  });
  return weeks;
}
/* 技术当前得分 & 历史（统一自评口径：只采信自评记录） */
function skillCurrent(techId){
  const all = state.skills.filter(s => s.techId === techId).sort((a, b) => a.date < b.date ? -1 : 1);
  if(!all.length) return null;
  const mine = all.filter(isSelfRec);
  const legacy = !mine.length;   /* 仅有历史外部评价时回退展示，并标记来源 */
  const hist = legacy ? all : mine;
  const byDate = {};
  hist.forEach(h => { byDate[h.date] = byDate[h.date] || []; byDate[h.date].push(h); });
  const dates = Object.keys(byDate).sort();
  const lastDate = dates[dates.length - 1];
  const cur = byDate[lastDate];
  const score = avg(cur.map(i => +i.score || 0));
  const prev = dates.length > 1 ? avg(byDate[dates[dates.length - 2]].map(i => +i.score || 0)) : null;
  return {
    score, date: lastDate, prev, legacy,
    times: dates.length,
    records: cur.length,
    note: (cur.find(i => i.comment) || {}).comment || "",
    fromObs: cur.some(i => Array.isArray(i.answers) && i.answers.some(v => v != null && v !== "")),
    history: dates.map(dt => ({ date: dt, score: avg(byDate[dt].map(i => +i.score || 0)) }))
  };
}
function skillSeries(techIds){
  const src = state.skills.filter(isSelfRec);
  const dates = Array.from(new Set(src.map(s => s.date))).sort();
  return {
    dates,
    series: techIds.map(t => ({
      id: t,
      values: dates.map(dt => {
        const items = src.filter(s => s.techId === t && s.date === dt);
        return items.length ? avg(items.map(i => +i.score || 0)) : null;
      })
    }))
  };
}

/* ------------------------- 4b. 短板诊断 ------------------------- */

/* daysAgo 复用 §2 的既有实现（第 1566 行），不重复造 */

/* ---------- 短板诊断 ---------- */
/* 每条规则是一个纯函数：吃预计算好的 ctx，吐一个「建议数组」或空数组。
   加规则 = 往数组里加一项，渲染代码完全不用动。 */
const DIAG_RULES = [
  { id:"weak", run(c){
      return c.scored.filter(x => x.cur < 5).map(x => ({
        techId:x.id, name:x.name, kind:"补短板", weight:(10 - x.cur) * 3,
        why:`只有 ${num1(x.cur)} 分，按锚点还处在「做不稳定」的档位`,
        fix:DRILLS[x.id]
      }));
  }},
  { id:"below", run(c){
      if(c.scored.length < 6) return [];
      return c.scored.filter(x => x.cur >= 5 && x.cur < c.avgAll - 1.2).map(x => ({
        techId:x.id, name:x.name, kind:"拉齐水位", weight:(c.avgAll - x.cur) * 2.4,
        why:`${num1(x.cur)} 分，比你自己 ${num1(c.avgAll)} 分的平均水位低了 ${num1(c.avgAll - x.cur)} 分`,
        fix:DRILLS[x.id]
      }));
  }},
  { id:"stall", run(c){
      return c.items.filter(x => x.cur != null && x.prev != null && x.times >= 3
        && Math.abs(x.cur - x.prev) < 0.3 && x.cur < 8).map(x => ({
        techId:x.id, name:x.name, kind:"换练法", weight:4.2,
        why:`连续两次都停在 ${num1(x.cur)} 分（上次 ${num1(x.prev)}），说明现在的练法推不动它`,
        fix:DRILLS[x.id]
      }));
  }},
  { id:"stale", run(c){
      if(c.daysSince == null || c.daysSince < 45) return [];
      return [{ techId:null, name:"全部专项", kind:"该复评了", weight:3.6,
        why:`距上次自评已经 ${c.daysSince} 天，分数可能已经不准了`,
        fix:"做一次完整的专项自评，重新校准 18 项的分数" }];
  }}
];

/* 正向项单独一组，避免诊断卡变成一屏坏消息。 */
const DIAG_GOOD = [
  { id:"up", run(c){
      return c.items.filter(x => x.cur != null && x.prev != null && x.cur - x.prev >= 0.8).map(x => ({
        techId:x.id, name:x.name, kind:"涨得最快", weight:x.cur - x.prev,
        why:`从 ${num1(x.prev)} 涨到 ${num1(x.cur)}，一口气涨了 ${num1(x.cur - x.prev)} 分`,
        fix:DRILLS[x.id]
      }));
  }},
  { id:"peak", run(c){
      return c.items.filter(x => x.cur != null && x.cur >= 8.5).map(x => ({
        techId:x.id, name:x.name, kind:"可以当武器", weight:x.cur - 8,
        why:`${num1(x.cur)} 分，是你目前最稳的能力`,
        fix:"比赛里主动制造机会把它用出来，让它从「稳」变成「得分手段」"
      }));
  }}
];

function diagCtx(){
  const items = TECH_ITEMS.map(t => {
    const c = skillCurrent(t.id);
    const ok = !!(c && !c.legacy);
    return { id:t.id, name:t.name, cat:t.cat,
             cur: ok ? c.score : null, prev: ok ? c.prev : null,
             times: ok ? c.times : 0, date: ok ? c.date : null };
  });
  const scored = items.filter(x => x.cur != null);
  const dates = selfDates();
  const lastDate = dates.length ? dates[dates.length - 1] : null;
  return {
    items, scored,
    avgAll: scored.length ? avg(scored.map(x => x.cur)) : 0,
    lastDate, daysSince: lastDate ? daysAgo(lastDate) : null   /* 无自评时必须是 null，否则 NaN 会漏过守卫 */
  };
}
/* 同一专项可能同时命中多条规则，只保留权重最高的那条 */
function diagDedupe(list){
  const seen = new Set();
  return list.filter(x => {
    const k = x.techId || x.kind;
    if(seen.has(k)) return false;
    seen.add(k); return true;
  });
}
function diagnose(){
  const ctx = diagCtx();
  const sort = (a, b) => b.weight - a.weight;
  return {
    ctx,
    todo: diagDedupe([].concat(...DIAG_RULES.map(r => r.run(ctx) || [])).sort(sort)).slice(0, 3),
    good: diagDedupe([].concat(...DIAG_GOOD.map(r => r.run(ctx) || [])).sort(sort)).slice(0, 2)
  };
}

/* ------------------------- 5. 导航定义 ------------------------- */
/* short：移动端底部 Tab 的短标签（必须 2 字且全局唯一，避免「训练比赛 / 训练日记」都截成「训练」）。

/* 是否应关闭动效（尊重系统设置） */
function prefersReduced(){
  try{
    return !!(window && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }catch(e){ return false; }
}
/* 安全地写自定义属性（兼容无 style.setProperty 的极简 DOM 桩） */
function setCssVar(el, k, v){
  try{
    if(el && el.style && typeof el.style.setProperty === "function") el.style.setProperty(k, v);
  }catch(e){}
}

/* ---------- 形状工具 ---------- */
/* 四角星（用于"闪耀"与胜利眼） */
const starPath = (cx, cy, r) => {
  const i = r * 0.34;
  return `M${cx} ${cy-r}Q${cx+i} ${cy-i} ${cx+r} ${cy}Q${cx+i} ${cy+i} ${cx} ${cy+r}`
       + `Q${cx-i} ${cy+i} ${cx-r} ${cy}Q${cx-i} ${cy-i} ${cx} ${cy-r}Z`;
};
const sparkle = (cx, cy, r, color) =>
  `<path d="${starPath(cx, cy, r)}" fill="${color || "var(--sun)"}"/>`;

/* ---------- 羽毛球本体：小羽 / 场景涂鸦 / App 图标共用这一份几何 ----------
   局部坐标：原点 = 软木托上沿中心，羽裙向上为负 y。
   刻意只写「一份可参数化的球」而不是「每个尺寸各画一份」：
   换色 / 加粗 / 去掉网格线都是参数，因为角色和图标必须是同一只球，
   否则改一次角色就得同步三处，早晚分家。

   像不像羽毛球，只由三个特征决定，三个都保留：
     1. 顶边 7 段半圆 —— 天然形成波浪羽尖（远看就认出来了）
     2. 扇形的羽轴分线 + 两道横线 —— 羽毛裙的网格肌理
     3. 束口色带 + 半球软木托 —— 把「裙」和「托」分成上下两段 */
function shuttleBody(c){
  const w = c.w || 3.2, ink = c.ink;
  const ln  = `stroke="${ink}" stroke-width="${w}" stroke-linejoin="round"`;
  const lnT = sw => `fill="none" stroke="${ink}" stroke-width="${sw}" stroke-linecap="round" opacity=".13"`;
  /* 比例是"像不像"的关键：顶边 70 宽 → 收口 40 宽（锥度 1.75），托 40×46。
     托再大就变成"灯罩扣球"，收口再宽就变成"方"。 */
  return `<path d="M-20 0a20 23 0 0 0 40 0z" fill="${c.cork}" ${ln}/>`
    + `<path d="M-35 -84a5 5 0 0 1 10 0a5 5 0 0 1 10 0a5 5 0 0 1 10 0a5 5 0 0 1 10 0a5 5 0 0 1 10 0a5 5 0 0 1 10 0a5 5 0 0 1 10 0C33 -60 29 -34 20 -10L-20 -10C-29 -34 -33 -60 -35 -84Z" fill="${c.feather}" ${ln}/>`
    + `<path d="M-35 -84a5 5 0 0 1 10 0a5 5 0 0 1 10 0L-16 -10L-20 -10C-29 -34 -33 -60 -35 -84Z" fill="${c.f1}" ${ln}/>`
    + `<path d="M35 -84a5 5 0 0 0-10 0a5 5 0 0 0-10 0L16 -10L20 -10C29 -34 33 -60 35 -84Z" fill="${c.f2}" ${ln}/>`
    + (c.grid === false ? "" : `<path d="M-29 -36Q0 -33 29 -36M-32 -62Q0 -59 32 -62" ${lnT(1.8)}/>`)
    + [-25,-15,-5,5,15,25].map(x => `<path d="M0 -14L${x} -84" ${lnT(1.8)}/>`).join("")
    + `<rect x="-21" y="-10" width="42" height="10" rx="5" fill="${c.band}" ${ln}/>`;
}

/* 场景涂鸦里的小羽毛球：同一份几何缩下去，位置语义仍是「软木托上沿中心」 */
function miniShuttle(cx, cy, s, c1, c2){
  const g = { ink:"var(--ink)", feather:"#FFF8F2", f1:c1 || "var(--accent-2)", f2:c2 || "var(--accent)",
              band:"var(--sun)", cork:"#FFE0C4", w:9 };
  return `<g transform="translate(${cx},${cy}) scale(${((s || 1) * 0.34).toFixed(3)})">${shuttleBody(g)}</g>`;
}

/* ---------- App 图标：同一只球，摆在品牌橙色块上 ----------
   和 favicon / 桌面图标 / 启动画面共用这一个函数，
   所以「改角色」时图标会自动跟着改，不存在两套球分家的问题。
   图标没有主题变量可用（SVG 被当图片加载时读不到页面 CSS），因此这里全部写死。 */
const ICON_ART = { ink:"#2C2740", feather:"#FFF8F2", f1:"#FFF8F2", f2:"#FFF8F2",
                   band:"#FFC93C", cork:"#FFE0C4", w:5, grid:false };
function appIconSVG(px, o){
  o = o || {};
  const k  = px * (o.maskable ? 0.58 : 0.86) / 115;   // 115 ≈ 本体包围盒高度
  const ty = px / 2 + 33 * k;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${px} ${px}" width="${px}" height="${px}">`
    + (o.maskable ? `<rect width="${px}" height="${px}" fill="#FF7A45"/>`
                  : `<rect width="${px}" height="${px}" rx="${Math.round(px * 0.22)}" fill="#FF7A45"/>`)
    + `<g transform="translate(${(px / 2).toFixed(2)},${ty.toFixed(2)}) scale(${k.toFixed(4)})">`
    + shuttleBody(ICON_ART) + `</g></svg>`;
}
