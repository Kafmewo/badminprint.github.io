/* 搭档详情：配合时间线 + 战术笔记 */
function partnerDetail(name){
  const r = state.rivals.find(x => x.name === name) || { name, color: hashColor(name), level:"", note:"" };
  const ms = state.sessions.filter(s => isMatch(s) && partnerOf(s) === name).sort((a, b) => a.date < b.date ? -1 : 1);
  const st = computeStats(ms);
  /* 统一自评后不再产生外部评价，这里只回放历史遗留记录 */
  const feedbacks = legacySkills().filter(s => s.by === name);
  const events = ms.map(m => {
    const p = parseScore(m.score);
    return {
      date: m.date, kind: "match", title: `${disciplineOf(m)} vs ${opponentsOf(m).join(" + ") || "—"}`,
      result: p.result, sub: `${scoreText(m.score)}`, body: m.note, place: m.place
    };
  }).concat(feedbacks.map(f => ({
    date: f.date, kind: "feedback", title: `${(TECH_MAP[f.techId] || {}).name || ""} ${f.score} 分`,
    body: f.comment, sub: ""
  }))).sort((a, b) => a.date < b.date ? 1 : -1);

  modal({
    title: `${name} · 搭档档案`,
    wide: true, readonly: true,
    body: `
      ${personHeadHTML(name, r, "搭档")}
      <div class="grid g4" style="margin-bottom:16px">
        <div><div class="stat-label">配合场次</div><div class="stat-value" style="font-size:22px">${st.matches}<small>场</small></div></div>
        <div><div class="stat-label">胜 / 负</div><div class="stat-value" style="font-size:22px">
          <span style="color:var(--win)">${st.wins}</span> <span style="color:var(--text-3);font-size:15px">:</span>
          <span style="color:var(--loss)">${st.losses}</span></div></div>
        <div><div class="stat-label">配合胜率</div><div class="stat-value" style="font-size:22px;color:${st.winRate >= 50 ? "var(--win)" : "var(--loss)"}">${num1(st.winRate)}<small>%</small></div></div>
        <div><div class="stat-label">总时长</div><div class="stat-value" style="font-size:22px">${num1(st.totalHours)}<small>h</small></div></div>
      </div>

      ${ms.length >= 2 ? `<div style="margin-bottom:18px">
        <div class="stat-label" style="margin-bottom:8px">配合胜率变化（滚动）</div>
        <div id="partnerTrend"></div></div>` : ""}

      <div class="stat-label" style="margin-bottom:10px">配合时间线</div>
      ${events.length ? `<div class="timeline">${events.map(e => `
        <div class="tl-item">
          <div class="tl-dot ${e.kind === "match" ? (e.result || "") : "goal"}"></div>
          <div class="tl-head">
            <span class="tl-title">${esc(e.title)}</span>
            ${e.result && e.kind === "match"
              ? `<span class="tag tag-sm ${RESULT_CLASS[e.result]}">${RESULT_LABEL[e.result]}</span>`
              : `<span class="tag tag-accent tag-sm">外部评价（历史）</span>`}
            <span class="tl-date">${fmtDate(e.date)}</span>
          </div>
          ${e.sub ? `<div class="tl-body num" style="font-size:12.5px">${esc(e.sub)}</div>` : ""}
          ${e.body ? `<div class="tl-body">${esc(e.body)}</div>` : ""}
          ${e.place ? `<div class="hintline">${esc(e.place)}</div>` : ""}
        </div>`).join("")}</div>` : `<div>${emptyState("pair","暂无配合记录")}</div>`}
    `,
    okText: "编辑资料",
    onSave(){ rivalModal(r, "partner"); return true; }
  });

  if(ms.length >= 2){
    const labs = [], vals = [];
    const W = Math.min(3, ms.length);
    ms.forEach((m, idx) => {
      if(idx < W - 1) return;
      const win = ms.slice(idx - W + 1, idx + 1).filter(x => parseScore(x.score).result === "win").length;
      labs.push(fmtShort(m.date));
      vals.push(win / W * 100);
    });
    chart.line($("#partnerTrend"), {
      labels: labs, yMin: 0, yMax: 100, yFmt: v => num1(v), height: 150, legend: false,
      series: [{ name: "滚动胜率(%)", data: vals, color: "var(--accent-2)" }]
    });
  }
}

/* ============ 页面：对手 ============ */
function renderRivals(root){
  ensureRivalAll();
  const all = state.sessions;
  /* 与搭档页同一口径：名单要包含档案里手动添加、还没交手过的人。
     「按组合」视图也补进去 —— 一个新档案就是一个"还没交手过的单人组合"，
     它恰好走单人渲染分支（names.length === 1），所以不必另写一套行模板。 */
  const combos = withRoster(opponentComboStats(all), state.rivals, "opponent",
    n => ({ key:n, names:[n], disc:{} }), x => x.key, x => x.names || []);
  const persons = withRoster(opponentPersonStats(all), state.rivals, "opponent", {});
  /* 统计卡只认真正交过手的：把没打过的算进"对手人数 / 组合数"会虚高 */
  const playedPersons = persons.filter(p => p.matches > 0);
  const playedCombos = combos.filter(c => c.matches > 0);
  const hardest = playedPersons.filter(p => p.matches >= 2).sort((a, b) => a.winRate - b.winRate)[0];

  root.innerHTML = `
    <div class="grid g4" style="margin-bottom:14px">
      <div class="stat"><div class="stat-label">对手人数</div>
        <div class="stat-value">${playedPersons.length}<small>人</small></div>
        <div class="stat-foot">${playedCombos.length} 种对阵组合 · 已建档 ${persons.length} 人</div></div>
      <div class="stat"><div class="stat-label">交手场次</div>
        <div class="stat-value">${sum(combos.map(c => c.matches))}<small>场</small></div>
        <div class="stat-foot">含全部比赛记录</div></div>
      <div class="stat"><div class="stat-label">总胜率</div>
        <div class="stat-value">${num1(computeStats(all).winRate)}<small>%</small></div>
        <div class="stat-foot">${computeStats(all).wins} 胜 ${computeStats(all).losses} 负</div></div>
      <div class="stat"><div class="stat-label">最难缠</div>
        <div class="stat-value" style="font-size:21px;letter-spacing:0">${hardest ? esc(hardest.name) : "—"}</div>
        <div class="stat-foot">交手 ≥2 场胜率最低</div></div>
    </div>

    <div class="row" style="margin-bottom:14px;justify-content:space-between;gap:9px">
      <div class="seg" id="rvView">
        <button data-vv="combo" class="on">按组合</button>
        <button data-vv="person">按个人</button>
      </div>
      <div class="seg" id="rivalSeg">
        <button data-rv="all" class="on">全部</button>
        <button data-rv="lead">我占优</button>
        <button data-rv="behind">我落后</button>
      </div>
    </div>
    <div id="rivalList" style="display:grid;gap:11px"></div>
  `;

  let viewMode = "combo", filt = "all";

  const draw = () => {
    let list = viewMode === "combo" ? combos.slice() : persons.slice();
    if(filt === "lead") list = list.filter(r => r.w > r.l);
    if(filt === "behind") list = list.filter(r => r.w < r.l);
    const el = $("#rivalList");
    if(!list.length){
      el.innerHTML = `<div class="card">${emptyState("versus","没有符合条件的对手")}</div>`;
      return;
    }
    el.innerHTML = list.map(r => {
      const isCombo = viewMode === "combo";
      const nm = isCombo ? r.key : r.name;
      const meta = isCombo && r.names.length > 1
        ? `<span class="tag tag-neutral tag-sm">组合 ${r.names.length} 人</span>`
        : "";
      const discTxt = Object.entries(r.disc || {}).map(([k, v]) => `${k} ${v}`).join(" · ");
      const rec = state.rivals.find(x => x.name === nm) || {};
      /* 单人行的颜色优先取档案里存的值 —— 头像的底色与球衣都跟着它，
         若这里退回 hashColor，用户在「编辑档案」里选的颜色就到不了这一页，
         而且会和详情弹窗抬头显示成两个颜色 */
      const color = isCombo && r.names.length > 1 ? "var(--accent-2)" : (rec.color || hashColor(nm));
      /* 组合（≥2 人）不是"某个人"，保持人数色块，顺便和单人行的插画区分开 */
      const av = isCombo && r.names.length > 1
        ? `<div class="avatar avatar-txt" style="background:${color}">${r.names.length}</div>`
        : avatarHTML(nm, color, rec.avatar);
      /* 0 场 = 档案刚建好、还没交过手：不画进度条，胜率显示「—」，
         免得"0.0%"看起来像一场没赢而不是一场没打 */
      const has = r.matches > 0;
      const sub = has
        ? `${r.matches} 场 · 最近 ${fmtDate(r.last)}${discTxt ? " · " + discTxt : ""}`
        : "还没有交手记录，记录比赛时填上 TA 就会自动统计";
      return `<div class="rival" data-key="${esc(nm)}" data-kind="${viewMode}">
        ${av}
        <div style="min-width:0;flex:1">
          <div class="rival-name">${esc(nm)} ${meta}${has ? "" : ` <span class="tag tag-neutral tag-sm">还没交手</span>`}</div>
          <div class="rival-sub">${sub}</div>
          ${has ? `<div class="bar ${r.w >= r.l ? "win" : "loss"}" style="margin-top:8px;max-width:230px"><i style="width:${r.winRate}%"></i></div>` : ""}
        </div>
        <div class="rival-stats">
          <div><b style="color:var(--win)">${r.w}</b><span>胜</span></div>
          <div><b style="color:var(--loss)">${r.l}</b><span>负</span></div>
          <div><b style="color:${has ? "var(--text)" : "var(--text-3)"}">${has ? num1(r.winRate) + "%" : "—"}</b><span>胜率</span></div>
        </div>
      </div>`;
    }).join("");

    $$("[data-key]", el).forEach(c => c.onclick = () => {
      if(c.dataset.kind === "combo") comboDetail(combos.filter(x => x.key === c.dataset.key)[0]);
      else personDetail(persons.filter(x => x.name === c.dataset.key)[0]);
    });
  };

  $$("#rvView button").forEach(b => b.onclick = () => {
    $$("#rvView button").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); viewMode = b.dataset.vv; draw();
  });
  $$("#rivalSeg button").forEach(b => b.onclick = () => {
    $$("#rivalSeg button").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); filt = b.dataset.rv; draw();
  });
  draw();
}

/* 组合详情 */
function comboDetail(c){
  if(!c) return;
  const ms = state.sessions.filter(s => isMatch(s) && opponentsOf(s).slice().sort().join(" + ") === c.key)
    .sort((a, b) => a.date < b.date ? -1 : 1);
  modal({
    title: `${c.key} · 对阵记录`,
    wide: true, readonly: true,
    body: `
      <div class="grid g4" style="margin-bottom:16px">
        <div><div class="stat-label">交手</div><div class="stat-value" style="font-size:22px">${c.matches}<small>场</small></div></div>
        <div><div class="stat-label">胜 / 负</div><div class="stat-value" style="font-size:22px">
          <span style="color:var(--win)">${c.w}</span><span style="color:var(--text-3);font-size:15px">:</span><span style="color:var(--loss)">${c.l}</span></div></div>
        <div><div class="stat-label">胜率</div><div class="stat-value" style="font-size:22px;color:${c.winRate >= 50 ? "var(--win)" : "var(--loss)"}">${num1(c.winRate)}<small>%</small></div></div>
        <div><div class="stat-label">项目</div><div class="stat-value" style="font-size:17px;letter-spacing:0">${Object.keys(c.disc).join("/")}</div></div>
      </div>
      ${ms.length >= 2 ? `<div id="comboTrend" style="margin-bottom:18px"></div>` : ""}
      <div class="stat-label" style="margin-bottom:10px">交手记录</div>
      ${ms.length ? "" : `<div class="hintline" style="margin-bottom:10px">还没有和这个组合交过手。在比赛记录里把他们填进对手，这里就会自动出现时间线。</div>`}
      <div class="timeline">${ms.slice().reverse().map(m => {
        const p = parseScore(m.score);
        return `<div class="tl-item">
          <div class="tl-dot ${p.result || ""}"></div>
          <div class="tl-head">
            <span class="tl-title">${esc(disciplineOf(m))}${partnerOf(m) ? `（搭档 ${esc(partnerOf(m))}）` : ""}</span>
            <span class="tag tag-sm ${RESULT_CLASS[p.result]}">${RESULT_LABEL[p.result]}</span>
            <span class="tl-date">${fmtDate(m.date)}</span>
          </div>
          <div class="tl-body num" style="font-size:12.5px">${p.sets.map(x => `${x.a}-${x.b}`).join(" ")}</div>
          ${m.note ? `<div class="tl-body">${esc(m.note)}</div>` : ""}
          ${m.place ? `<div class="hintline">${esc(m.place)}</div>` : ""}
        </div>`;
      }).join("")}</div>
    `
  });
  if(ms.length >= 2){
    const labs = [], vals = [];
    ms.forEach(m => { const p = parseScore(m.score); labs.push(fmtShort(m.date)); vals.push(p.winSets / p.sets.length * 100); });
    chart.line($("#comboTrend"), { labels: labs, yMin: 0, yMax: 100, yFmt: v => num1(v), height: 150, legend: false,
      series: [{ name: "局胜率(%)", data: vals, color: "var(--win)" }] });
  }
}

/* 个人详情（含与谁搭档时对他的战绩） */
function personDetail(p){
  if(!p) return;
  const ms = state.sessions.filter(s => isMatch(s) && opponentsOf(s).indexOf(p.name) >= 0)
    .sort((a, b) => a.date < b.date ? -1 : 1);
  // 按搭档拆分战绩
  const byPartner = new Map();
  ms.forEach(m => {
    const key = partnerOf(m) || "（未记录搭档）";
    if(!byPartner.has(key)) byPartner.set(key, { name: key, n: 0, w: 0, l: 0 });
    const o = byPartner.get(key);
    const r = parseScore(m.score).result;
    o.n++; if(r === "win") o.w++; else if(r === "loss") o.l++;
  });
  const partnerRows = Array.from(byPartner.values()).sort((a, b) => b.n - a.n);
  const r0 = state.rivals.find(x => x.name === p.name) || {};

  modal({
    title: `${p.name} · 交手记录`,
    wide: true, readonly: true,
    body: `
      ${personHeadHTML(p.name, r0, "对手")}
      <div class="grid g4" style="margin-bottom:16px">
        <div><div class="stat-label">交手</div><div class="stat-value" style="font-size:22px">${p.matches}<small>场</small></div></div>
        <div><div class="stat-label">胜 / 负</div><div class="stat-value" style="font-size:22px">
          <span style="color:var(--win)">${p.w}</span><span style="color:var(--text-3);font-size:15px">:</span><span style="color:var(--loss)">${p.l}</span></div></div>
        <div><div class="stat-label">胜率</div><div class="stat-value" style="font-size:22px;color:${p.winRate >= 50 ? "var(--win)" : "var(--loss)"}">${num1(p.winRate)}<small>%</small></div></div>
        <div><div class="stat-label">最近交手</div><div class="stat-value" style="font-size:15px;letter-spacing:0">${fmtDate(p.last)}</div></div>
      </div>
      ${partnerRows.length > 1 ? `<div style="margin-bottom:16px">
        <div class="stat-label" style="margin-bottom:8px">与不同搭档对他时的战绩</div>
        <div class="table-wrap"><table style="min-width:auto">
          <thead><tr><th>搭档</th><th class="t-right">场次</th><th class="t-right">胜</th><th class="t-right">负</th><th class="t-right">胜率</th></tr></thead>
          <tbody>${partnerRows.map(r => `<tr>
            <td>${esc(r.name)}</td><td class="t-right num">${r.n}</td>
            <td class="t-right num" style="color:var(--win)">${r.w}</td>
            <td class="t-right num" style="color:var(--loss)">${r.l}</td>
            <td class="t-right num"><b>${num1(r.n ? r.w / r.n * 100 : 0)}%</b></td>
          </tr>`).join("")}</tbody></table></div></div>` : ""}
      <div class="stat-label" style="margin-bottom:10px">交手记录</div>
      ${ms.length ? "" : `<div class="hintline" style="margin-bottom:10px">还没有和 TA 交过手。在比赛记录里把 TA 填进对手，这里就会自动出现时间线。</div>`}
      <div class="timeline">${ms.slice().reverse().map(m => {
        const ps = parseScore(m.score);
        return `<div class="tl-item">
          <div class="tl-dot ${ps.result || ""}"></div>
          <div class="tl-head">
            <span class="tl-title">${esc(disciplineOf(m))}${partnerOf(m) ? `（搭档 ${esc(partnerOf(m))}）` : ""}</span>
            <span class="tag tag-sm ${RESULT_CLASS[ps.result]}">${RESULT_LABEL[ps.result]}</span>
            <span class="tl-date">${fmtDate(m.date)}</span>
          </div>
          <div class="tl-body num" style="font-size:12.5px">${ps.sets.map(x => `${x.a}-${x.b}`).join(" ")}</div>
          ${m.note ? `<div class="tl-body">${esc(m.note)}</div>` : ""}
        </div>`;
      }).join("")}</div>
    `
  });
}

/* 档案编辑（对手 / 搭档通用） */
function rivalModal(edit, role){
  const r = edit || { id:"", name:"", level:"", note:"", color: hashColor("新"), relation: role || "opponent" };
  const isPartner = (r.relation === "partner");
  /* 归一化一次，后面所有地方都用它判断"选中哪一格" */
  const curAv = avKey(r.avatar);
  /* 用户有没有主动改过颜色 / 头像。合并同名档案时要靠它区分两件事：
     "这次没动"（保留对方档案里已有的设置）与"主动清空"（就是要改成不设头像）。 */
  let colorTouched = false, avTouched = false;
  const palette = ["#0a6fb5","#12a594","#d9930a","#8b5cf6","#e0453c","#0e9f6e","#c2410c","#be185d"];
  modal({
    title: edit ? "编辑档案" : (isPartner ? "添加搭档" : "添加对手"),
    body: `
      <div class="grid g2">
        <div class="field"><label>姓名 / 昵称 <span class="req">*</span></label>
          <input class="input" id="r_name" value="${esc(r.name)}" placeholder="如：小王"></div>
        <div class="field"><label>水平</label>
          <input class="input" id="r_level" value="${esc(r.level)}" placeholder="如：中级 / 4.0"></div>
      </div>
      <div class="field" style="margin-top:14px"><label>关系</label>
        <select class="select" id="r_relation">
          <option value="opponent" ${r.relation === "opponent" ? "selected" : ""}>对手</option>
          <option value="partner" ${r.relation === "partner" ? "selected" : ""}>搭档</option>
          <option value="both" ${r.relation === "both" ? "selected" : ""}>既是对手也是搭档</option>
        </select></div>
      <div class="field" style="margin-top:14px"><label>特点备注</label>
        <input class="input" id="r_note" value="${esc(r.note)}" placeholder="如：杀球重、前场封网好、平抽挡稳"></div>
      <div class="field" style="margin-top:14px"><label>头像颜色</label>
        <div class="row" id="colorBox">${palette.map(c =>
          `<button type="button" data-color="${c}" style="width:30px;height:30px;border-radius:50%;background:${c};border:3px solid ${r.color === c ? "var(--text)" : "transparent"}"></button>`
        ).join("")}</div></div>
      <div class="field" style="margin-top:14px"><label>头像</label>
        <div class="av-grid" id="avGrid">
          <button type="button" class="av-cell av-auto ${curAv ? "" : "on"}" data-av="" title="不设头像，用姓名首字">
            <span class="av-auto-t">${esc(initials(r.name))}</span></button>
          ${AV_KEYS.map(k => `<button type="button" class="av-cell ${curAv === k ? "on" : ""}" data-av="${k}" title="${AV_MAP[k].n}">
            ${avatarSVG(k, r.color)}</button>`).join("")}
        </div>
        <span class="hintline">选一个形象，颜色跟着上面的「头像颜色」走 —— 同一个人换颜色就是一个新头像</span></div>
    `,
    onMount(bd){
      $$("[data-color]", bd).forEach(b => b.onclick = () => {
        $$("[data-color]", bd).forEach(x => x.style.borderColor = "transparent");
        b.style.borderColor = "var(--text)";
        r.color = b.dataset.color;
        colorTouched = true;
        /* 头像小样跟着换球衣色：改颜色就能立刻看到效果 */
        $$("[data-av]", bd).forEach(cell => {
          const k = avKey(cell.dataset.av);
          if(k) cell.innerHTML = avatarSVG(k, r.color);
        });
      });
      $$("[data-av]", bd).forEach(b => b.onclick = () => {
        $$("[data-av]", bd).forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        r.avatar = b.dataset.av || "";
        avTouched = true;
      });
      /* 「不设头像」那格预览姓名首字，跟着姓名输入实时更新 */
      const nameEl = $("#r_name", bd), autoT = $(".av-auto-t", bd);
      if(nameEl && autoT) nameEl.oninput = () => { autoT.textContent = initials(nameEl.value); };
    },
    onSave(bd){
      const name = $("#r_name", bd).value.trim();
      if(!name){ toast("请填写姓名", "err"); return false; }
      const obj = {
        id: r.id || uid(), name,
        level: $("#r_level", bd).value.trim(),
        note: $("#r_note", bd).value.trim(),
        color: r.color || hashColor(name),
        avatar: avKey(r.avatar),
        relation: $("#r_relation", bd).value
      };
      /* 重名处理：同名只允许一条档案，撞名就合并（详见 upsertRival） */
      const res = upsertRival(state.rivals, obj, { edit, colorTouched, avTouched });
      if(!res.ok){ toast(`已存在「${name}」的档案，换个名字`, "err"); return false; }
      save();
      toast(res.mode === "update" ? "已更新"
          : res.mode === "merge"  ? `「${name}」已有档案，已合并`
          : "已添加", "ok");
      return true;
    }
  });
}

/* ------------------------- 11. 页面：训练日记 ------------------------- */
const MOODS = ["轻松","不错","充实","一般","吃力","紧张","兴奋","遗憾","低落"];

function noteModal(edit){
  const n = edit || { id:"", date: todayISO(), title:"", mood:"不错", tags:[], body:"" };
  const presets = ["突破","复盘","技术","体能","比赛","心得","瓶颈","教练反馈","计划"];
  modal({
    title: edit ? "编辑日记" : "写训练日记",
    wide: true,
    body:`
      <div class="grid g2">
        <div class="field"><label>日期 <span class="req">*</span></label>
          <input class="input" type="date" id="n_date" value="${esc(n.date)}"></div>
        <div class="field"><label>心情</label>
          <select class="select" id="n_mood">${MOODS.map(m => `<option ${n.mood === m ? "selected" : ""}>${m}</option>`).join("")}</select></div>
      </div>
      <div class="field" style="margin-top:14px"><label>标题 <span class="req">*</span></label>
        <input class="input" id="n_title" placeholder="如：终于赢下老张！" value="${esc(n.title)}"></div>
      <div class="field" style="margin-top:14px"><label>标签</label>
        <div class="row" style="gap:6px" id="noteTags">${presets.map(t =>
          `<button type="button" class="btn btn-sm ${n.tags.indexOf(t) >= 0 ? "btn-primary" : ""}" data-ntag="${esc(t)}">${esc(t)}</button>`
        ).join("")}</div></div>
      <div class="field" style="margin-top:14px"><label>正文</label>
        <textarea class="textarea" id="n_body" style="min-height:180px" placeholder="今天练了什么？有什么收获、问题或想法？">${esc(n.body)}</textarea></div>
    `,
    onSave(bd){
      const title = $("#n_title", bd).value.trim();
      const body = $("#n_body", bd).value.trim();
      if(!title && !body){ toast("标题和正文不能都为空", "err"); return false; }
      const obj = {
        id: n.id || uid(),
        date: $("#n_date", bd).value || todayISO(),
        title: title || (body.slice(0, 18) + (body.length > 18 ? "…" : "")),
        mood: $("#n_mood", bd).value,
        tags: $$("[data-ntag].btn-primary", bd).map(b => b.dataset.ntag),
        body
      };
      if(edit) Object.assign(edit, obj); else state.notes.unshift(obj);
      save(); toast(edit ? "已更新" : "日记已保存", "ok");
      return true;
    }
  });
}

function renderNotes(root){
  root.innerHTML = `
    <div class="row" style="margin-bottom:14px;justify-content:space-between">
      <div class="row" style="gap:9px;flex:1">
        <input class="input" id="nSearch" placeholder="搜索日记标题或内容…" style="max-width:300px">
        <select class="select" id="nMoodF" style="max-width:150px">
          <option value="">全部心情</option>${MOODS.map(m => `<option>${m}</option>`).join("")}</select>
      </div>
      <button class="btn btn-primary" id="addNote">${icon("plus")}写日记</button>
    </div>
    <div class="masonry" id="noteList"></div>
  `;

  const draw = () => {
    const q = $("#nSearch").value.trim().toLowerCase();
    const mf = $("#nMoodF").value;
    let list = state.notes.slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
    if(mf) list = list.filter(n => n.mood === mf);
    if(q) list = list.filter(n => (n.title + " " + n.body + " " + (n.tags || []).join(" ")).toLowerCase().indexOf(q) >= 0);

    const el = $("#noteList");
    if(!list.length){
      el.innerHTML = `<div class="card" style="column-span:all">${emptyState("notebook", state.notes.length ? "没有符合条件的日记" : "还没有写过日记", "<button class='btn btn-primary btn-sm' data-add>写下第一篇</button>")}</div>`;
      $$("[data-add]", el).forEach(b => b.onclick = () => noteModal());
      return;
    }
    el.innerHTML = list.map(n => {
      const long = n.body.length > 220;
      return `<article class="note">
        <div class="note-head">
          <span class="note-title">${esc(n.title)}</span>
          <span class="note-date" style="margin-left:auto">${fmtDate(n.date)}</span>
        </div>
        <div class="row" style="gap:5px;margin-bottom:9px">
          <span class="tag tag-neutral tag-sm">${esc(n.mood || "")}</span>
          ${(n.tags || []).map(t => `<span class="tag tag-accent tag-sm">${esc(t)}</span>`).join("")}
        </div>
        <div class="note-body">${esc(long ? n.body.slice(0, 220) + "…" : n.body)}</div>

    const rows = state.sessions.slice().sort((a, b) => a.date < b.date ? 1 : -1).map(s => {

    });

          b.forEach(x => { if(x && x.id) map.set(x.id, Object.assign({}, map.get(x.id) || {}, x)); });

    rd.readAsText(f);
    e.target.value = "";
  };

  $("#printBtn").onclick = () => window.print();

  $("#wipeBtn").onclick = () => {
    confirmModal("清空全部数据", "将删除本机保存的所有记录、评分、目标与日记，且无法恢复。确定继续吗？", () => {
      state = JSON.parse(JSON.stringify(DEFAULTS));
      save(); toast("已清空", "ok"); applyTheme(state.settings.theme); go("dashboard"); renderNav();
    }, true);
  };
}

function download(filename, text, mime){
  const blob = new Blob([text], { type: mime || "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ------------------------- 13. 弹窗 / Toast ------------------------- */
function modal(opt){
  const o = opt || {};
  const title = o.title || "";
  const body = o.body || "";
  const onSave = o.onSave;
  const onMount = o.onMount;
  const okText = o.okText || "保存";
  const cancelText = o.cancelText || "取消";
  const readonly = !!o.readonly;
  const wide = !!o.wide;

  const root = $("#modalRoot");
  const mask = document.createElement("div");
  mask.className = "modal-mask";
  const foot = readonly
    ? `<div class="modal-foot"><button class="btn" data-close>关闭</button>${onSave ? `<button class="btn btn-primary" data-ok>${esc(okText)}</button>` : ""}</div>`
    : `<div class="modal-foot"><button class="btn" data-close>${esc(cancelText)}</button><button class="btn btn-primary" data-ok>${esc(okText)}</button></div>`;
  mask.innerHTML = `<div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true">
    <div class="modal-head"><h3>${esc(title)}</h3>
      <button class="btn btn-ghost btn-icon x" data-close aria-label="关闭">${icon("x")}</button></div>
    <div class="modal-body">${body}</div>
    ${foot}
  </div>`;
  root.appendChild(mask);

  const bd = $(".modal-body", mask);
  const close = () => mask.remove();
  if(onMount) onMount(bd);
  $$("[data-close]", mask).forEach(b => b.onclick = close);
  mask.addEventListener("mousedown", e => { if(e.target === mask) close(); });

  const okBtn = $("[data-ok]", mask);
  if(okBtn) okBtn.onclick = () => {
    if(!onSave){ close(); return; }
    const res = onSave(bd);
    if(res !== false){ close(); refresh(); }
  };

  const onEsc = e => {
    if(e.key === "Escape"){ close(); document.removeEventListener("keydown", onEsc); }
  };
  document.addEventListener("keydown", onEsc);

  setTimeout(() => {
    const first = mask.querySelector("input:not([type=range]), select, textarea");
    if(first && !readonly){ try{ first.focus(); }catch(_){} }
  }, 60);
  return mask;
}

function confirmModal(title, text, onYes, danger){
  modal({
    title,
    body: `<p style="margin:0;font-size:14px;line-height:1.75;color:var(--text-2)">${esc(text)}</p>`,
    okText: danger ? "确认删除" : "确认",
    onSave(){ onYes(); return true; }
  });
  if(danger){
    const ok = $("#modalRoot .modal-mask:last-child .modal-foot [data-ok]");
    if(ok){ ok.style.background = "var(--win)"; ok.style.borderColor = "var(--win)"; }
  }
}

  if(p){
    const v = $("#view");

function toast(msg, type, mood){
  const box = $("#toasts");
  if(!box) return;
  const el = document.createElement("div");
  el.className = "toast " + (type || "");
  // 小羽替你把话说出来：成功 → 欢呼，出错 → 皱眉思考，日常 → 微笑
  const m = mood || (type === "ok" ? "win" : type === "err" ? "think" : "happy");
  el.innerHTML = mascot(m, { size:26, anim:"" }) + `<span>${esc(msg)}</span>`;
  box.appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .3s,transform .3s";
    el.style.opacity = "0";
    el.style.transform = "translateY(6px)";
    setTimeout(() => el.remove(), 320);
  }, 2400);
}

/* ------------------------- 15. 全局交互 ------------------------- */

/* ---------- 统计范围下拉 ----------
   档位只在这里定义一份：菜单项、按钮标签、合法值校验全部由它派生，
   免得出现"加了档位但标签忘了改"这种两边对不上的事。 */
const RANGE_OPTS = [
  { v:30,  t:"近 30 天" },
  { v:90,  t:"近 90 天" },
  { v:365, t:"近 1 年"  },
  { v:0,   t:"全部记录" }   // 0 = 不限；inRange() 里是 `if(!days) return true`
];
const TICK_SVG = `<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;

function rangeValid(v){ return RANGE_OPTS.some(o => o.v === +v); }
function rangeText(v){
  const o = RANGE_OPTS.find(x => x.v === +v);
  return o ? o.t : "近 90 天";
}
function rangeMenuOpen(){ const m = $("#rangeMenu"); return !!m && !m.hidden; }

/* 只改标签和选中态，不重建 DOM —— 面板开着时切选项不能重绘，否则会闪一下 */
function syncRangeUI(){
  const lab = $("#rangeLabel");
  if(lab) lab.textContent = rangeText(state.settings.range);
  const m = $("#rangeMenu");
  if(m && !m.hidden){
    $$(".range-opt", m).forEach(el => {
      const on = +el.dataset.range === +state.settings.range;
      el.classList.toggle("on", on);
      el.setAttribute("aria-selected", String(on));
    });
  }
}
function closeRangeMenu(){
  const m = $("#rangeMenu"), b = $("#rangeBtn");
  if(m) m.hidden = true;
  if(b) b.setAttribute("aria-expanded", "false");
}
function openRangeMenu(){
  const m = $("#rangeMenu"), b = $("#rangeBtn");
  if(!m || !b) return;
  m.innerHTML = RANGE_OPTS.map(o => {
    const on = o.v === +state.settings.range;
    return `<button class="range-opt${on ? " on" : ""}" type="button" role="option"`
      + ` aria-selected="${on}" data-range="${o.v}"><span>${o.t}</span>${TICK_SVG}</button>`;
  }).join("");
  $$(".range-opt", m).forEach(el => el.onclick = () => {
    setRange(+el.dataset.range);
    closeRangeMenu();
    b.focus();                       // 焦点还给触发键，键盘用户不会掉进虚空
  });
  m.hidden = false;
  b.setAttribute("aria-expanded", "true");
  const cur = $(".range-opt.on", m);
  if(cur) cur.focus();               // 焦点落在当前项，之后 Tab / Enter 都是原生行为
}
function setRange(v){
  if(!rangeValid(v)) return;
  state.settings.range = +v;
  syncRangeUI();
  save();
  if(currentPage === "dashboard") refresh();
}
function initRangePick(){
  const b = $("#rangeBtn");
  if(!b) return;
  /* 老数据可能压根没存过 range，或存着已下线的档位。统一兜回 90 ——
     否则按钮显示默认文案、数据却按另一个范围算，两边对不上。 */
  if(!state.settings) state.settings = {};
  if(!rangeValid(state.settings.range)) state.settings.range = 90;
  syncRangeUI();
  b.onclick = e => { e.stopPropagation(); rangeMenuOpen() ? closeRangeMenu() : openRangeMenu(); };
  /* 点面板外任意处关掉。用 mousedown 而非 click：click 要等抬起，
     拖选文字后松手也会误判成"点了外面"。 */
  document.addEventListener("mousedown", e => {
    if(rangeMenuOpen() && !e.target.closest("#rangePick")) closeRangeMenu();
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && rangeMenuOpen()){ closeRangeMenu(); b.focus(); }
  });
}

function bindGlobal(){
  document.addEventListener("click", e => {
    const navBtn = e.target.closest("[data-page]");
    if(navBtn){ go(navBtn.dataset.page); return; }
    const moreBtn = e.target.closest("[data-more]");

  document.addEventListener("keydown", e => {
    if(e.target.matches("input,textarea,select")) return;
    if(e.key === "n" && !e.metaKey && !e.ctrlKey){ e.preventDefault(); sessionModal(); }

  root.appendChild(mask);
  const close = () => mask.remove();

  $$("[data-q]", mask).forEach(b => b.onclick = () => {

/* ------------------------- 16. 图标与「安装到桌面」（PWA） -------------------------
   两件事，一套几何：
     · 网页图标（favicon）与侧栏品牌标 —— 都由 shuttleBody 现算，和小羽是同一只球
     · 可安装的 Web 应用 —— manifest + sw.js + icons/ 三个伴随文件

   **只在 http(s) 下启用**：双击 index.html（file://）时这段整体静默跳过，
   所以「单文件、零依赖、双击即用」的性质不变，也不会留下点了没反应的安装入口。
   伴随文件与 index.html 同目录；不托管到服务器时它们完全不被读取，功能一点不少。
   ---------------------------------------------------------------------------- */

/* 网页图标：本地直接算出来塞进 <link rel=icon>，不额外发请求 */
function applyAppIcon(){
  try{
    const href = "data:image/svg+xml," + encodeURIComponent(appIconSVG(64));
    let link = document.querySelector('link[rel="icon"]');
    if(!link){
      link = document.createElement("link");
      link.setAttribute("rel", "icon");
      (document.head || document.documentElement).appendChild(link);
    }
    link.setAttribute("href", href);
  }catch(e){}
}

/* 侧栏品牌标：白色小羽 + 蓝束口带，压在橙黄渐变上 */
function renderBrand(){
  const bm = document.querySelector("#brandMark");
  if(!bm) return;
  bm.innerHTML = `<svg viewBox="-42 -93 84 119" fill="none" aria-hidden="true">`
    + shuttleBody({ ink:"var(--ink)", feather:"#fff", f1:"#fff", f2:"#fff",
                    band:"var(--accent-2)", cork:"#FFF3E6", w:4, grid:false })
    + `<circle cx="-3.4" cy="6" r="1.7" fill="var(--ink)"/>`
    + `<circle cx="3.4" cy="6" r="1.7" fill="var(--ink)"/>`
    + `<path d="M-2.6 9.4q2.6 2.4 5.2 0" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>`
    + `</svg>`;
}

const PWA = {
  can: (typeof location !== "undefined") && /^https?:$/.test(location.protocol || ""),
  prompt: null, installed: false, sw: false
};

function pwaStandalone(){
  try{
    return !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
        || (typeof navigator !== "undefined" && navigator.standalone === true);
  }catch(e){ return false; }
}
/* 没有安装事件时的替代指引（iOS 必须手动加，安卓/桌面点地址栏图标） */
function pwaHint(ua){
  return /iPhone|iPad|iPod/.test(ua || "")
    ? "在 Safari 里点「分享」→「添加到主屏幕」"
    : "点地址栏右侧的安装图标，或浏览器菜单里的「安装羽迹」";
}

function initPWA(){
  if(!PWA.can) return;
  PWA.installed = pwaStandalone();
  const head = document.head || document.documentElement;
  const add = (tag, attrs) => {
    const el = document.createElement(tag);
    Object.keys(attrs).forEach(k => el.setAttribute(k, attrs[k]));
    head.appendChild(el);
  };
  add("link", { rel:"manifest", href:"manifest.webmanifest" });
  add("link", { rel:"apple-touch-icon", sizes:"180x180", href:"icons/apple-touch-icon.png" });
  add("meta", { name:"mobile-web-app-capable", content:"yes" });
  add("meta", { name:"apple-mobile-web-app-capable", content:"yes" });
  add("meta", { name:"apple-mobile-web-app-title", content:"羽迹" });
  add("meta", { name:"apple-mobile-web-app-status-bar-style", content:"default" });
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.register){
      navigator.serviceWorker.register("sw.js")
        .then(() => { PWA.sw = true; }, () => {});
    }
  }catch(e){}
}

/* 安装卡片：只有真的能装才渲染，避免给一个点了没反应的按钮 */
function pwaCardHTML(){
  if(!PWA.can) return "";
  const line = PWA.installed
    ? "已经装好了：从桌面 / 开始菜单直接启动，不用再找网址。"
    : "装好后像 App 一样打开，断网也能用。";
  const right = PWA.installed
    ? `<span class="pwa-badge">${icon("check")}已安装</span>`
    : (PWA.prompt ? `<button class="btn btn-primary" id="pwaInstall">${icon("down")}安装到桌面</button>` : "");
  return `<div class="card" style="grid-column:1/-1">
    <div class="card-head"><h3>安装到桌面</h3><span class="hint">离线可用 · 独立窗口</span></div>
    <div class="card-body">
      <div class="row" style="gap:12px;align-items:center">
        <div class="pwa-ico">${appIconSVG(46)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:650">把羽迹装成 App</div>
          <div class="hintline">${line}${PWA.installed ? "" : "　" + pwaHint(typeof navigator !== "undefined" ? navigator.userAgent : "")}</div>
        </div>
        ${right}
      </div>
      <div class="hintline" style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)">
        安装只是把界面缓存到本机，让断网也能打开；记录依旧只保存在这台设备上。
      </div>
    </div>
  </div>`;
}

function pwaInstall(){
  const e = PWA.prompt;
  if(!e){ toast("这个浏览器没给出安装入口，试试地址栏右侧的安装图标", "err", "think"); return; }
  PWA.prompt = null;
  try{ e.prompt(); }catch(err){}
  if(e.userChoice && e.userChoice.then) e.userChoice.then(r => {
    if(r && r.outcome === "accepted") toast("装好了，去桌面找羽迹", "ok", "cheer");
  });
  if(currentPage === "profile") refresh();
}

/* 越早挂上越好：beforeinstallprompt 可能在 boot 之前就来了 */
function bindPWA(){
  if(typeof window === "undefined" || !window.addEventListener) return;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    PWA.prompt = e;
    if(currentPage === "profile") refresh();
  });
  window.addEventListener("appinstalled", () => {
    PWA.installed = true; PWA.sw = true;
    if(currentPage === "profile") refresh();
    toast("已安装到桌面", "ok", "cheer");
  });
}
bindPWA();

/* ------------------------- 17. 初始化 ------------------------- */
function boot(){
  applyTheme((state.settings && state.settings.theme) || "light");
  renderBrand();
  applyAppIcon();
  initPWA();
  initRangePick();
  bindGlobal();

  const h = location.hash.replace("#", "");
  go(h && PAGES.find(p => p.id === h) ? h : "dashboard");

  window.addEventListener("hashchange", () => {
    const k = location.hash.replace("#", "");
    if(k && PAGES.find(p => p.id === k)) go(k);
  });
}

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
</body>
</html>
